name: Trailaris Cancel Closed Lane 5 Runs
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_cancel_closed_lane5_runs.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded Lane 5 runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for RUN in 31964215446 31964659049; do
            code=$(curl -sS -o /tmp/cancel-$RUN.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN/cancel")
            echo "run=$RUN http=$code"
            if [ "$code" != "202" ] && [ "$code" != "409" ]; then cat /tmp/cancel-$RUN.json; exit 1; fi
          done
