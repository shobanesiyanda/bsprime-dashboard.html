name: Trailaris R5.4 Expose Causal Engine
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_4_expose_engine.yml']
permissions:
  contents: write
jobs:
  expose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - name: Reconstruct exact R5 causal engine
        run: |
          mkdir -p trailaris_r5_4
          cat trailaris_r5/r5.part00 trailaris_r5/r5.part01 trailaris_r5/r5.part02 trailaris_r5/r5.part03 | base64 -d | gzip -d > trailaris_r5_4/R5_BASE_CAUSAL_ENGINE.py
          python -m py_compile trailaris_r5_4/R5_BASE_CAUSAL_ENGINE.py
      - name: Commit exposed source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_4/R5_BASE_CAUSAL_ENGINE.py
          git commit -m 'build: expose R5 causal engine for R5.4 repair [skip ci]' || true
          git push origin HEAD:trailaris-ephemeral-research-20260815
