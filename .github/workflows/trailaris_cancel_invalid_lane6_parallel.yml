name: Trailaris Cancel Invalid Lane 6 Parallel
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_cancel_invalid_lane6_parallel.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel architecturally invalid Lane 6 parallel run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: '31964051121'
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cancel.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN/cancel")
          echo "run=$RUN http=$code"
          if [ "$code" != "202" ] && [ "$code" != "409" ]; then cat /tmp/cancel.json; exit 1; fi
