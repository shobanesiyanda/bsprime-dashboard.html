name: Trailaris QV2 — Deriv Request Probe V2
on:
  push:
    branches: [trailaris-qv2-50-independent-validation-20260818]
    paths: ['.github/workflows/trailaris_qv2_deriv_request_probe_v2.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-qv2-50-independent-validation-20260818}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save --silent ws
      - name: Probe explicit historical start-end candle request
        run: |
          node - <<'JS'
          const fs=require('fs'),WebSocket=require('ws');
          const requestedEnd=Math.floor(Date.parse('2025-07-21T00:00:00Z')/1000)-1;
          const requestedStart=requestedEnd-9*60;
          const ws=new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');
          const timeout=setTimeout(()=>{console.error('OPEN_TIMEOUT');process.exit(2)},20000);
          ws.on('open',()=>{clearTimeout(timeout);ws.send(JSON.stringify({ticks_history:'R_75',start:requestedStart,end:String(requestedEnd),style:'candles',granularity:60,count:10,adjust_start_time:1,req_id:1}))});
          ws.on('message',m=>{const x=JSON.parse(m.toString());if(x.req_id!==1)return;const candles=x.candles||[];const earliest=candles.length?Math.min(...candles.map(c=>+c.epoch)):null;const latest=candles.length?Math.max(...candles.map(c=>+c.epoch)):null;const out={requested_start_epoch:requestedStart,requested_start_iso:new Date(requestedStart*1000).toISOString(),requested_end_epoch:requestedEnd,requested_end_iso:new Date(requestedEnd*1000).toISOString(),error:x.error||null,candle_count:candles.length,first:candles[0]||null,last:candles.at(-1)||null,earliest_epoch:earliest,latest_epoch:latest,within_requested_window:earliest!==null&&latest!==null&&earliest>=requestedStart-60&&latest<=requestedEnd+60};fs.writeFileSync('trailaris_50_asset/DERIV_REQUEST_PROBE_V2.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));ws.close();process.exit(x.error||!out.within_requested_window?3:0)});
          ws.on('error',e=>{console.error(e);process.exit(4)});
          JS
      - name: Preserve probe
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trailaris_50_asset/DERIV_REQUEST_PROBE_V2.json
          git commit -m 'evidence: explicit-window Deriv request probe [skip ci]'
          git pull --rebase origin trailaris-qv2-50-independent-validation-20260818 || true
          git push origin HEAD:trailaris-qv2-50-independent-validation-20260818
