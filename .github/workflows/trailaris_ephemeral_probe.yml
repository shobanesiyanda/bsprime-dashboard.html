name: Trailaris Ephemeral Acquisition Probe
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_ephemeral_probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trailaris-ephemeral-research-20260815
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trailaris_ephemeral/probe
          python - <<'PY'
          import json, socket, urllib.request
          out={}
          for host in ['data.binance.vision','datafeed.dukascopy.com','ws.binaryws.com']:
              try:
                  out['dns_'+host]=socket.gethostbyname(host)
              except Exception as e:
                  out['dns_'+host]='FAIL:'+repr(e)
          url='https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/5m/BTCUSDT-5m-2026-07.zip.CHECKSUM'
          try:
              with urllib.request.urlopen(url, timeout=20) as r:
                  out['binance_http_status']=getattr(r,'status',200)
                  out['binance_checksum']=r.read(200).decode(errors='replace').strip()
          except Exception as e:
              out['binance_http_status']='FAIL:'+repr(e)
          open('trailaris_ephemeral/probe/base.json','w').write(json.dumps(out,indent=2))
          PY
          npm init -y >/dev/null 2>&1
          npm install dukascopy-node ws --silent
          node - <<'NODE'
          const fs=require('fs');
          const {getHistoricalRates}=require('dukascopy-node');
          const WebSocket=require('ws');
          const result={};
          (async()=>{
            try {
              const d=await getHistoricalRates({instrument:'eurusd',dates:{from:new Date('2026-08-03T00:00:00Z'),to:new Date('2026-08-04T00:00:00Z')},timeframe:'m5',format:'json'});
              result.dukascopy_rows=Array.isArray(d)?d.length:0;
              result.dukascopy_sample=Array.isArray(d)&&d.length?d[0]:null;
            } catch(e){ result.dukascopy_error=String(e); }
            await new Promise((resolve)=>{
              const ws=new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');
              const timer=setTimeout(()=>{result.deriv_error='timeout'; try{ws.terminate()}catch{}; resolve();},20000);
              ws.on('open',()=>ws.send(JSON.stringify({ticks_history:'R_75',count:10,end:'latest',style:'ticks',req_id:1})));
              ws.on('message',(m)=>{try{const x=JSON.parse(m.toString()); if(x.req_id===1){result.deriv_points=x.history?.prices?.length||0; result.deriv_error=x.error?.message||null; clearTimeout(timer); ws.close(); resolve();}}catch(e){}});
              ws.on('error',(e)=>{result.deriv_error=String(e); clearTimeout(timer); resolve();});
            });
            fs.writeFileSync('trailaris_ephemeral/probe/node.json',JSON.stringify(result,null,2));
          })();
          NODE
          python - <<'PY'
          import json
          a=json.load(open('trailaris_ephemeral/probe/base.json')); b=json.load(open('trailaris_ephemeral/probe/node.json'))
          a.update(b)
          a['probe_pass']=bool(isinstance(a.get('binance_http_status'),int) and a.get('dukascopy_rows',0)>0 and a.get('deriv_points',0)>0)
          open('trailaris_ephemeral/probe_result.json','w').write(json.dumps(a,indent=2,default=str))
          print(json.dumps(a,indent=2,default=str))
          PY
      - name: Commit probe result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trailaris_ephemeral/probe_result.json
          git commit -m 'test: Trailaris remote acquisition probe [skip ci]' || true
          git push origin HEAD:trailaris-ephemeral-research-20260815
