name: Trailaris R5.5 Lane 6E Aug13-14 Winner State Forensic
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths:
      - 'trailaris_r5_5/lane6e_aug13_14_winner_state_forensic.py'
      - '.github/workflows/trailaris_r5_5_lane6e_aug13_14_winner_state_forensic.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trailaris-r5-5-lane6e-fresh-forensic
  cancel-in-progress: true

env:
  BRANCH: trailaris-ephemeral-research-20260815
  CACHE_KEY: trailaris-r5-m1-34-20260504-20260814-v1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trailaris-ephemeral-research-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy
      - name: Require frozen pre-Aug13 winner attribution
        run: |
          python - <<'PY'
          import json
          s=json.load(open('trailaris_r5_5/lane6a_results/R5_5_LANE6A_STATUS.json'))
          assert s['state']=='R5_5_LANE6A_WINNER_ATTRIBUTION_COMPLETE'
          assert s['partition']['fresh_outcomes_used_for_selection'] is False
          assert s['scope']=={'approved_routes':34,'strategy_families':15,'route_strategy_cells':510}
          PY
      - name: Reconstruct immutable engine
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: ${{ env.CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Rebuild causal inputs and diagnose fresh state
        run: |
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit EVENT_AUDIT_6E.csv
          python trailaris_r4/build_research_specs.py
          python -m py_compile trailaris_r5_5/lane6e_aug13_14_winner_state_forensic.py
          rm -rf trailaris_r5_5/lane6e_results
          mkdir -p trailaris_r5_5/lane6e_results
          PYTHONPATH=trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5 python trailaris_r5_5/lane6e_aug13_14_winner_state_forensic.py \
            --rawdir trailaris_r5/raw_m1 \
            --specs trailaris_r4/research_proxy_specs.csv \
            --rules trailaris_r5_5/lane6a_results/R5_5_LANE6A_WINNER_RULES.csv \
            --outdir trailaris_r5_5/lane6e_results
      - name: Publish diagnostic evidence
        run: |
          cp -a trailaris_r5_5/lane6e_results /tmp/lane6e_results
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          rm -rf trailaris_r5_5/lane6e_results
          cp -a /tmp/lane6e_results trailaris_r5_5/lane6e_results
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_5/lane6e_results
          git commit -m 'diagnostic: R5.5 Aug13-14 winner state forensic evidence [skip ci]' || exit 0
          for i in 1 2 3; do
            git push origin HEAD:"$BRANCH" && exit 0
            git pull --rebase origin "$BRANCH"
          done
          exit 1
