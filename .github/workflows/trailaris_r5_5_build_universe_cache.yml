name: Trailaris R5.5 Build Full-Universe Replay Cache
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths:
      - '.github/workflows/trailaris_r5_5_build_universe_cache.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct immutable engine
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Rebuild exact causal factor feed
        run: |
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit EVENT_AUDIT_UNIVERSE_CACHE.csv
          python trailaris_r4/build_research_specs.py
      - name: Restore existing fingerprinted universe cache
        id: universe-cache
        uses: actions/cache@v4
        with:
          path: trailaris_r5_5/cached_universe
          key: r55-universe-${{ hashFiles('trailaris_r4/r4_runner.part*','trailaris_r4/r4_adapter.part*','trailaris_r5_4/R5_BASE_CAUSAL_ENGINE.py','trailaris_r5_3/build_released_event_factor_feed.py') }}-raw34v1
      - name: Build immutable 34-route universe once
        if: steps.universe-cache.outputs.cache-hit != 'true'
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5
        run: |
          mkdir -p trailaris_r5_5/cached_universe
          python - <<'PY'
          import json,pickle
          from pathlib import Path
          import R5_BASE_CAUSAL_ENGINE as base
          data,v,cands,opps,fcache=base.build_universe(Path('trailaris_r5/raw_m1'))
          if len(data)!=34:raise SystemExit(f'route gate {len(data)}/34')
          with open('trailaris_r5_5/cached_universe/universe.pkl','wb') as h:pickle.dump((data,v,cands,opps,fcache),h,protocol=5)
          meta={'state':'R5_5_FULL_UNIVERSE_CACHE_BUILT','routes':len(data),'candidate_rows':len(cands),'opportunity_rows':len(opps),'feature_cache_routes':len(fcache)}
          Path('trailaris_r5_5/cached_universe/meta.json').write_text(json.dumps(meta,indent=2));print(json.dumps(meta,indent=2))
          PY
      - name: Verify cache
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5
        run: |
          python - <<'PY'
          import pickle,json
          with open('trailaris_r5_5/cached_universe/universe.pkl','rb') as h:data,v,cands,opps,fcache=pickle.load(h)
          assert len(data)==34
          assert len(fcache)==34
          print(json.dumps({'routes':len(data),'candidates':len(cands),'opportunities':len(opps),'feature_routes':len(fcache)},indent=2))
          PY
