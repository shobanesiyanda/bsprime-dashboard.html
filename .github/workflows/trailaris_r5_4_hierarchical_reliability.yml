name: Trailaris R5.4 Hierarchical Reliability Experiments
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_4_hierarchical_reliability.yml']
permissions:
  contents: write
jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct R4 dependencies
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Rebuild exact baseline evidence/specs
        run: |
          mkdir -p trailaris_r5_4/reliability_results
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit trailaris_r5_4/reliability_results/EVENT_AUDIT.csv
          python trailaris_r4/build_research_specs.py
          python -m py_compile trailaris_r5_4/reliability_common.py trailaris_r5_4/reliability_variants/variant_*.py
      - name: Run shared-universe causal reliability experiments
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants
        run: |
          python trailaris_r5_4/precision_experiment_harness.py --rawdir trailaris_r5/raw_m1 --specs trailaris_r4/research_proxy_specs.csv --variant-dir trailaris_r5_4/reliability_variants --outdir trailaris_r5_4/reliability_results
      - name: Apply strict behavioral non-regression gate
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          import sys;sys.path.insert(0,'trailaris_r5_4')
          from non_regression_gate import evaluate,BASE
          p=Path('trailaris_r5_4/reliability_results/R5_4_PRECISION_EXPERIMENTS.csv');d=pd.read_csv(p)
          out=[]
          for _,r in d.iterrows():
            m=r.to_dict();m['mean_week_pct']=m.pop('mean_week_pct');m['median_week_pct']=m.pop('median_week_pct');m['weeks_ge5']=int(m.pop('weeks_ge5'));m['weeks_ge10']=int(m.pop('weeks_ge10'));m['fresh_max_dd_pct']=m.get('fresh_max_dd_pct',0.);m['profit_factor']=BASE['profit_factor']
            q=evaluate(m);out.append({'variant':r['variant'],**q['checks'],**q['improvements'],'behavioral_non_regression_pass':q['behavioral_non_regression_pass'],'promotion_allowed':q['promotion_allowed']})
          z=pd.DataFrame(out);z.to_csv('trailaris_r5_4/reliability_results/R5_4_STRICT_NON_REGRESSION.csv',index=False)
          best=d.merge(z[['variant','behavioral_non_regression_pass','promotion_allowed']],on='variant').sort_values(['promotion_allowed','end_equity'],ascending=[False,False])
          s={'variants':len(best),'strict_promotion_candidates':int(best.promotion_allowed.sum()),'best':best.iloc[0].to_dict()}
          Path('trailaris_r5_4/reliability_results/R5_4_HIERARCHICAL_RELIABILITY_STATUS.json').write_text(json.dumps(s,indent=2,default=str));print(json.dumps(s,indent=2,default=str))
          # Baseline control must still exactly reproduce R5.3.
          b=best[best.variant=='variant_baseline'].iloc[0];assert abs(float(b.end_equity)-BASE['end_equity'])<=1e-9
          PY
      - name: Commit results safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_4/reliability_results/R5_4_PRECISION_EXPERIMENTS.csv trailaris_r5_4/reliability_results/R5_4_STRICT_NON_REGRESSION.csv trailaris_r5_4/reliability_results/R5_4_HIERARCHICAL_RELIABILITY_STATUS.json trailaris_r5_4/reliability_results/variant_*_weekly.csv
          git commit -m 'test: R5.4 hierarchical reliability experiments [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815
          git push origin HEAD:trailaris-ephemeral-research-20260815
