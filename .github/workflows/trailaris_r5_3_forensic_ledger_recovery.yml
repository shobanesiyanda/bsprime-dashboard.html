name: Trailaris R5.3 Forensic Ledger Recovery
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_3_forensic_ledger_recovery.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trailaris-ephemeral-research-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy
      - name: Reconstruct frozen R4 and R5 engines
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          cat trailaris_r5/r5.part00 trailaris_r5/r5.part01 trailaris_r5/r5.part02 trailaris_r5/r5.part03 | base64 -d | gzip -d > trailaris_r5/trailaris_r5_capture_repair.py
      - name: Restore exact frozen 34-route R5 market cache
        uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Rebuild exact R5.3 causal released-event feed
        run: |
          mkdir -p trailaris_r5_3_forensic
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit trailaris_r5_3_forensic/EVENT_FACTOR_RECONCILIATION_AUDIT.csv
      - name: Build unchanged research sizing specs
        run: python trailaris_r4/build_research_specs.py
      - name: Replay exact frozen R5.3 and preserve forensic ledger
        env:
          PYTHONPATH: trailaris_r4
        run: |
          rm -rf trailaris_r5_3_forensic/raw_results && mkdir -p trailaris_r5_3_forensic/raw_results
          python trailaris_r5/trailaris_r5_capture_repair.py --rawdir trailaris_r5/raw_m1 --specs trailaris_r4/research_proxy_specs.csv --outdir trailaris_r5_3_forensic/raw_results --start 100
      - name: Verify baseline and create forensic manifest
        run: |
          python - <<'PY'
          import hashlib,json,gzip,shutil
          from pathlib import Path
          import pandas as pd
          root=Path('trailaris_r5_3_forensic/raw_results')
          status=json.load(open(root/'R5_STATUS.json'))
          expected=254.4465598357797
          got=float(status['end_equity'])
          assert abs(got-expected)<1e-9,(got,expected)
          manifest={'baseline_id':'TRAILARIS_R5_3_PORTFOLIO_BASELINE_2026-08-16','expected_end_equity':expected,'actual_end_equity':got,'baseline_reconciled':True,'files':[]}
          retain=[]
          for p in sorted(root.iterdir()):
              if not p.is_file(): continue
              rec={'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
              if p.suffix.lower()=='.csv':
                  try:
                      d=pd.read_csv(p)
                      rec['rows']=int(len(d)); rec['columns']=list(d.columns)
                  except Exception as e: rec['csv_error']=str(e)
              manifest['files'].append(rec)
              if p.name in {'R5_events.csv','R5_decisions.csv','R5_walkforward_weekly.csv','R5_confirmed_configs.csv','R5_capture_attribution.csv','R5_34_asset_state.csv'}:
                  retain.append(p)
          Path('trailaris_r5_3_forensic/FORENSIC_LEDGER_MANIFEST.json').write_text(json.dumps(manifest,indent=2))
          for p in retain:
              out=Path('trailaris_r5_3_forensic')/(p.name+'.gz')
              with open(p,'rb') as fi,gzip.open(out,'wb',compresslevel=9) as fo: shutil.copyfileobj(fi,fo)
          shutil.copy2(root/'R5_STATUS.json','trailaris_r5_3_forensic/R5_STATUS.json')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Upload forensic ledger artifact
        uses: actions/upload-artifact@v4
        with:
          name: trailaris-r5-3-forensic-ledgers
          path: |
            trailaris_r5_3_forensic/FORENSIC_LEDGER_MANIFEST.json
            trailaris_r5_3_forensic/R5_STATUS.json
            trailaris_r5_3_forensic/EVENT_FACTOR_RECONCILIATION_AUDIT.csv
            trailaris_r5_3_forensic/*.csv.gz
          retention-days: 7
      - name: Commit forensic ledgers only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin trailaris-ephemeral-research-20260815
          git add -f trailaris_r5_3_forensic/FORENSIC_LEDGER_MANIFEST.json trailaris_r5_3_forensic/R5_STATUS.json trailaris_r5_3_forensic/EVENT_FACTOR_RECONCILIATION_AUDIT.csv trailaris_r5_3_forensic/*.csv.gz
          git commit -m 'audit: recover frozen R5.3 forensic ledgers [skip ci]' || true
          git push origin HEAD:trailaris-ephemeral-research-20260815
