name: Trailaris R5.5 Lane 6E Fast Winner Selector Audit
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['trailaris_r5_5/TRIGGER_LANE6E_SELECTOR_AUDIT']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct immutable engine
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - name: Restore fingerprinted full-universe cache
        uses: actions/cache@v4
        with:
          path: trailaris_r5_5/cached_universe
          key: r55-universe-${{ hashFiles('trailaris_r4/r4_runner.part*','trailaris_r4/r4_adapter.part*','trailaris_r5_4/R5_BASE_CAUSAL_ENGINE.py','trailaris_r5_3/build_released_event_factor_feed.py') }}-raw34v1
          fail-on-cache-miss: true
      - name: Trace fresh winner-like candidates through weekly selector
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5
          TRAILARIS_R55_UNIVERSE_CACHE: trailaris_r5_5/cached_universe/universe.pkl
        run: |
          mkdir -p trailaris_r5_5/lane6e_selector_results
          python trailaris_r5_5/universe_cache_runtime.py trailaris_r5_5/lane6e_fast_selector_audit.py \
            --rawdir trailaris_r5/raw_m1 \
            --rules trailaris_r5_5/lane6a_results/R5_5_LANE6A_WINNER_RULES.csv \
            --out trailaris_r5_5/lane6e_selector_results/R5_5_LANE6E_SELECTOR_STATUS.json
      - name: Publish diagnostic
        run: |
          cp trailaris_r5_5/lane6e_selector_results/R5_5_LANE6E_SELECTOR_STATUS.json /tmp/status.json
          git fetch origin trailaris-ephemeral-research-20260815
          git reset --hard origin/trailaris-ephemeral-research-20260815
          mkdir -p trailaris_r5_5/lane6e_selector_results
          cp /tmp/status.json trailaris_r5_5/lane6e_selector_results/R5_5_LANE6E_SELECTOR_STATUS.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_5/lane6e_selector_results/R5_5_LANE6E_SELECTOR_STATUS.json
          git commit -m 'diagnostic: publish fresh winner selector audit [skip ci]' || exit 0
          git push origin HEAD:trailaris-ephemeral-research-20260815
