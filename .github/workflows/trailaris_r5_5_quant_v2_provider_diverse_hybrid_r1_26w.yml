name: Trailaris R5.5 — Quant V2 Provider-Diverse Hybrid R1 26W

on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_5_quant_v2_provider_diverse_hybrid_r1_26w.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: trailaris-r5-5-quant-v2-provider-diverse-hybrid-r1
  cancel-in-progress: false

jobs:
  provider-diverse-hybrid-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Require completed substantive determinism PASS before advancing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN=32032909765
          ok=0
          for i in $(seq 1 150); do
            status=$(gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/runs/$RUN --jq '.status')
            conclusion=$(gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/runs/$RUN --jq '.conclusion // ""')
            echo "determinism run=$RUN status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              ok=1
              break
            fi
            sleep 60
          done
          test "$ok" -eq 1
          aid=$(gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/runs/$RUN/artifacts --jq '.artifacts[] | select(.name=="trailaris-r5-5-quant-v2-fresh-snapshot-determinism-r2-26w") | .id' | head -n1)
          test -n "$aid"
          gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/artifacts/$aid/zip > /tmp/determinism.zip
          rm -rf /tmp/determinism && mkdir -p /tmp/determinism
          unzip -q /tmp/determinism.zip -d /tmp/determinism
          python - <<'PY'
          import json
          from pathlib import Path
          p=next(Path('/tmp/determinism').rglob('FRESH_R2_DETERMINISM_AUDIT.json'))
          x=json.loads(p.read_text())
          assert x['state']=='FRESH_SNAPSHOT_DETERMINISM_PASS', x
          assert x['same_raw_snapshot_for_both_runs'] is True
          assert not x['metric_differences']
          assert all(v['identical'] for v in x['csv_identity'].values())
          print('UPSTREAM_DETERMINISM_GATE PASS')
          PY

      - name: Checkout frozen Quant V2 rules commit
        uses: actions/checkout@v4
        with:
          ref: 194031e05594e6921b5410e3eb328a5fb53fde94
          path: source

      - name: Checkout validation harness only
        uses: actions/checkout@v4
        with:
          ref: trailaris-ephemeral-research-20260815
          path: validation

      - name: Checkout immutable acquisition and R4 engine estate
        uses: actions/checkout@v4
        with:
          ref: trailaris-r5-4-26week-validation-20260816
          path: engine

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build provider-diverse workspace
        run: |
          mkdir -p source/trailaris_longcycle source/trailaris_quant_v2_provider_diverse_r1
          cp engine/trailaris_longcycle/acquire_m1_26w.js source/trailaris_longcycle/
          cp engine/trailaris_longcycle/build_longcycle_factors.py source/trailaris_longcycle/
          cp validation/trailaris_r5_5/acquire_provider_diverse_m1.py source/trailaris_r5_5/

      - name: Install exact engine and independent-provider dependencies
        working-directory: source
        run: |
          python -m pip install --quiet pandas numpy requests beautifulsoup4
          npm install --no-save --silent dukascopy-node@1.50.0 ws
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          python -m py_compile trailaris_r5_5/quantitative_integrated_v2.py trailaris_r5_5/run_longcycle_variant_accelerated.py trailaris_r5_5/acquire_provider_diverse_m1.py

      - name: Acquire primary-only route substrate with strict retry and no synthetic fill
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf trailaris_longcycle/raw_m1 && mkdir -p trailaris_longcycle/raw_m1
          pass=0
          for attempt in 1 2 3; do
            echo "PRIMARY_SUBSTRATE_ATTEMPT=$attempt"
            set +e
            node trailaris_longcycle/acquire_m1_26w.js > trailaris_quant_v2_provider_diverse_r1/primary_node_attempt_${attempt}.log 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then continue; fi
            if python - <<'PY'
          import pandas as pd
          from pathlib import Path
          start=pd.Timestamp('2026-01-19T00:00:00Z'); end=pd.Timestamp('2026-08-14T23:59:59Z')
          primary=['US30','NATGAS','V75','V50','V100','V25','V10']
          for a in primary:
              p=Path('trailaris_longcycle/raw_m1')/f'{a}_M1_normalized.csv'
              assert p.exists(),a
              d=pd.read_csv(p,usecols=['timestamp']); ts=pd.to_datetime(d.timestamp,utc=True,errors='coerce').dropna().sort_values()
              assert len(ts)>=1000,a
              assert ts.min()<=start+pd.Timedelta(days=1),(a,ts.min())
              assert ts.max()>=end-pd.Timedelta(days=2),(a,ts.max())
          print('PRIMARY_ONLY_7_ROUTE_SUBSTRATE PASS')
          PY
            then pass=1; break; fi
          done
          test "$pass" -eq 1

      - name: Replace 27 routes with independent-provider histories
        working-directory: source
        run: |
          python trailaris_r5_5/acquire_provider_diverse_m1.py --rawdir trailaris_longcycle/raw_m1 --evidence trailaris_quant_v2_provider_diverse_r1

      - name: Enforce 34-route source provenance and coverage gate
        working-directory: source
        run: |
          python - <<'PY'
          import hashlib,json
          import pandas as pd
          from pathlib import Path
          routes=['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','NZDUSD','EURJPY','GBPJPY','EURGBP','AUDJPY','CADJPY','GBPCHF','XAUUSD','XAGUSD','BTCUSD','ETHUSD','SOLUSD','BNBUSD','XRPUSD','US100','US500','US30','GER40','UK100','JP225','WTI','BRENT','NATGAS','V75','V50','V100','V25','V10']
          hist={'EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','NZDUSD','EURJPY','GBPJPY','EURGBP','AUDJPY','CADJPY','GBPCHF','XAUUSD','XAGUSD','US100','US500','GER40','UK100','JP225','WTI','BRENT'}
          crypto={'BTCUSD','ETHUSD','SOLUSD','BNBUSD','XRPUSD'}
          primary={'US30','NATGAS','V75','V50','V100','V25','V10'}
          start=pd.Timestamp('2026-01-19T00:00:00Z'); end=pd.Timestamp('2026-08-14T23:59:59Z'); rows=[]
          for a in routes:
              p=Path('trailaris_longcycle/raw_m1')/f'{a}_M1_normalized.csv'; assert p.exists(),a
              d=pd.read_csv(p,usecols=['timestamp','source']); ts=pd.to_datetime(d.timestamp,utc=True,errors='coerce').dropna().sort_values(); src=sorted(map(str,d.source.dropna().unique()))
              assert len(ts)>=1000,a
              assert ts.min()<=start+pd.Timedelta(days=1),(a,ts.min())
              assert ts.max()>=end-pd.Timedelta(days=2),(a,ts.max())
              if a in hist: assert src==['HISTDATA_GENERIC_ASCII_M1_BID_INDEPENDENT_PROVIDER'],(a,src)
              if a in crypto: assert src==['COINBASE_EXCHANGE_OFFICIAL_M1_INDEPENDENT_PROVIDER'],(a,src)
              if a in {'US30','NATGAS'}: assert src==['DUKASCOPY_OFFICIAL_M1_BID_RESEARCH_PROXY'],(a,src)
              if a in {'V75','V50','V100','V25','V10'}: assert src==['DERIV_OFFICIAL_M1_CANDLES'],(a,src)
              rows.append({'asset':a,'rows':len(d),'first':str(ts.min()),'last':str(ts.max()),'source':'|'.join(src),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'independent_provider_route':a in hist or a in crypto})
          out=pd.DataFrame(rows); out.to_csv('trailaris_quant_v2_provider_diverse_r1/PROVIDER_ROUTE_PROVENANCE.csv',index=False)
          s={'state':'PROVIDER_DIVERSE_34_ROUTE_NORMALIZATION_PASS','routes':34,'independent_provider_routes':int(out.independent_provider_route.sum()),'primary_source_routes':int((~out.independent_provider_route).sum()),'full_independent_provider_claim':False,'primary_source_assets':out.loc[~out.independent_provider_route,'asset'].tolist(),'promotion_allowed':False}
          Path('trailaris_quant_v2_provider_diverse_r1/PROVIDER_DIVERSE_SOURCE_GATE.json').write_text(json.dumps(s,indent=2)); print(json.dumps(s,indent=2))
          assert s['independent_provider_routes']==27 and s['primary_source_routes']==7
          PY

      - name: Restore immutable 510-cell factory audit
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/factory && mkdir -p /tmp/factory trailaris_longcycle/results
          gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/artifacts/9268762003/zip > /tmp/factory.zip
          echo '3e5258cba30bc0d2d034e6cb9ae62c5520d04bda69ca4dc45183e7b861dcf86d  /tmp/factory.zip' | sha256sum -c -
          unzip -q /tmp/factory.zip -d /tmp/factory
          cp /tmp/factory/results/R4_FACTORY_AUDIT.csv trailaris_longcycle/results/R4_FACTORY_AUDIT.csv
          python - <<'PY'
          import pandas as pd
          a=pd.read_csv('trailaris_longcycle/results/R4_FACTORY_AUDIT.csv'); assert len(a)==510 and a.strategy_family.nunique()==15
          print('IMMUTABLE_510_CELL_FACTORY_GATE PASS')
          PY

      - name: Rebuild causal factors and specs from provider-diverse estate
        working-directory: source
        run: |
          python trailaris_longcycle/build_longcycle_factors.py --rawdir trailaris_longcycle/raw_m1 --out trailaris_longcycle/raw_m1/Trailaris_R3_FactorFeed.csv --audit trailaris_quant_v2_provider_diverse_r1/PROVIDER_DIVERSE_FACTOR_EVIDENCE.json
          python trailaris_r4/build_research_specs.py

      - name: Execute frozen Quant V2 on provider-diverse 26-week estate
        working-directory: source
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5
        run: |
          rm -rf trailaris_quant_v2_provider_diverse_r1/results && mkdir -p trailaris_quant_v2_provider_diverse_r1/results
          python trailaris_r5_5/run_longcycle_variant_accelerated.py --rawdir trailaris_longcycle/raw_m1 --specs trailaris_r4/research_proxy_specs.csv --variant trailaris_r5_5/quantitative_integrated_v2.py --name R5_5_QUANTITATIVE_V2_PROVIDER_DIVERSE_HYBRID_R1 --outdir trailaris_quant_v2_provider_diverse_r1/results

      - name: Build provider-diverse replay audit
        if: always()
        working-directory: source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('trailaris_quant_v2_provider_diverse_r1')
          audit={'state':'PROVIDER_DIVERSE_HYBRID_REPLAY_INCOMPLETE','candidate_rules_commit':'194031e05594e6921b5410e3eb328a5fb53fde94','determinism_upstream_run_id':32032909765,'historical_window':{'start':'2026-01-19T00:00:00Z','end':'2026-08-14T23:59:59Z','evaluated_weeks':26},'full_independent_provider_claim':False,'promotion_allowed':False,'next_gate':'TARGET_SERVER_BROKER_DATA_REPRODUCTION_AND_EXECUTION_PROVENANCE'}
          sg=root/'PROVIDER_DIVERSE_SOURCE_GATE.json'
          if sg.exists(): audit['source_gate']=json.loads(sg.read_text())
          statuses=list((root/'results').glob('*_STATUS.json')) if (root/'results').exists() else []
          if statuses:
              q=json.loads(statuses[0].read_text()); audit['candidate']=q.get('candidate',q); audit['result_status_file']=statuses[0].name; audit['state']='PROVIDER_DIVERSE_HYBRID_27_OF_34_REPLAY_COMPLETE__NON_PROMOTIONAL'
          (root/'PROVIDER_DIVERSE_REPLAY_AUDIT.json').write_text(json.dumps(audit,indent=2)); print(json.dumps(audit,indent=2))
          PY

      - name: Upload provider-diverse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trailaris-r5-5-quant-v2-provider-diverse-hybrid-r1-26w
          path: source/trailaris_quant_v2_provider_diverse_r1/
          retention-days: 30
