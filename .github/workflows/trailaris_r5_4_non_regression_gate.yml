name: Trailaris R5.4 Behavioral Non-Regression Gate
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_4_non_regression_gate.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: cd trailaris_r5_4 && python -m py_compile non_regression_gate.py test_non_regression_gate.py && python test_non_regression_gate.py
