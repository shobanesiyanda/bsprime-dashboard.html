name: Trailaris Quant V2 — Closed Balance Replay

on:
  push:
    branches: [trailaris-r5-4-26week-validation-20260816]
    paths:
      - '.github/workflows/trailaris_qv2_balance_replay_owner.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: trailaris-qv2-closed-balance-replay
  cancel-in-progress: false

env:
  QV2_BLOB: 120390ab52e80f51bafedc42389ceb7420a410f2
  QV2_EVIDENCE_ARTIFACT_ID: 9284801783
  RESULT_BRANCH: trailaris-quant-v2-100-asset-canonical-expansion-20260818

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout cache-owning 34-asset estate at workspace root
        uses: actions/checkout@v4
        with:
          ref: trailaris-r5-4-26week-validation-20260816

      - name: Checkout current Quant V2 source and result branch
        uses: actions/checkout@v4
        with:
          ref: trailaris-quant-v2-100-asset-canonical-expansion-20260818
          path: source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy

      - name: Verify preserved Quant V2 identities
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v2.py)" = "$QV2_BLOB"
          test "$(git rev-parse HEAD:trailaris_r5_5/longcycle_integrated_negative_refinement.py)" = "a6f6fcc8dfc1d265c5917dc9df3f3c73eb08d6cb"
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v1.py)" = "c3debf8da3f184d86c59a287b25a58ebe105bd03"
          test "$(git rev-parse HEAD:trailaris_r5_5/run_quantitative_v2_from_canonical_v2_estate.py)" = "7bdd29922829a3ac53c110dd91a7d5f14201cc34"

      - name: Restore exact preserved 34-asset M1 estate
        uses: actions/cache/restore@v4
        with:
          path: trailaris_longcycle/raw_m1
          key: trailaris-r5-4-m1-34-20260119-20260814-v1
          fail-on-cache-miss: true

      - name: Inject preserved Quant V2 replay sources
        run: |
          set -euo pipefail
          mkdir -p trailaris_r5_5
          cp source/trailaris_r5_5/longcycle_bounded_memory_candidate.py trailaris_r5_5/
          cp source/trailaris_r5_5/longcycle_integrated_negative_refinement.py trailaris_r5_5/
          cp source/trailaris_r5_5/quantitative_integrated_v1.py trailaris_r5_5/
          cp source/trailaris_r5_5/run_quantitative_v2_from_canonical_v2_estate.py trailaris_r5_5/

      - name: Reconstruct exact R4 dependencies and research specs
        run: |
          set -euo pipefail
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          python trailaris_r4/build_research_specs.py

      - name: Fetch preserved $1389.64 Quant V2 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p qv2_reference
          gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/artifacts/${QV2_EVIDENCE_ARTIFACT_ID}/zip > qv2_reference.zip
          echo '8c6e42d95e107c1826c9a9c4cd533153ab866b09b55d6329ec3e1e726a12cac7  qv2_reference.zip' | sha256sum -c -
          unzip -q qv2_reference.zip -d qv2_reference
          test -f qv2_reference/R5_5_QUANTITATIVE_V2_EXACT_ESTATE_PROMOTED.csv
          test -f qv2_reference/R5_5_QUANTITATIVE_V2_EXACT_ESTATE_STATUS.json

      - name: Apply isolated realized closed-balance lot sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          engine=Path('trailaris_r5_4/R5_BASE_CAUSAL_ENGINE.py')
          src=engine.read_text()
          old='r4.size_trade(r.asset,eq,rf,float(r.stop_distance),specs)'
          new='r4.size_trade(r.asset,balance,rf,float(r.stop_distance),specs)'
          assert src.count(old)==2, src.count(old)
          engine.write_text(src.replace(old,new))
          assert engine.read_text().count(old)==0
          assert engine.read_text().count(new)==2
          print('CLOSED_BALANCE_SIZING_APPLIED_TO_BOTH_FRESH_ENTRY_PATHS')
          PY

      - name: Replay exact promoted estate
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          import trailaris_r4_full_universe_loop as r4
          import longcycle_integrated_negative_refinement as v2
          from run_quantitative_v2_from_canonical_v2_estate import load_feature_cache, replay_estate

          ref_status=json.loads(Path('qv2_reference/R5_5_QUANTITATIVE_V2_EXACT_ESTATE_STATUS.json').read_text())
          ref=ref_status['candidate']
          assert abs(ref['end_equity']-1389.6425169269207)<1e-9
          assert abs(ref['compounded_return_pct']-1289.6425169269207)<1e-9
          assert ref['positive_weeks']==26
          assert abs(ref['profit_factor']-2.9703730692297037)<1e-12

          P=pd.read_csv('qv2_reference/R5_5_QUANTITATIVE_V2_EXACT_ESTATE_PROMOTED.csv')
          assert len(P)==3151, len(P)
          for c in ('entry_time','decision_time','exit_time','eval_week'):
              P[c]=pd.to_datetime(P[c],utc=True,errors='coerce')
          assert not P[['entry_time','decision_time','exit_time','eval_week']].isna().any().any()
          assert P.eval_week.nunique()==26

          specs=r4.load_specs(Path('trailaris_r4/research_proxy_specs.csv'),'research-proxy')
          routes=list(r4.ROUTES)
          assert len(routes)==34
          fcache,raw_end=load_feature_cache(Path('trailaris_longcycle/raw_m1'),routes)
          result,W,EV,DE,R=replay_estate(P,specs,fcache,raw_end,v2,r4)

          report={
            'state':'BALANCE_REPLAY_COMPLETE',
            'assets':34,
            'weeks':26,
            'starting_balance_usd':100.0,
            'preserved_reference':ref,
            'realized_closed_balance_replay':result,
            'delta_replay_minus_reference':{
              'ending_balance_usd':result['end_equity']-ref['end_equity'],
              'compounded_return_percentage_points':result['compounded_return_pct']-ref['compounded_return_pct'],
              'profit_factor':result['profit_factor']-ref['profit_factor'],
              'max_weekly_drawdown_percentage_points':result['max_weekly_drawdown_pct']-ref['max_weekly_drawdown_pct'],
              'max_event_drawdown_percentage_points':result['max_event_equity_drawdown_pct']-ref['max_event_equity_drawdown_pct'],
              'executed_trades':result['executed_trades']-ref['executed_trades']
            },
            'sizing_semantic':'All new entries, including strategy-authorized add-ons and post-recycle entries, use current realized closed account balance as the account-size input to lot sizing. Eligibility, ranking, strategy state, exposure controls, execution and management are unchanged.',
            'baseline_status':'REFERENCE_PRESERVED__NO_AUTOMATIC_REPLACEMENT'
          }
          out=Path('trailaris_r5_5/balance_replay_evidence'); out.mkdir(parents=True,exist_ok=True)
          (out/'QV2_34_BALANCE_REPLAY_STATUS.json').write_text(json.dumps(report,indent=2,default=str))
          W.to_csv(out/'BALANCE_REPLAY_WEEKLY.csv',index=False)
          EV.to_csv(out/'BALANCE_REPLAY_EVENTS.csv',index=False)
          DE.to_csv(out/'BALANCE_REPLAY_DECISIONS.csv',index=False)
          R.to_csv(out/'BALANCE_REPLAY_ROLLING_11W.csv',index=False)
          print(json.dumps(report,indent=2,default=str))
          PY

      - name: Upload replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: trailaris-qv2-34-closed-balance-replay
          path: trailaris_r5_5/balance_replay_evidence/
          retention-days: 30

      - name: Commit compact result to 100-asset expansion branch
        run: |
          set -euo pipefail
          mkdir -p source/trailaris_100_asset
          cp trailaris_r5_5/balance_replay_evidence/QV2_34_BALANCE_REPLAY_STATUS.json source/trailaris_100_asset/QV2_34_BALANCE_REPLAY_RESULT.json
          cd source
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trailaris_100_asset/QV2_34_BALANCE_REPLAY_RESULT.json
          git commit -m 'evidence: 34-asset closed-balance replay result [skip ci]'
          git pull --rebase origin "$RESULT_BRANCH"
          git push origin HEAD:"$RESULT_BRANCH"
