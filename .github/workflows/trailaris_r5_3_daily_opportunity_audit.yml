name: Trailaris R5.3 Daily Opportunity Audit
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_3_daily_opportunity_audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trailaris-ephemeral-research-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct frozen R4 engine
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - name: Restore exact 34-route frozen cache
        uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Reconstruct daily opportunity ledger
        env:
          PYTHONPATH: trailaris_r4
        run: |
          mkdir -p trailaris_r5_3_forensic
          python - <<'PY'
          import json,gzip,shutil
          from pathlib import Path
          import pandas as pd
          import trailaris_r4_full_universe_loop as r4
          raw=Path('trailaris_r5/raw_m1')
          data,val=r4.validate_34(raw,'research-proxy')
          assert len(data)==34, f'{len(data)}/34 routes'
          frames=[]
          for a in r4.ROUTES:
              o=r4.opportunity_ledger(a,data[a])
              if len(o): frames.append(o)
          d=pd.concat(frames,ignore_index=True)
          d['day']=pd.to_datetime(d['day'],utc=True)
          start=pd.Timestamp('2026-06-01T00:00:00Z'); end=pd.Timestamp('2026-08-14T23:59:59Z')
          d=d[(d.day>=start)&(d.day<=end)].copy()
          out=Path('trailaris_r5_3_forensic/R5_3_DAILY_OPPORTUNITY.csv')
          d.to_csv(out,index=False)
          with open(out,'rb') as fi,gzip.open(str(out)+'.gz','wb',compresslevel=9) as fo: shutil.copyfileobj(fi,fo)
          summary={
            'routes':int(d.asset.nunique()),'asset_days':int(len(d)),
            'directional_open_close_pct_sum':float(d.directional_open_close_pct.sum()),
            'executable_swing_pct_sum':float(d.executable_swing_pct.sum()),
            'gross_session_open_range_pct_sum':float(d.gross_session_open_range_pct.sum()),
            'open_60m_move_pct_sum':float(d.open_60m_move_pct.sum()),
            'close_60m_move_pct_sum':float(d.close_60m_move_pct.sum()),
            'segments':int(d.segments.sum())
          }
          Path('trailaris_r5_3_forensic/DAILY_OPPORTUNITY_SUMMARY.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - name: Commit audit evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f trailaris_r5_3_forensic/R5_3_DAILY_OPPORTUNITY.csv
          git pull --rebase origin trailaris-ephemeral-research-20260815
          git add -f trailaris_r5_3_forensic/R5_3_DAILY_OPPORTUNITY.csv.gz trailaris_r5_3_forensic/DAILY_OPPORTUNITY_SUMMARY.json
          git commit -m 'audit: persist R5.3 daily full-universe opportunity evidence [skip ci]' || true
          git push origin HEAD:trailaris-ephemeral-research-20260815
