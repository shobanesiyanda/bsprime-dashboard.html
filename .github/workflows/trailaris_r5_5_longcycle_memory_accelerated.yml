name: Trailaris R5.5 Bounded-Memory Accelerated 26-Week Candidate
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths:
      - '.github/workflows/trailaris_r5_5_longcycle_memory_accelerated.yml'
      - 'trailaris_r5_5/run_longcycle_r5_5_memory_accelerated.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  accelerated_candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout active R5.5 research branch
        uses: actions/checkout@v4
        with:
          ref: trailaris-ephemeral-research-20260815
          path: active
      - name: Checkout immutable frozen R5.4 26-week estate
        uses: actions/checkout@v4
        with:
          ref: trailaris-r5-4-26week-validation-20260816
          path: frozen
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: |
          python -m pip install --quiet pandas numpy
          cd frozen
          npm install --no-save --silent dukascopy-node@1.50.0 ws
      - name: Inject isolated R5.5 candidate and accelerated evaluator
        run: |
          mkdir -p frozen/trailaris_r5_5
          cp active/trailaris_r5_5/longcycle_bounded_memory_candidate.py frozen/trailaris_r5_5/
          cp active/trailaris_r5_5/run_longcycle_r5_5_memory_accelerated.py frozen/trailaris_r5_5/
      - name: Reconstruct exact frozen dependencies
        working-directory: frozen
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          python -m py_compile trailaris_r5_5/longcycle_bounded_memory_candidate.py trailaris_r5_5/run_longcycle_r5_5_memory_accelerated.py
      - name: Restore active-branch 34-route M1 cache
        id: cache
        uses: actions/cache@v4
        with:
          path: frozen/trailaris_longcycle/raw_m1
          key: trailaris-r5-5-m1-34-20260119-20260814-v1
      - name: Acquire exact extended 34-route M1 history on miss
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: frozen
        shell: bash
        run: |
          set -e
          rm -rf trailaris_longcycle/raw_m1 && mkdir -p trailaris_longcycle/raw_m1
          node trailaris_longcycle/acquire_m1_26w.js > trailaris_longcycle/acquire_node.log 2>&1 & P1=$!
          python trailaris_longcycle/acquire_binance_m1_26w.py > trailaris_longcycle/acquire_binance.log 2>&1 & P2=$!
          wait $P1
          wait $P2
      - name: Enforce authentic 34-route gate
        working-directory: frozen
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          routes=['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','NZDUSD','EURJPY','GBPJPY','EURGBP','AUDJPY','CADJPY','GBPCHF','XAUUSD','XAGUSD','BTCUSD','ETHUSD','SOLUSD','BNBUSD','XRPUSD','US100','US500','US30','GER40','UK100','JP225','WTI','BRENT','NATGAS','V75','V50','V100','V25','V10']
          start=pd.Timestamp('2026-01-19T00:00:00Z');end=pd.Timestamp('2026-08-14T23:59:59Z');passed=[]
          for a in routes:
              p=Path('trailaris_longcycle/raw_m1')/f'{a}_M1_normalized.csv';assert p.exists(),a
              d=pd.read_csv(p,usecols=['timestamp']);ts=pd.to_datetime(d.timestamp,utc=True,errors='coerce').sort_values();med=ts.diff().dropna().dt.total_seconds().median()
              assert not ts.isna().any() and len(d)>=1000 and (pd.isna(med) or med<=75) and ts.min()<=start+pd.Timedelta(days=1) and ts.max()>=end-pd.Timedelta(days=2),a
              passed.append(a)
          assert len(passed)==34;print('AUTHENTIC_34_ROUTE_GATE PASS')
          PY
      - name: Build identical timestamp-causal factors and specs
        working-directory: frozen
        run: |
          python trailaris_longcycle/build_longcycle_factors.py --rawdir trailaris_longcycle/raw_m1 --out trailaris_longcycle/raw_m1/Trailaris_R3_FactorFeed.csv --audit trailaris_longcycle/R5_5_ACCEL_FACTOR_EVIDENCE.json
          python trailaris_r4/build_research_specs.py
      - name: Execute accelerated full-scope causal candidate
        working-directory: frozen
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5
        run: |
          rm -rf trailaris_longcycle/r5_5_memory_accel && mkdir -p trailaris_longcycle/r5_5_memory_accel
          python trailaris_r5_5/run_longcycle_r5_5_memory_accelerated.py --rawdir trailaris_longcycle/raw_m1 --specs trailaris_r4/research_proxy_specs.csv --outdir trailaris_longcycle/r5_5_memory_accel
      - name: Upload complete accelerated evidence
        uses: actions/upload-artifact@v4
        with:
          name: trailaris-r5-5-memory112-accelerated-26week
          path: frozen/trailaris_longcycle/r5_5_memory_accel/
          retention-days: 30
      - name: Commit compact accelerated evidence
        if: success()
        run: |
          mkdir -p active/trailaris_r5_5/longcycle_results
          cp frozen/trailaris_longcycle/r5_5_memory_accel/R5_5_MEMORY112_STATUS.json active/trailaris_r5_5/longcycle_results/
          cp frozen/trailaris_longcycle/r5_5_memory_accel/R5_5_MEMORY112_WEEKLY.csv active/trailaris_r5_5/longcycle_results/
          cp frozen/trailaris_longcycle/r5_5_memory_accel/R5_5_MEMORY112_ROLLING_11W.csv active/trailaris_r5_5/longcycle_results/
          cd active
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_5/longcycle_results/R5_5_MEMORY112_*
          git commit -m 'test: accelerated R5.5 memory112 26-week evidence [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815 || true
          git push origin HEAD:trailaris-ephemeral-research-20260815
