name: Trailaris R5.5 Prime Research Universe Cache
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths:
      - '.github/workflows/trailaris_r5_5_prime_research_universe_cache.yml'
      - 'trailaris_r5_5/research_universe_cache.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trailaris-r5-5-prime-universe-cache
  cancel-in-progress: true
env:
  RAW_CACHE_KEY: trailaris-r5-m1-34-20260504-20260814-v1
  SNAPSHOT_KEY: trailaris-r55-base-universe-34-20260504-20260814-v1
jobs:
  prime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct immutable engine
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: ${{ env.RAW_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Build causal feed/specs
        run: |
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit EVENT_AUDIT_R55_UNIVERSE_CACHE.csv
          python trailaris_r4/build_research_specs.py
      - name: Restore existing snapshot when available
        id: snapshot
        uses: actions/cache@v4
        with:
          path: .trailaris_runtime_cache/r55_base_universe.pkl
          key: ${{ env.SNAPSHOT_KEY }}
      - name: Build exact base-universe snapshot if absent
        if: steps.snapshot.outputs.cache-hit != 'true'
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_5
        run: |
          python - <<'PY'
          from pathlib import Path
          import R5_BASE_CAUSAL_ENGINE as base
          from research_universe_cache import load_or_build
          u=load_or_build(base,Path('trailaris_r5/raw_m1'),Path('.trailaris_runtime_cache/r55_base_universe.pkl'))
          data,v,cands,opps,fcache=u
          assert len(data)==34
          print({'routes':len(data),'candidates':len(cands),'opportunities':len(opps),'feature_routes':len(fcache)})
          PY
