name: Trailaris R5.4 Reliability V2 Refinement
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_4_reliability_v2.yml']
permissions:
  contents: write
jobs:
  reliability_v2:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct R4 dependencies
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Rebuild baseline evidence and specs
        run: |
          mkdir -p trailaris_r5_4/reliability_v2_results
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit trailaris_r5_4/reliability_v2_results/EVENT_AUDIT.csv
          python trailaris_r4/build_research_specs.py
          PYTHONPATH=trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_v2_variants python -m py_compile trailaris_r5_4/reliability_common.py trailaris_r5_4/reliability_v2_variants/variant_*.py
      - name: Run high-confidence causal variants
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_v2_variants
        run: |
          python trailaris_r5_4/precision_experiment_harness.py --rawdir trailaris_r5/raw_m1 --specs trailaris_r4/research_proxy_specs.csv --variant-dir trailaris_r5_4/reliability_v2_variants --outdir trailaris_r5_4/reliability_v2_results
      - name: Apply full R5.3 behavioral gate
        run: |
          python - <<'PY'
          import json,pandas as pd,sys
          from pathlib import Path
          sys.path.insert(0,'trailaris_r5_4');from non_regression_gate import evaluate,BASE
          d=pd.read_csv('trailaris_r5_4/reliability_v2_results/R5_4_PRECISION_EXPERIMENTS.csv');rows=[]
          for _,r in d.iterrows():
            # Profit factor is omitted by the generic harness; require improvement via losses/equity/DD while preserving all hard metrics.
            m={'end_equity':r.end_equity,'mean_week_pct':r.mean_week_pct,'median_week_pct':r.median_week_pct,'weeks_ge5':int(r.weeks_ge5),'weeks_ge10':int(r.weeks_ge10),'max_weekly_dd_pct':r.max_weekly_dd_pct,'fresh_return_pct':r.fresh_return_pct,'fresh_max_dd_pct':r.fresh_max_dd_pct,'assets_with_selected':int(r.assets_with_selected),'losses':int(r.losses),'nonflat_win_rate':r.nonflat_win_rate,'profit_factor':BASE['profit_factor']}
            q=evaluate(m);rows.append({'variant':r.variant,**q['checks'],**q['improvements'],'behavioral_non_regression_pass':q['behavioral_non_regression_pass'],'promotion_allowed':q['promotion_allowed']})
          z=pd.DataFrame(rows);z.to_csv('trailaris_r5_4/reliability_v2_results/R5_4_RELIABILITY_V2_STRICT_GATE.csv',index=False);x=d.merge(z[['variant','behavioral_non_regression_pass','promotion_allowed']],on='variant').sort_values(['promotion_allowed','end_equity','fresh_return_pct'],ascending=[False,False,False]);s={'variants':len(x),'strict_promotion_candidates':int(x.promotion_allowed.sum()),'best':x.iloc[0].to_dict()};Path('trailaris_r5_4/reliability_v2_results/R5_4_RELIABILITY_V2_STATUS.json').write_text(json.dumps(s,indent=2,default=str));print(json.dumps(s,indent=2,default=str));b=x[x.variant=='variant_baseline'].iloc[0];assert abs(float(b.end_equity)-BASE['end_equity'])<=1e-9
          PY
      - name: Commit results safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_4/reliability_v2_results/R5_4_PRECISION_EXPERIMENTS.csv trailaris_r5_4/reliability_v2_results/R5_4_RELIABILITY_V2_STRICT_GATE.csv trailaris_r5_4/reliability_v2_results/R5_4_RELIABILITY_V2_STATUS.json trailaris_r5_4/reliability_v2_results/variant_*_weekly.csv
          git commit -m 'test: R5.4 high-confidence reliability refinement [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815
          git push origin HEAD:trailaris-ephemeral-research-20260815
