name: Trailaris R5.5 Lane 6 Winner Maximization Parallel
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_5_lane6_winner_parallel.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trailaris-r5-5-lane6-winner-parallel
  cancel-in-progress: false

env:
  BRANCH: trailaris-ephemeral-research-20260815
  CACHE_KEY: trailaris-r5-m1-34-20260504-20260814-v1

jobs:
  amplification:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        rule_rank: [0, 1]
        copies: [1, 2, 3]
        quality_boost: [0.00, 0.04]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Require frozen winner attribution
        run: |
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          python - <<'PY'
          import json
          s=json.load(open('trailaris_r5_5/lane6a_results/R5_5_LANE6A_STATUS.json'))
          assert s['state']=='R5_5_LANE6A_WINNER_ATTRIBUTION_COMPLETE'
          assert s['scope']=={'approved_routes':34,'strategy_families':15,'route_strategy_cells':510}
          assert s['partition']['fresh_outcomes_used_for_selection'] is False
          PY
      - name: Reconstruct engine and causal inputs
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: ${{ env.CACHE_KEY }}
          fail-on-cache-miss: true
      - run: |
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit EVENT_AUDIT_6B_${{ matrix.rule_rank }}_${{ matrix.copies }}_${{ matrix.quality_boost }}.csv
          python trailaris_r4/build_research_specs.py
          python -m py_compile trailaris_r5_5/lane6b_winner_amplification.py
          mkdir -p lane6b_rule
          PYTHONPATH=trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5 python trailaris_r5_5/lane6b_winner_amplification.py --rawdir trailaris_r5/raw_m1 --specs trailaris_r4/research_proxy_specs.csv --rules trailaris_r5_5/lane6a_results/R5_5_LANE6A_WINNER_RULES.csv --rule-rank ${{ matrix.rule_rank }} --copies ${{ matrix.copies }} --quality-boost ${{ matrix.quality_boost }} --outdir lane6b_rule
      - uses: actions/upload-artifact@v4
        with:
          name: lane6b-${{ matrix.rule_rank }}-${{ matrix.copies }}-${{ matrix.quality_boost }}
          path: lane6b_rule/result.json
          retention-days: 3

  payoff_extension:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        rule_rank: [0, 1]
        runner_frac: [0.25, 0.50]
        target_r: [4.0, 5.0, 6.0]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Require frozen winner attribution
        run: |
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          python - <<'PY'
          import json
          s=json.load(open('trailaris_r5_5/lane6a_results/R5_5_LANE6A_STATUS.json'))
          assert s['state']=='R5_5_LANE6A_WINNER_ATTRIBUTION_COMPLETE'
          assert s['scope']=={'approved_routes':34,'strategy_families':15,'route_strategy_cells':510}
          assert s['partition']['fresh_outcomes_used_for_selection'] is False
          PY
      - name: Reconstruct engine and causal inputs
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: ${{ env.CACHE_KEY }}
          fail-on-cache-miss: true
      - run: |
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit EVENT_AUDIT_6C_${{ matrix.rule_rank }}_${{ matrix.runner_frac }}_${{ matrix.target_r }}.csv
          python trailaris_r4/build_research_specs.py
          python -m py_compile trailaris_r5_5/lane6c_winner_payoff_extension.py
          mkdir -p lane6c_rule
          PYTHONPATH=trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5 python trailaris_r5_5/lane6c_winner_payoff_extension.py --rawdir trailaris_r5/raw_m1 --specs trailaris_r4/research_proxy_specs.csv --rules trailaris_r5_5/lane6a_results/R5_5_LANE6A_WINNER_RULES.csv --rule-rank ${{ matrix.rule_rank }} --runner-frac ${{ matrix.runner_frac }} --target-r ${{ matrix.target_r }} --trail-gap 0.80 --max-extra-bars 36 --outdir lane6c_rule
      - uses: actions/upload-artifact@v4
        with:
          name: lane6c-${{ matrix.rule_rank }}-${{ matrix.runner_frac }}-${{ matrix.target_r }}
          path: lane6c_rule/result.json
          retention-days: 3

  priority_capture:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        rule_rank: [0, 1]
        quality_boost: [0.02, 0.04, 0.06, 0.08, 0.10]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Require frozen winner attribution
        run: |
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          python - <<'PY'
          import json
          s=json.load(open('trailaris_r5_5/lane6a_results/R5_5_LANE6A_STATUS.json'))
          assert s['state']=='R5_5_LANE6A_WINNER_ATTRIBUTION_COMPLETE'
          assert s['scope']=={'approved_routes':34,'strategy_families':15,'route_strategy_cells':510}
          assert s['partition']['fresh_outcomes_used_for_selection'] is False
          PY
      - name: Reconstruct engine and causal inputs
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: ${{ env.CACHE_KEY }}
          fail-on-cache-miss: true
      - run: |
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit EVENT_AUDIT_6D_${{ matrix.rule_rank }}_${{ matrix.quality_boost }}.csv
          python trailaris_r4/build_research_specs.py
          python -m py_compile trailaris_r5_5/lane6d_winner_priority_capture.py
          mkdir -p lane6d_rule
          PYTHONPATH=trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5 python trailaris_r5_5/lane6d_winner_priority_capture.py --rawdir trailaris_r5/raw_m1 --specs trailaris_r4/research_proxy_specs.csv --rules trailaris_r5_5/lane6a_results/R5_5_LANE6A_WINNER_RULES.csv --rule-rank ${{ matrix.rule_rank }} --quality-boost ${{ matrix.quality_boost }} --outdir lane6d_rule
      - uses: actions/upload-artifact@v4
        with:
          name: lane6d-${{ matrix.rule_rank }}-${{ matrix.quality_boost }}
          path: lane6d_rule/result.json
          retention-days: 3

  aggregate:
    if: always()
    needs: [amplification, payoff_extension, priority_capture]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: lane6*
          path: collected
          merge-multiple: false
      - name: Aggregate all four winner paths
        run: |
          mkdir -p /tmp/lane6_summary trailaris_r5_5/lane6_parallel_results
          python - <<'PY'
          import csv,glob,json
          from pathlib import Path
          rows=[]
          for f in glob.glob('collected/**/result.json',recursive=True):
              try:x=json.load(open(f))
              except Exception:continue
              st=str(x.get('state',''))
              if 'LANE6B' in st:path='6B_AMPLIFICATION'
              elif 'LANE6C' in st:path='6C_PAYOFF_EXTENSION'
              elif 'LANE6D' in st:path='6D_PRIORITY_CAPTURE'
              else:continue
              c=x.get('candidate',{})
              rows.append({
                'path':path,'state':st,'rule_rank':x.get('rule_rank'),
                'copies':x.get('copies'),'runner_frac':x.get('runner_frac'),'target_r':x.get('target_r'),'quality_boost':x.get('quality_boost'),
                'end_equity':c.get('end_equity'),'delta_vs_1b2':x.get('delta_vs_1b2'),
                'fresh_return_pct':c.get('fresh_return_pct'),'max_weekly_dd_pct':c.get('max_weekly_dd_pct'),
                'executed_trades':c.get('executed_trades'),'wins':c.get('wins'),'losses':c.get('losses'),'flat':c.get('flat'),
                'nonflat_win_rate':c.get('nonflat_win_rate'),'assets_with_selected':c.get('assets_with_selected'),
                'alpha_candidate':bool(x.get('alpha_candidate',False)),'frontier_candidate':bool(x.get('frontier_candidate',False))
              })
          rows.sort(key=lambda r:(r['frontier_candidate'],r['alpha_candidate'],float(r['end_equity'] or -1),float(r['fresh_return_pct'] or -1)),reverse=True)
          out=Path('/tmp/lane6_summary')
          if rows:
              with (out/'R5_5_LANE6_PARALLEL_RESULTS.csv').open('w',newline='') as h:
                  w=csv.DictWriter(h,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          a=json.load(open('trailaris_r5_5/lane6a_results/R5_5_LANE6A_STATUS.json'))
          by={}
          for p in ['6B_AMPLIFICATION','6C_PAYOFF_EXTENSION','6D_PRIORITY_CAPTURE']:
              rr=[r for r in rows if r['path']==p]
              by[p]={'variants_completed':len(rr),'best_variant':rr[0] if rr else {},'frontier_candidates':sum(r['frontier_candidate'] for r in rr),'alpha_candidates':sum(r['alpha_candidate'] for r in rr)}
          s={
            'state':'R5_5_LANE6_FOUR_PATH_WINNER_PROGRAM_REPLAY_COMPLETE',
            'evidence_class':'LANE6A_SELECTION_FROZEN_PLUS_6B_6C_6D_END_TO_END_CAUSAL_FULL_REPLAY',
            'four_paths':[
              {'path':'6A_WINNER_ATTRIBUTION','status':'COMPLETE','best_rule':a['best_rule'],'winner_forensics':a['winner_forensics']},
              {'path':'6B_WINNER_AMPLIFICATION',**by['6B_AMPLIFICATION']},
              {'path':'6C_WINNER_PAYOFF_EXTENSION',**by['6C_PAYOFF_EXTENSION']},
              {'path':'6D_WINNER_PRIORITY_CAPTURE',**by['6D_PRIORITY_CAPTURE']}
            ],
            'overall_best_replay':rows[0] if rows else {},
            'benchmark':{'r5_4_end_equity':337.4231242104393,'lane1b2_end_equity':343.5447309255116,'fresh_return_floor':7.261646557142409,'max_weekly_dd_floor':-4.637645574907678,'losses_max':230,'flats_max':424,'nonflat_win_rate_floor':0.6671428571428571},
            'scope':{'approved_routes':34,'strategy_families':15,'route_strategy_cells':510},
            'governance':'6A selects winner signatures without Aug13-14 outcomes. 6B-6D are authentic full portfolio replays; post-trade MFE/MAE never determine eligibility. No winner path promotes without the R5.5 frontier, completeness, unseen-forward and broker-certification gates.'
          }
          (out/'R5_5_LANE6_PARALLEL_STATUS.json').write_text(json.dumps(s,indent=2))
          print(json.dumps(s,indent=2))
          PY
          cp /tmp/lane6_summary/* trailaris_r5_5/lane6_parallel_results/
      - name: Atomically publish Lane 6 evidence
        run: |
          cp -a trailaris_r5_5/lane6_parallel_results /tmp/lane6_publish
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          rm -rf trailaris_r5_5/lane6_parallel_results
          cp -a /tmp/lane6_publish trailaris_r5_5/lane6_parallel_results
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_5/lane6_parallel_results
          git commit -m 'test: R5.5 four-path winner maximization evidence [skip ci]' || exit 0
          for i in 1 2 3; do
            git push origin HEAD:"$BRANCH" && exit 0
            git pull --rebase origin "$BRANCH"
          done
          exit 1
