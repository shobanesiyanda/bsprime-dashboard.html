name: Trailaris R4 M1 34-Route Acquisition Diagnostic
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r4_m1_acquisition_diagnostic.yml']
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trailaris-ephemeral-research-20260815
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acquisition dependencies
        run: npm install --no-save --silent dukascopy-node@1.50.0 ws
      - name: Run all acquisition lanes without early abort
        shell: bash
        run: |
          set +e
          rm -rf trailaris_r4/raw_m1
          mkdir -p trailaris_r4/raw_m1
          node trailaris_r4/acquire_m1.js > trailaris_r4/acquire_m1_node.log 2>&1 & P1=$!
          python trailaris_r4/acquire_binance_m1.py > trailaris_r4/acquire_m1_binance.log 2>&1 & P2=$!
          wait $P1; E1=$?
          wait $P2; E2=$?
          echo $E1 > trailaris_r4/acquire_m1_node.exit
          echo $E2 > trailaris_r4/acquire_m1_binance.exit
          exit 0
      - name: Build exact 34-route acquisition coverage
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          ROUTES=['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','NZDUSD','EURJPY','GBPJPY','EURGBP','AUDJPY','CADJPY','GBPCHF','XAUUSD','XAGUSD','BTCUSD','ETHUSD','SOLUSD','BNBUSD','XRPUSD','US100','US500','US30','GER40','UK100','JP225','WTI','BRENT','NATGAS','V75','V50','V100','V25','V10']
          rows=[]
          for a in ROUTES:
            p=Path('trailaris_r4/raw_m1')/f'{a}_M1_normalized.csv'
            state='MISSING';n=0;first=last=src='';reason='file_missing'
            if p.exists():
              with p.open(newline='') as f: vals=list(csv.DictReader(f))
              n=len(vals);first=vals[0].get('timestamp','') if vals else '';last=vals[-1].get('timestamp','') if vals else '';src=vals[0].get('source','') if vals else ''
              state='PASS' if n>100 else 'FAIL';reason='' if state=='PASS' else 'too_few_rows'
            rows.append(dict(asset=a,state=state,rows=n,first=first,last=last,source=src,reason=reason))
          with open('trailaris_r4/M1_34Route_Acquisition_Diagnostic.csv','w',newline='') as f:
            w=csv.DictWriter(f,fieldnames=rows[0].keys());w.writeheader();w.writerows(rows)
          s={'routes_required':34,'routes_materialized':sum(x['state']=='PASS' for x in rows),'missing_or_failed':[x['asset'] for x in rows if x['state']!='PASS'],'node_exit':Path('trailaris_r4/acquire_m1_node.exit').read_text().strip(),'binance_exit':Path('trailaris_r4/acquire_m1_binance.exit').read_text().strip()}
          Path('trailaris_r4/M1_34Route_Acquisition_Diagnostic.json').write_text(json.dumps(s,indent=2));print(json.dumps(s,indent=2))
          PY
      - name: Commit diagnostic evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r4/M1_34Route_Acquisition_Diagnostic.csv trailaris_r4/M1_34Route_Acquisition_Diagnostic.json trailaris_r4/acquire_m1_node.log trailaris_r4/acquire_m1_binance.log trailaris_r4/coverage_m1_node.json trailaris_r4/coverage_m1_binance.json 2>/dev/null || true
          git commit -m 'diag: R4 M1 34-route acquisition evidence [skip ci]' || true
          git push origin HEAD:trailaris-ephemeral-research-20260815
