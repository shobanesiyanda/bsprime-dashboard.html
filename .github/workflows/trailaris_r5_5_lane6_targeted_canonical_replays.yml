name: Trailaris R5.5 Lane 6 Targeted Canonical Winner Replays
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['trailaris_r5_5/TRIGGER_LANE6_TARGETED_CANONICAL']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trailaris-r5-5-lane6-targeted-canonical
  cancel-in-progress: false
env:
  BRANCH: trailaris-ephemeral-research-20260815
  UNIVERSE_CACHE: trailaris_r5_5/cached_universe/universe.pkl
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        path: [AMPLIFICATION, PAYOFF_EXTENSION, PRIORITY_CAPTURE]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Require discovery-frozen path attribution
        run: |
          python - <<'PY'
          import json
          s=json.load(open('trailaris_r5_5/lane6_path_specific_results/R5_5_LANE6_PATH_SPECIFIC_STATUS.json'))
          p=json.load(open('trailaris_r5_5/lane6_priority_strict_results/R5_5_LANE6_PRIORITY_STRICT_STATUS.json'))
          assert s['state']=='R5_5_LANE6_PATH_SPECIFIC_ATTRIBUTION_COMPLETE'
          assert s['fresh_outcomes_used_for_selection'] is False
          assert s['paths']['AMPLIFICATION']['passing_rules']>0
          assert s['paths']['PAYOFF_EXTENSION']['passing_rules']>0
          assert p['state']=='R5_5_LANE6_PRIORITY_ATTRIBUTION_DISCOVERY_FROZEN_COMPLETE'
          assert p['fresh_outcomes_used_for_selection'] is False
          assert p['passing_rules']>0
          PY
      - name: Reconstruct immutable engine
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          python trailaris_r4/build_research_specs.py
      - name: Restore fingerprinted full-universe cache
        uses: actions/cache@v4
        with:
          path: trailaris_r5_5/cached_universe
          key: r55-universe-${{ hashFiles('trailaris_r4/r4_runner.part*','trailaris_r4/r4_adapter.part*','trailaris_r5_4/R5_BASE_CAUSAL_ENGINE.py','trailaris_r5_3/build_released_event_factor_feed.py') }}-raw34v1
          fail-on-cache-miss: true
      - name: Run one predeclared canonical mechanism
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5
          TRAILARIS_R55_UNIVERSE_CACHE: ${{ env.UNIVERSE_CACHE }}
        run: |
          set -euo pipefail
          mkdir -p lane6_target
          if [ '${{ matrix.path }}' = 'AMPLIFICATION' ]; then
            python trailaris_r5_5/universe_cache_runtime.py trailaris_r5_5/lane6b_winner_amplification.py \
              --rawdir trailaris_r5/raw_m1 --specs trailaris_r4/research_proxy_specs.csv \
              --rules trailaris_r5_5/lane6_path_specific_results/R5_5_LANE6_AMPLIFICATION_RULES.csv \
              --rule-rank 0 --copies 1 --quality-boost 0.00 --outdir lane6_target
          elif [ '${{ matrix.path }}' = 'PAYOFF_EXTENSION' ]; then
            python trailaris_r5_5/universe_cache_runtime.py trailaris_r5_5/lane6c_winner_payoff_extension.py \
              --rawdir trailaris_r5/raw_m1 --specs trailaris_r4/research_proxy_specs.csv \
              --rules trailaris_r5_5/lane6_path_specific_results/R5_5_LANE6_PAYOFF_EXTENSION_RULES.csv \
              --rule-rank 0 --runner-frac 0.25 --target-r 4.0 --trail-gap 0.80 --max-extra-bars 36 --outdir lane6_target
          else
            python trailaris_r5_5/universe_cache_runtime.py trailaris_r5_5/lane6d_winner_priority_capture.py \
              --rawdir trailaris_r5/raw_m1 --specs trailaris_r4/research_proxy_specs.csv \
              --rules trailaris_r5_5/lane6_priority_strict_results/R5_5_LANE6_PRIORITY_CAPTURE_RULES_STRICT.csv \
              --rule-rank 0 --quality-boost 0.04 --outdir lane6_target
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lane6-target-${{ matrix.path }}
          path: lane6_target/*
          retention-days: 3
  aggregate:
    if: always()
    needs: replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: lane6-target-*
          path: collected
          merge-multiple: false
      - name: Build fixed-candidate verification record
        run: |
          mkdir -p /tmp/l6target
          python - <<'PY'
          import glob,json
          from pathlib import Path
          rows=[]
          for f in glob.glob('collected/**/result.json',recursive=True):
              x=json.load(open(f));state=str(x.get('state',''))
              path='AMPLIFICATION' if 'LANE6B' in state else ('PAYOFF_EXTENSION' if 'LANE6C' in state else ('PRIORITY_CAPTURE' if 'LANE6D' in state else 'UNKNOWN'))
              c=x.get('candidate',{});activity=x.get('amplified_addons_selected',x.get('selected_extended_executions',x.get('selected_qualifying_executions',0)))
              rows.append({'path':path,'state':state,'end_equity':c.get('end_equity'),'fresh_return_pct':c.get('fresh_return_pct'),'fresh_max_dd_pct':c.get('fresh_max_dd_pct'),'max_weekly_dd_pct':c.get('max_weekly_dd_pct'),'wins':c.get('wins'),'losses':c.get('losses'),'flat':c.get('flat'),'nonflat_win_rate':c.get('nonflat_win_rate'),'assets_with_selected':c.get('assets_with_selected'),'mechanism_activity':activity,'standalone_delta_vs_lane5':x.get('delta_vs_lane5_frontier'),'frontier_candidate':bool(x.get('frontier_candidate',False)),'fresh_verification_pass':bool(c.get('fresh_return_pct',-1)>7.261646557142409 and c.get('fresh_max_dd_pct',-999)>=-0.5196525640746019 and activity>0)})
          s={'state':'R5_5_LANE6_TARGETED_CANONICAL_REPLAYS_COMPLETE','evidence_class':'THREE_PREDECLARED_END_TO_END_CAUSAL_FULL_REPLAYS','selection_governance':'Cohorts and mechanism parameters are frozen without Aug13-14 selection. Aug13-14 is verification/non-regression only.','canonical_mechanisms':{'AMPLIFICATION':{'copies':1,'quality_boost':0.0},'PAYOFF_EXTENSION':{'runner_frac':0.25,'target_r':4.0,'trail_gap':0.8,'max_extra_bars':36},'PRIORITY_CAPTURE':{'quality_boost':0.04}},'results':rows,'fresh_verified_paths':[r['path'] for r in rows if r['fresh_verification_pass']],'scope':{'routes':34,'strategy_families':15,'route_strategy_cells':510}}
          Path('/tmp/l6target/R5_5_LANE6_TARGETED_STATUS.json').write_text(json.dumps(s,indent=2,default=str));print(json.dumps(s,indent=2,default=str))
          PY
      - name: Publish verification record
        run: |
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          mkdir -p trailaris_r5_5/lane6_targeted_results
          cp /tmp/l6target/R5_5_LANE6_TARGETED_STATUS.json trailaris_r5_5/lane6_targeted_results/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_5/lane6_targeted_results/R5_5_LANE6_TARGETED_STATUS.json
          git commit -m 'test: R5.5 targeted canonical winner replay evidence [skip ci]' || exit 0
          for i in 1 2 3; do git push origin HEAD:"$BRANCH" && exit 0; git pull --rebase origin "$BRANCH"; done
          exit 1
