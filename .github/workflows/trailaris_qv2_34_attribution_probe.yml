name: Trailaris Quant V2 — 34 Attribution Status Probe
on:
  push:
    branches: [trailaris-qv2-34-success-attribution-20260818]
    paths: ['.github/workflows/trailaris_qv2_34_attribution_probe.yml']
permissions:
  actions: read
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-qv2-34-success-attribution-20260818}
      - name: Capture attribution run
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api 'repos/shobanesiyanda/bsprime-dashboard.html/actions/runs?branch=trailaris-qv2-34-success-attribution-20260818&per_page=50' > /tmp/runs.json
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          d=json.load(open('/tmp/runs.json'));name='Trailaris Quant V2 — 34 Success Attribution'
          rs=[r for r in d.get('workflow_runs',[]) if r.get('name')==name]
          if not rs: raise SystemExit('34 success attribution run not found')
          r=sorted(rs,key=lambda x:x['created_at'],reverse=True)[0]
          jobs=json.loads(subprocess.check_output(['gh','api',f"repos/shobanesiyanda/bsprime-dashboard.html/actions/runs/{r['id']}/jobs?per_page=100"],text=True)).get('jobs',[])
          out={'run_id':r['id'],'status':r['status'],'conclusion':r.get('conclusion'),'head_sha':r['head_sha'],'created_at':r['created_at'],'updated_at':r['updated_at'],'jobs':[{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j.get('conclusion'),'steps':[{'name':s['name'],'status':s['status'],'conclusion':s.get('conclusion')} for s in j.get('steps',[])]} for j in jobs]}
          Path('trailaris_34_attribution/ACTIVE_34_ATTRIBUTION_STATUS.json').write_text(json.dumps(out,indent=2));print(json.dumps(out,indent=2))
          PY
      - name: Commit snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trailaris_34_attribution/ACTIVE_34_ATTRIBUTION_STATUS.json
          git commit -m 'ops: snapshot 34 attribution status [skip ci]' || exit 0
          git pull --rebase origin trailaris-qv2-34-success-attribution-20260818
          git push origin HEAD:trailaris-qv2-34-success-attribution-20260818
