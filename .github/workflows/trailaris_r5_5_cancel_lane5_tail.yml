name: Trailaris R5.5 Cancel Redundant Lane 5 Tail
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_5_cancel_lane5_tail.yml']
permissions:
  actions: write
  contents: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815, fetch-depth: 0}
      - name: Cancel redundant authoritative matrix tail
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api -X POST repos/${GITHUB_REPOSITORY}/actions/runs/31964215446/cancel
          exit 0
      - name: Remove one-shot canceller
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin trailaris-ephemeral-research-20260815
          git reset --hard origin/trailaris-ephemeral-research-20260815
          git rm -f .github/workflows/trailaris_r5_5_cancel_lane5_tail.yml
          git commit -m 'chore: remove completed Lane 5 tail canceller [skip ci]'
          git push origin HEAD:trailaris-ephemeral-research-20260815
