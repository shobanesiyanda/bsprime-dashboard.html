name: Trailaris Quant V2 — 50 Asset Closed-Balance Evaluation

on:
  push:
    branches: [trailaris-quant-v2-50-asset-evaluation-20260818]
    paths: ['.github/workflows/trailaris_qv2_50_closed_balance_evaluation.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: trailaris-qv2-50-closed-balance-evaluation
  cancel-in-progress: false

env:
  QV2_BLOB: 120390ab52e80f51bafedc42389ceb7420a410f2
  DISCOVERY_ARTIFACT_ID: 9301401424
  CANONICAL_ARTIFACT_ID: 9270611209
  EVAL_BRANCH: trailaris-quant-v2-50-asset-evaluation-20260818

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout evaluation controls
        uses: actions/checkout@v4
        with:
          ref: trailaris-quant-v2-50-asset-evaluation-20260818
          path: active

      - name: Checkout preserved 34-asset replay estate
        uses: actions/checkout@v4
        with:
          ref: trailaris-r5-4-26week-validation-20260816
          path: estate

      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Install evaluation runtime
        run: |
          python -m pip install --quiet pandas numpy
          cd active && npm install --no-save --silent dukascopy-node@1.50.0

      - name: Verify preserved strategy identity and approved manifest
        working-directory: active
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v2.py)" = "$QV2_BLOB"
          python - <<'PY'
          from pathlib import Path
          a=[x.strip() for x in Path('trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt').read_text().splitlines() if x.strip()]
          expected=['COCOA.CMD','SUGAR.CMD','COFFEE.CMD','AAPL.US','SOYBEAN.CMD','ORCL.US','MSFT.US','USDCNH','V.US','AUDNZD','EURCHF','GBPNZD','FRA.IDX','TSLA.US','CHI.IDX','COPPER.CMD']
          assert a==expected and len(set(a))==16
          print('APPROVED_16_IDENTITY PASS')
          PY

      - name: Restore exact 34-asset 26-week M1 control cache
        uses: actions/cache/restore@v4
        with:
          path: estate/trailaris_longcycle/raw_m1
          key: trailaris-r5-5-active-m1-34-20260119-20260814-v1
          fail-on-cache-miss: true

      - name: Reconstruct preserved R4 runtime and control factor feed
        working-directory: estate
        run: |
          set -euo pipefail
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          python trailaris_longcycle/build_longcycle_factors.py --rawdir trailaris_longcycle/raw_m1 --out trailaris_longcycle/raw_m1/Trailaris_R3_FactorFeed.csv --audit trailaris_longcycle/QV2_50_CONTROL_FACTOR_EVIDENCE.json
          python trailaris_r4/build_research_specs.py

      - name: Resolve the approved 16 from preserved provider discovery
        working-directory: active
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/artifacts/${DISCOVERY_ARTIFACT_ID}/zip > discovery.zip
          mkdir discovery && unzip -q discovery.zip -d discovery
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          approved=[x.strip() for x in Path('trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt').read_text().splitlines() if x.strip()]
          d=pd.read_csv('discovery/DISCOVERED_UNIVERSE.csv');by={str(r.canonical_instrument):r for _,r in d.iterrows()}
          missing=[x for x in approved if x not in by];assert not missing,missing
          with open('trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16_RESOLVED.tsv','w') as f:
              f.write('instrument_id\tcanonical_instrument\tprovider_name\n')
              for x in approved:
                  r=by[x];f.write(f'{r.instrument_id}\t{x}\t{r.provider_name}\n')
          print({'resolved':len(approved)})
          PY

      - name: Acquire exact evaluation-window M1 for the approved 16
        working-directory: active
        run: |
          set -euo pipefail
          node trailaris_full_universe/acquire_duka_exact_26w_shard.js --manifest trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16_RESOLVED.tsv --outdir qv2-50-new16/raw --shard 0 --shards 1 --concurrency 4
          python - <<'PY'
          import json
          e=json.load(open('qv2-50-new16/raw/ACQUISITION_EVIDENCE.json'))
          assert e['assets_scheduled']==16 and e['assets_pass']==16,e
          bad=[x for x in e['evidence'] if x['status']!='PASS' or not x['full_window_coverage']]
          assert not bad,bad
          print('APPROVED_16_M1_ACQUISITION PASS')
          PY

      - name: Merge only the approved 16 into a temporary 50-asset estate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          e=json.load(open('active/qv2-50-new16/raw/ACQUISITION_EVIDENCE.json'))
          out=Path('estate/trailaris_longcycle/raw_m1')
          for r in e['evidence']:
              src=Path('active')/r['file'];dst=out/f"{r['canonical_instrument']}_M1_normalized.csv"
              assert src.exists(),src;shutil.copy2(src,dst)
          approved=[x.strip() for x in Path('active/trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt').read_text().splitlines() if x.strip()]
          assert all((out/f'{x}_M1_normalized.csv').exists() for x in approved)
          print('TEMPORARY_50_ASSET_RAW_ESTATE READY')
          PY

      - name: Inject evaluation sources without changing Quant V2
        run: |
          set -euo pipefail
          mkdir -p estate/trailaris_r5_5 estate/trailaris_full_universe estate/trailaris_50_asset
          cp active/trailaris_r5_5/longcycle_bounded_memory_candidate.py estate/trailaris_r5_5/
          cp active/trailaris_r5_5/longcycle_integrated_negative_refinement.py estate/trailaris_r5_5/
          cp active/trailaris_r5_5/quantitative_integrated_v1.py estate/trailaris_r5_5/
          cp active/trailaris_r5_5/quantitative_integrated_v2.py estate/trailaris_r5_5/
          cp active/trailaris_r5_5/run_quantitative_v2_from_canonical_v2_estate.py estate/trailaris_r5_5/
          cp active/trailaris_full_universe/qv2_asset_universe_adapter.py estate/trailaris_full_universe/
          cp active/trailaris_50_asset/run_50_asset_closed_balance_evaluation.py estate/trailaris_50_asset/
          cp active/trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt estate/trailaris_50_asset/
          cp active/trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16_RESOLVED.tsv estate/trailaris_50_asset/
          test "$(cd active && git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v2.py)" = "$QV2_BLOB"

      - name: Fetch exact 34-asset canonical estate evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p estate/canonical_v2
          gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/artifacts/${CANONICAL_ARTIFACT_ID}/zip > canonical.zip
          unzip -q canonical.zip -d estate/canonical_v2
          test -f estate/canonical_v2/R5_5_INTEGRATED_NEGATIVE_REFINEMENT_PROMOTED.csv

      - name: Apply closed-balance sizing semantics in the isolated evaluation estate
        working-directory: estate
        run: |
          python - <<'PY'
          from pathlib import Path
          engine=Path('trailaris_r5_4/R5_BASE_CAUSAL_ENGINE.py');src=engine.read_text()
          old='r4.size_trade(r.asset,eq,rf,float(r.stop_distance),specs)';new='r4.size_trade(r.asset,balance,rf,float(r.stop_distance),specs)'
          assert src.count(old)==1,src.count(old);engine.write_text(src.replace(old,new))
          runner=Path('trailaris_r5_5/run_quantitative_v2_from_canonical_v2_estate.py');r=runner.read_text();assert r.count('assert_identity(identity)')==1
          Path('trailaris_r5_5/run_closed_balance_control.py').write_text(r.replace('assert_identity(identity)',"print('CLOSED_BALANCE_CONTROL_SEMANTIC_ACTIVE')"))
          print('CLOSED_BALANCE_SIZING ACTIVE')
          PY

      - name: Reproduce 34-asset closed-balance control
        working-directory: estate
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5:trailaris_full_universe
        run: |
          rm -rf trailaris_r5_5/closed_balance_control
          python trailaris_r5_5/run_closed_balance_control.py --rawdir trailaris_longcycle/raw_m1 --specs trailaris_r4/research_proxy_specs.csv --factory-audit trailaris_longcycle/results/R4_FACTORY_AUDIT.csv --canonical-dir canonical_v2 --outdir trailaris_r5_5/closed_balance_control
          python - <<'PY'
          import json
          p=json.load(open('trailaris_r5_5/closed_balance_control/R5_5_QUANTITATIVE_V2_EXACT_ESTATE_STATUS.json'))['candidate']
          assert p['positive_weeks']==26
          print(json.dumps({'closed_balance_34_end_equity':p['end_equity'],'profit_factor':p['profit_factor'],'trades':p['executed_trades']},indent=2))
          PY

      - name: Run exact 34-versus-50 controlled evaluation
        working-directory: estate
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5:trailaris_full_universe:trailaris_50_asset
        run: |
          rm -rf trailaris_50_asset/evaluation-results
          python trailaris_50_asset/run_50_asset_closed_balance_evaluation.py --rawdir trailaris_longcycle/raw_m1 --manifest trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16_RESOLVED.tsv --specs trailaris_r4/research_proxy_specs.csv --control-status trailaris_r5_5/closed_balance_control/R5_5_QUANTITATIVE_V2_EXACT_ESTATE_STATUS.json --outdir trailaris_50_asset/evaluation-results

      - name: Upload complete 50-asset evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trailaris-qv2-50-closed-balance-evaluation
          path: estate/trailaris_50_asset/evaluation-results/
          retention-days: 30

      - name: Preserve compact evaluation evidence
        if: success()
        run: |
          set -euo pipefail
          mkdir -p active/trailaris_50_asset/evaluation_results
          cp estate/trailaris_50_asset/evaluation-results/QV2_50_EVALUATION_STATUS.json active/trailaris_50_asset/evaluation_results/
          cp estate/trailaris_50_asset/evaluation-results/QV2_50_WEEKLY.csv active/trailaris_50_asset/evaluation_results/
          cp estate/trailaris_50_asset/evaluation-results/QV2_50_ROLLING_11W.csv active/trailaris_50_asset/evaluation_results/
          cp estate/trailaris_50_asset/evaluation-results/QV2_50_ASSET_CONTRIBUTION.csv active/trailaris_50_asset/evaluation_results/
          cd active
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trailaris_50_asset/evaluation_results trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16_RESOLVED.tsv
          git commit -m 'evidence: preserve 50-asset closed-balance evaluation [skip ci]'
          git pull --rebase origin "$EVAL_BRANCH"
          git push origin HEAD:"$EVAL_BRANCH"
