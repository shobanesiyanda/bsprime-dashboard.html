name: Trailaris Data Runtime
on:
  push:
    branches: [trailaris-data-runtime-20260813]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trailaris-data-runtime-20260813
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet pandas requests websockets
      - name: Acquire 34-route histories
        run: python trailaris/acquire_market_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: trailaris-market-history
          path: |
            trailaris/raw/*.csv.gz
            trailaris/coverage.csv
            trailaris/coverage.json
          retention-days: 1
