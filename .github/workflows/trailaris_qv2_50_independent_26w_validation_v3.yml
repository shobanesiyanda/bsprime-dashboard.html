name: Trailaris Quant V2 — Exact 50 Independent 26W Validation V3

on:
  push:
    branches: [trailaris-qv2-50-independent-validation-20260818]
    paths: ['.github/workflows/trailaris_qv2_50_independent_26w_validation_v3.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  QV2_BLOB: 120390ab52e80f51bafedc42389ceb7420a410f2
  DISCOVERY_ARTIFACT_ID: 9301401424
  DERIV_RECOVERY_RUN_ID: 32159521748
  MSFT_RECOVERY_RUN_ID: 32159930393
  START: '2024-12-23T00:00:00Z'
  END: '2025-07-21T00:00:00Z'
  BRANCH: trailaris-qv2-50-independent-validation-20260818

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-qv2-50-independent-validation-20260818}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install acquisition runtime
        run: |
          npm install --no-save --silent dukascopy-node@1.50.0 ws
          python -m pip install --quiet pandas numpy
      - name: Resolve immutable approved-16 identities
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/artifacts/${DISCOVERY_ARTIFACT_ID}/zip > discovery.zip
          mkdir discovery && unzip -q discovery.zip -d discovery
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          approved=[x.strip() for x in Path('trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt').read_text().splitlines() if x.strip()]
          expected=['COCOA.CMD','SUGAR.CMD','COFFEE.CMD','AAPL.US','SOYBEAN.CMD','NVDA.US','MSFT.US','USDCNH','V.US','AUDNZD','EURCHF','GBPNZD','FRA.IDX','TSLA.US','CHI.IDX','COPPER.CMD']
          assert approved==expected and len(set(approved))==16
          d=pd.read_csv('discovery/DISCOVERED_UNIVERSE.csv');by={str(r.canonical_instrument):r for _,r in d.iterrows()};assert set(approved)<=set(by)
          with open('APPROVED16.tsv','w') as f:
              f.write('instrument_id\tcanonical_instrument\tprovider_name\n')
              for a in approved:
                  r=by[a];f.write(f'{r.instrument_id}\t{a}\t{r.provider_name}\n')
          print('APPROVED16_IDENTITY_GATE PASS')
          PY
      - name: Acquire fresh non-recovery lanes
        shell: bash
        run: |
          set -uo pipefail
          node trailaris_50_asset/acquire_independent_core.js --start "$START" --end "$END" --outdir raw_core > core.log 2>&1 & P1=$!
          python trailaris_50_asset/acquire_independent_crypto.py --start "$START" --end "$END" --outdir raw_crypto > crypto.log 2>&1 & P2=$!
          wait $P1; RC1=$?
          wait $P2; RC2=$?
          cat core.log
          cat crypto.log
          echo "CORE_RC=$RC1 CRYPTO_RC=$RC2"
          node trailaris_50_asset/acquire_independent_manifest.js --manifest APPROVED16.tsv --start "$START" --end "$END" --outdir raw16_pkg --concurrency 4 > additions.log 2>&1; RC3=$?
          cat additions.log
          echo "ADDITIONS_RC=$RC3"
          exit 0
      - name: Enforce fresh 24-core + 5-crypto + 15-addition partial gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          deriv={'V75','V50','V100','V25','V10'}
          core=json.load(open('raw_core/ACQUISITION_EVIDENCE_CORE.json'))['evidence']
          non=[r for r in core if r['canonical_instrument'] not in deriv]
          bad=[r for r in non if r.get('status')!='PASS' or not r.get('full_window_coverage') or not Path('raw_core',f"{r['canonical_instrument']}_M1_normalized.csv").exists()]
          assert len(non)==24 and not bad,bad
          cr=json.load(open('raw_crypto/ACQUISITION_EVIDENCE_CRYPTO.json'))['evidence']
          bad=[r for r in cr if r.get('status')!='PASS' or not r.get('full_window_coverage') or not Path('raw_crypto',f"{r['canonical_instrument']}_M1_normalized.csv").exists()]
          assert len(cr)==5 and not bad,bad
          ad=json.load(open('raw16_pkg/ACQUISITION_EVIDENCE_ADDITIONS.json'))['evidence']
          non=[r for r in ad if r['canonical_instrument']!='MSFT.US']
          bad=[r for r in non if r.get('status')!='PASS' or not r.get('full_window_coverage') or not Path('raw16_pkg',f"{r['canonical_instrument']}_M1_normalized.csv").exists()]
          assert len(non)==15 and not bad,bad
          print('FRESH_PARTIAL_DATA_GATES PASS 24+5+15')
          PY
      - name: Wait for exact Deriv and MSFT official recovery artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          wait_run () {
            local run="$1"
            for i in $(seq 1 180); do
              status=$(gh run view "$run" --repo shobanesiyanda/bsprime-dashboard.html --json status --jq .status)
              if [ "$status" = "completed" ]; then
                conclusion=$(gh run view "$run" --repo shobanesiyanda/bsprime-dashboard.html --json conclusion --jq .conclusion)
                test "$conclusion" = "success" || { echo "RECOVERY_RUN_${run}_$conclusion"; exit 2; }
                return 0
              fi
              sleep 60
            done
            echo "RECOVERY_RUN_${run}_TIMEOUT"; exit 3
          }
          wait_run "$DERIV_RECOVERY_RUN_ID" & A=$!
          wait_run "$MSFT_RECOVERY_RUN_ID" & B=$!
          wait $A
          wait $B
          mkdir recovery_deriv recovery_msft
          gh run download "$DERIV_RECOVERY_RUN_ID" --repo shobanesiyanda/bsprime-dashboard.html --name qv2-independent-deriv5-paged --dir recovery_deriv
          gh run download "$MSFT_RECOVERY_RUN_ID" --repo shobanesiyanda/bsprime-dashboard.html --name qv2-independent-msft-raw --dir recovery_msft
      - name: Assemble exact fresh 34 and exact unchanged 16 estates
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          routes=['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','NZDUSD','EURJPY','GBPJPY','EURGBP','AUDJPY','CADJPY','GBPCHF','XAUUSD','XAGUSD','BTCUSD','ETHUSD','SOLUSD','BNBUSD','XRPUSD','US100','US500','US30','GER40','UK100','JP225','WTI','BRENT','NATGAS','V75','V50','V100','V25','V10']
          deriv={'V75','V50','V100','V25','V10'}
          root=Path('raw34');root.mkdir();rows=[]
          core=json.load(open('raw_core/ACQUISITION_EVIDENCE_CORE.json'))['evidence']
          for r in core:
              a=str(r['canonical_instrument'])
              if a in deriv:continue
              q=dict(r);src=Path('raw_core')/f'{a}_M1_normalized.csv';dst=root/src.name;shutil.copy2(src,dst);q['file']=str(dst);rows.append(q)
          cr=json.load(open('raw_crypto/ACQUISITION_EVIDENCE_CRYPTO.json'))['evidence']
          for r in cr:
              a=str(r['canonical_instrument']);q=dict(r);src=Path('raw_crypto')/f'{a}_M1_normalized.csv';dst=root/src.name;shutil.copy2(src,dst);q['file']=str(dst);rows.append(q)
          de=json.load(open('recovery_deriv/DERIV_RECOVERY_EVIDENCE.json'))
          assert de['assets_pass']==5
          for r in de['evidence']:
              a=str(r['canonical_instrument']);q=dict(r);src=Path('recovery_deriv')/f'{a}_M1_normalized.csv';assert src.exists(),src;dst=root/src.name;shutil.copy2(src,dst);q['file']=str(dst);rows.append(q)
          assert len(rows)==34 and {r['canonical_instrument'] for r in rows}==set(routes)
          assert all(r.get('status')=='PASS' and r.get('full_window_coverage') for r in rows)
          (root/'ACQUISITION_EVIDENCE.json').write_text(json.dumps({'start':'2024-12-23T00:00:00Z','end_exclusive':'2025-07-21T00:00:00Z','assets_scheduled':34,'assets_pass':34,'evidence':rows,'data_reused_from_2026':False},indent=2))

          approved=[x.strip() for x in Path('trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt').read_text().splitlines() if x.strip()]
          root=Path('raw16');root.mkdir();rows=[]
          ad=json.load(open('raw16_pkg/ACQUISITION_EVIDENCE_ADDITIONS.json'))['evidence']
          for r in ad:
              a=str(r['canonical_instrument'])
              if a=='MSFT.US':continue
              q=dict(r);src=Path('raw16_pkg')/f'{a}_M1_normalized.csv';dst=root/src.name;shutil.copy2(src,dst);q['file']=str(dst);rows.append(q)
          me=json.load(open('recovery_msft/MSFT_RAW_RECOVERY_EVIDENCE.json'));assert me['status']=='PASS' and me['full_window_coverage']
          src=Path('recovery_msft/MSFT.US_M1_normalized.csv');assert src.exists();dst=root/src.name;shutil.copy2(src,dst);q=dict(me);q['file']=str(dst);rows.append(q)
          assert len(rows)==16 and {r['canonical_instrument'] for r in rows}==set(approved)
          assert all(r.get('status')=='PASS' and r.get('full_window_coverage') for r in rows)
          (root/'ACQUISITION_EVIDENCE.json').write_text(json.dumps({'start':'2024-12-23T00:00:00Z','end_exclusive':'2025-07-21T00:00:00Z','assets_scheduled':16,'assets_pass':16,'evidence':rows,'data_reused_from_2026':False},indent=2))
          print('EXACT_FRESH_DATA_GATE PASS 34/34 + 16/16')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qv2-independent-raw34-v3
          path: raw34/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: qv2-independent-raw16-v3
          path: raw16/
          retention-days: 30

  assemble:
    needs: acquire
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-qv2-50-independent-validation-20260818}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore exact research runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet pandas numpy
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v2.py)" = "$QV2_BLOB"
          python -m py_compile trailaris_50_asset/build_independent_factors.py trailaris_50_asset/assemble_independent_34.py trailaris_50_asset/promote_independent_shard.py trailaris_50_asset/replay_independent_from_promoted.py trailaris_50_asset/batch_consistent_drawdown.py trailaris_50_asset/evaluate_independent_gate.py
      - uses: actions/download-artifact@v4
        with: {name: qv2-independent-raw34-v3, path: raw34}
      - uses: actions/download-artifact@v4
        with: {name: qv2-independent-raw16-v3, path: raw16}
      - name: Build exact 50 raw estate and fresh causal factor evidence
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          raw50=Path('raw50');raw50.mkdir();rows=[]
          for src in (Path('raw34'),Path('raw16')):
              e=json.load(open(src/'ACQUISITION_EVIDENCE.json'))
              for r in e['evidence']:
                  a=r['canonical_instrument'];p=src/f'{a}_M1_normalized.csv';assert p.exists(),p;dst=raw50/p.name;shutil.copy2(p,dst);q=dict(r);q['file']=str(dst);rows.append(q)
          assert len(rows)==50 and len({r['canonical_instrument'] for r in rows})==50
          (raw50/'ACQUISITION_EVIDENCE.json').write_text(json.dumps({'start':'2024-12-23T00:00:00Z','end_exclusive':'2025-07-21T00:00:00Z','assets_scheduled':50,'assets_pass':50,'evidence':rows,'data_reused_from_2026':False},indent=2))
          PY
          python trailaris_50_asset/build_independent_factors.py --rawdir raw34 --start "$START" --end "$END" --out independent_factors/Trailaris_R3_FactorFeed.csv --audit independent_factors/FACTOR_EVIDENCE.json
          python trailaris_r4/build_research_specs.py
      - name: Build and assemble fresh exact universes
        env: {PYTHONPATH: '.:trailaris_r4'}
        run: |
          python trailaris_100_asset/build_asset_bundle.py --rawdir raw34 --outdir bundles/core34
          python trailaris_100_asset/build_asset_bundle.py --rawdir raw50 --outdir bundles/all50
          python trailaris_50_asset/assemble_independent_34.py --bundle-root bundles/core34 --factor-feed independent_factors/Trailaris_R3_FactorFeed.csv --outdir assembled34
          python trailaris_50_asset/assemble_50_universe.py --bundle-root bundles/all50 --factor-feed independent_factors/Trailaris_R3_FactorFeed.csv --approved16 trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt --outdir assembled50
          python - <<'PY'
          import json
          a=json.load(open('assembled34/ASSEMBLY_SUMMARY.json'));b=json.load(open('assembled50/ASSEMBLY_SUMMARY.json'))
          assert a['feature_assets']==34 and a['candidate_assets']==34
          assert b['feature_assets']==50 and b['candidate_assets']==50 and b['quant_v2_modified'] is False
          print('FRESH_UNIVERSE_ASSEMBLY_GATE PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qv2-independent-assembled-34-v3
          path: assembled34/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: qv2-independent-assembled-50-v3
          path: assembled50/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: qv2-independent-factor-evidence-v3
          path: independent_factors/
          retention-days: 30

  promote:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        assets: [34, 50]
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-qv2-50-independent-validation-20260818}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore exact promotion runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet pandas numpy
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v2.py)" = "$QV2_BLOB"
          test "$(git rev-parse HEAD:trailaris_r5_5/longcycle_integrated_negative_refinement.py)" = 'a6f6fcc8dfc1d265c5917dc9df3f3c73eb08d6cb'
      - uses: actions/download-artifact@v4
        with:
          name: "qv2-independent-assembled-${{ matrix.assets }}-v3"
          path: universe
      - name: Execute fresh causal promotion shard
        env: {PYTHONPATH: '.:trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5'}
        run: python trailaris_50_asset/promote_independent_shard.py --universe-dir universe --assets ${{ matrix.assets }} --shard ${{ matrix.shard }} --shards 6 --outdir promoted
      - uses: actions/upload-artifact@v4
        with:
          name: "qv2-independent-promoted-${{ matrix.assets }}-${{ matrix.shard }}-v3"
          path: promoted/
          retention-days: 30

  replay:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: {assets: [34, 50]}
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-qv2-50-independent-validation-20260818}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore exact replay runtime and closed-balance sizing
        run: |
          set -euo pipefail
          python -m pip install --quiet pandas numpy
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          python trailaris_r4/build_research_specs.py
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v2.py)" = "$QV2_BLOB"
          python - <<'PY'
          from pathlib import Path
          p=Path('trailaris_r5_4/R5_BASE_CAUSAL_ENGINE.py');s=p.read_text();old='r4.size_trade(r.asset,eq,rf,float(r.stop_distance),specs)';new='r4.size_trade(r.asset,balance,rf,float(r.stop_distance),specs)';n=s.count(old);assert n in (1,2),n;p.write_text(s.replace(old,new));print('CLOSED_BALANCE_PATCH_COUNT',n)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: "qv2-independent-assembled-${{ matrix.assets }}-v3"
          path: universe
      - uses: actions/download-artifact@v4
        with:
          pattern: "qv2-independent-promoted-${{ matrix.assets }}-*-v3"
          path: promoted
      - name: Execute untouched-window sequential portfolio replay
        env: {PYTHONPATH: '.:trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5'}
        run: python trailaris_50_asset/replay_independent_from_promoted.py --universe-dir universe --promoted-root promoted --assets ${{ matrix.assets }} --specs trailaris_r4/research_proxy_specs.csv --outdir result
      - uses: actions/upload-artifact@v4
        with:
          name: "qv2-independent-replay-${{ matrix.assets }}-v3"
          path: result/
          retention-days: 30

  evaluate:
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-qv2-50-independent-validation-20260818}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {name: qv2-independent-replay-34-v3, path: replay34}
      - uses: actions/download-artifact@v4
        with: {name: qv2-independent-replay-50-v3, path: replay50}
      - name: Evaluate predeclared independent production-candidate gate
        run: |
          python trailaris_50_asset/evaluate_independent_gate.py --status34 replay34/QV2_34_INDEPENDENT_STATUS.json --status50 replay50/QV2_50_INDEPENDENT_STATUS.json --spec trailaris_50_asset/QV2_50_INDEPENDENT_ACCEPTANCE_SPEC.json --out QV2_50_INDEPENDENT_VALIDATION_GATE.json
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          g=json.load(open('QV2_50_INDEPENDENT_VALIDATION_GATE.json'))
          s34=json.load(open('replay34/QV2_34_INDEPENDENT_STATUS.json'));s50=json.load(open('replay50/QV2_50_INDEPENDENT_STATUS.json'))
          out={'state':'QV2_50_FRESH_INDEPENDENT_VALIDATION_COMPLETE','window':'2025-01-20/2025-07-21','raw_warmup_start':'2024-12-23','exact_50_unchanged':True,'quant_v2_modified':False,'decision':g['decision'],'all_predeclared_checks_pass':g['all_predeclared_checks_pass'],'fresh34':s34['candidate'],'fresh50':s50['candidate'],'expansion16':s50['expansion16'],'delta_50_minus_34':g['delta_50_minus_34'],'drawdown_authority':g['drawdown_authority'],'automatic_production_promotion':False,'next_gate':g['next_gate']}
          Path('trailaris_50_asset/QV2_50_FRESH_INDEPENDENT_VALIDATION_RESULT.json').write_text(json.dumps(out,indent=2,default=str))
          shutil.copy2('QV2_50_INDEPENDENT_VALIDATION_GATE.json','trailaris_50_asset/QV2_50_INDEPENDENT_VALIDATION_GATE.json')
          print(json.dumps(out,indent=2,default=str))
          PY
      - name: Freeze compact independent validation evidence
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trailaris_50_asset/QV2_50_FRESH_INDEPENDENT_VALIDATION_RESULT.json trailaris_50_asset/QV2_50_INDEPENDENT_VALIDATION_GATE.json
          git commit -m 'evidence: freeze exact-50 fresh independent validation [skip ci]' || exit 0
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: qv2-50-fresh-independent-validation-v3
          path: |
            QV2_50_INDEPENDENT_VALIDATION_GATE.json
            trailaris_50_asset/QV2_50_FRESH_INDEPENDENT_VALIDATION_RESULT.json
            replay34/QV2_34_INDEPENDENT_STATUS.json
            replay34/QV2_34_INDEPENDENT_WEEKLY.csv
            replay50/QV2_50_INDEPENDENT_STATUS.json
            replay50/QV2_50_INDEPENDENT_WEEKLY.csv
          retention-days: 30
