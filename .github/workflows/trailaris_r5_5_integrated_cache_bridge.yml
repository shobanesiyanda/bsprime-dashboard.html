name: Trailaris R5.5 — Liquidity Runway V3 Full 26W Replay

on:
  push:
    branches: [trailaris-r5-4-26week-validation-20260816]
    paths: ['.github/workflows/trailaris_r5_5_integrated_cache_bridge.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: trailaris-r5-5-single-authorized-v3-replay
  cancel-in-progress: false

jobs:
  liquidity-runway-v3-from-locked-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout active R5.5 research branch
        uses: actions/checkout@v4
        with:
          ref: trailaris-ephemeral-research-20260815
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy

      - name: Reconstruct exact frozen R4 dependencies
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py

      - name: Restore preserved frozen 34-route M1 cache
        uses: actions/cache/restore@v4
        with:
          path: trailaris_longcycle/raw_m1
          key: trailaris-r5-4-m1-34-20260119-20260814-v1
          fail-on-cache-miss: true

      - name: Restore frozen 510-cell factory audit
        uses: actions/download-artifact@v4
        with:
          name: trailaris-r5-4-frozen-26week-validation
          path: trailaris_r5_5/frozen_control_evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: shobanesiyanda/bsprime-dashboard.html
          run-id: 31964294244

      - name: Restore exact successful memory112 promotion estate
        uses: actions/download-artifact@v4
        with:
          name: trailaris-r5-5-memory112-accelerated-26week
          path: trailaris_r5_5/memory112_evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: shobanesiyanda/bsprime-dashboard.html
          run-id: 31969697656

      - name: Verify locked V2 baseline and full evidence estate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trailaris_longcycle/results
          cp trailaris_r5_5/frozen_control_evidence/results/R4_FACTORY_AUDIT.csv trailaris_longcycle/results/R4_FACTORY_AUDIT.csv
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          b=json.loads(Path('trailaris_r5_5/R5_5_V2_26W_CANONICAL_BASELINE.json').read_text())
          s=json.loads(Path('trailaris_r5_5/R5_5_LIQUIDITY_RUNWAY_V3_SPEC.json').read_text())
          assert b['state']=='LOCKED_CANONICAL_BASELINE'
          assert abs(b['performance']['end_equity']-1366.8938578865148)<1e-9
          assert b['performance']['losses']==478 and b['performance']['flats']==437
          assert s['state']=='AUTHORIZED_FULL_REPLAY_FROM_LOCKED_V2_BASELINE'
          assert s['scope']=={'weeks':26,'routes':34,'strategy_families':15,'route_strategy_cells':510}
          a=pd.read_csv('trailaris_longcycle/results/R4_FACTORY_AUDIT.csv')
          assert len(a)==510 and a.strategy_family.nunique()==15
          p=pd.read_csv('trailaris_r5_5/memory112_evidence/R5_5_MEMORY112_PROMOTED.csv')
          assert len(p)==3417 and p.asset.nunique()==34 and pd.to_datetime(p.eval_week,utc=True).nunique()==26
          files=list(Path('trailaris_longcycle/raw_m1').glob('*_M1_normalized.csv'))
          assert len(files)==34, f'raw route files={len(files)}'
          print('PASS: locked V2 + exact 34 paths + 510 cells + 3417 promotions / 26 weeks.')
          PY

      - name: Rebuild research sizing specs only
        run: python trailaris_r4/build_research_specs.py

      - name: Execute one full liquidity-runway V3 26-week replay
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5
        run: |
          rm -rf trailaris_r5_5/liquidity_runway_v3_results
          mkdir -p trailaris_r5_5/liquidity_runway_v3_results
          python trailaris_r5_5/run_liquidity_runway_v3_from_memory112_promoted.py \
            --rawdir trailaris_longcycle/raw_m1 \
            --specs trailaris_r4/research_proxy_specs.csv \
            --promoted trailaris_r5_5/memory112_evidence/R5_5_MEMORY112_PROMOTED.csv \
            --factory-audit trailaris_longcycle/results/R4_FACTORY_AUDIT.csv \
            --outdir trailaris_r5_5/liquidity_runway_v3_results

      - name: Upload full V3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: trailaris-r5-5-liquidity-runway-v3-26w
          path: trailaris_r5_5/liquidity_runway_v3_results/
          retention-days: 30

      - name: Commit compact V3 evidence to active R5.5 branch
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f \
            trailaris_r5_5/liquidity_runway_v3_results/R5_5_LIQUIDITY_RUNWAY_V3_STATUS.json \
            trailaris_r5_5/liquidity_runway_v3_results/R5_5_LIQUIDITY_RUNWAY_V3_WEEKLY.csv \
            trailaris_r5_5/liquidity_runway_v3_results/R5_5_LIQUIDITY_RUNWAY_V3_ROLLING_11W.csv
          git commit -m 'test: full R5.5 liquidity-runway V3 26-week replay [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815 || true
          git push origin HEAD:trailaris-ephemeral-research-20260815
