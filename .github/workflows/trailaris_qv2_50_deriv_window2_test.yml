name: Trailaris Quant V2 — Final Independent Deriv Recovery Test
on:
  push:
    branches: [trailaris-qv2-50-independent-validation-20260818]
    paths: ['.github/workflows/trailaris_qv2_50_deriv_window2_test.yml']
permissions:
  contents: read
jobs:
  deriv:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-qv2-50-independent-validation-20260818}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install WebSocket runtime
        run: npm install --no-save --silent ws
      - name: Acquire exact Deriv synthetics on final provider-defined window
        run: node trailaris_50_asset/recover_independent_deriv.js --start '2024-11-18T00:00:00Z' --end '2025-06-16T00:00:00Z' --outdir deriv5
      - uses: actions/upload-artifact@v4
        with:
          name: qv2-final-independent-deriv-recovery-test
          path: deriv5/
          retention-days: 30
