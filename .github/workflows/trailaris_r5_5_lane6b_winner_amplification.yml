name: Trailaris R5.5 Lane 6B Winner Amplification
on:
  workflow_run:
    workflows: ['Trailaris R5.5 Lane 6A Winner Attribution']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        rule_rank: [0,1]
        copies: [1,2,3]
        quality_boost: [0.00,0.04]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Require committed Lane 6A winner evidence
        run: |
          git fetch origin trailaris-ephemeral-research-20260815
          git reset --hard origin/trailaris-ephemeral-research-20260815
          test -s trailaris_r5_5/lane6a_results/R5_5_LANE6A_STATUS.json
          test -s trailaris_r5_5/lane6a_results/R5_5_LANE6A_WINNER_RULES.csv
          python - <<'PY'
          import json
          s=json.load(open('trailaris_r5_5/lane6a_results/R5_5_LANE6A_STATUS.json'))
          assert s['state']=='R5_5_LANE6A_WINNER_ATTRIBUTION_COMPLETE'
          assert abs(float(s['incumbent_lane1b2']['end_equity'])-343.5447309255116)<=1e-6
          assert s['scope']=={'approved_routes':34,'strategy_families':15,'route_strategy_cells':510}
          assert s['partition']['fresh_outcomes_used_for_selection'] is False
          PY
      - name: Reconstruct immutable R4 dependencies
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Rebuild causal evidence and specs
        run: |
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit EVENT_AUDIT_${{ matrix.rule_rank }}_${{ matrix.copies }}_${{ matrix.quality_boost }}.csv
          python trailaris_r4/build_research_specs.py
          python -m py_compile trailaris_r5_5/lane6b_winner_amplification.py
      - name: Run authentic winner amplification replay
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5
        run: |
          mkdir -p lane6b_rule
          python trailaris_r5_5/lane6b_winner_amplification.py \
            --rawdir trailaris_r5/raw_m1 \
            --specs trailaris_r4/research_proxy_specs.csv \
            --rules trailaris_r5_5/lane6a_results/R5_5_LANE6A_WINNER_RULES.csv \
            --rule-rank ${{ matrix.rule_rank }} \
            --copies ${{ matrix.copies }} \
            --quality-boost ${{ matrix.quality_boost }} \
            --outdir lane6b_rule
      - uses: actions/upload-artifact@v4
        with:
          name: r5-lane6b-${{ matrix.rule_rank }}-${{ matrix.copies }}-${{ matrix.quality_boost }}
          path: lane6b_rule/*
          retention-days: 3
  aggregate:
    if: always()
    needs: replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: r5-lane6b-*
          path: collected
          merge-multiple: true
      - name: Aggregate winner amplification evidence
        run: |
          mkdir -p trailaris_r5_5/lane6b_results
          python - <<'PY'
          import glob,json,csv
          from pathlib import Path
          rows=[]
          for f in glob.glob('collected/result.json')+glob.glob('collected/**/result.json',recursive=True):
              try:x=json.load(open(f))
              except:continue
              if x.get('state')!='R5_5_LANE6B_WINNER_AMPLIFICATION_REPLAY_COMPLETE':continue
              c=x['candidate'];rows.append({'rule_rank':x['rule_rank'],'copies':x['copies'],'quality_boost':x['quality_boost'],'qualifying_parent_candidates':x['qualifying_parent_candidates'],'amplified_addons_selected':x['amplified_addons_selected'],'end_equity':c['end_equity'],'delta_vs_1b2':x['delta_vs_1b2'],'fresh_return_pct':c['fresh_return_pct'],'max_weekly_dd_pct':c['max_weekly_dd_pct'],'executed_trades':c['executed_trades'],'wins':c['wins'],'losses':c['losses'],'flat':c['flat'],'nonflat_win_rate':c['nonflat_win_rate'],'assets_with_selected':c['assets_with_selected'],'alpha_candidate':x['alpha_candidate'],'frontier_candidate':x['frontier_candidate']})
          uniq={(r['rule_rank'],r['copies'],r['quality_boost']):r for r in rows};rows=list(uniq.values());rows.sort(key=lambda r:(r['frontier_candidate'],r['alpha_candidate'],r['end_equity'],r['fresh_return_pct'],-r['losses'],-r['flat']),reverse=True)
          out=Path('trailaris_r5_5/lane6b_results')
          if rows:
              with open(out/'R5_5_LANE6B_RESULTS.csv','w',newline='') as h:w=csv.DictWriter(h,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          s={'state':'R5_5_LANE6B_WINNER_AMPLIFICATION_MATRIX_COMPLETE','variants_expected':12,'variants_completed':len(rows),'alpha_candidates':sum(bool(r['alpha_candidate']) for r in rows),'frontier_candidates':sum(bool(r['frontier_candidate']) for r in rows),'best_variant':rows[0] if rows else {},'benchmark':{'lane1b2_end_equity':343.5447309255116,'r54_losses_max':230,'r54_flats_max':424,'fresh_return_floor':7.261646557142409,'max_weekly_dd_floor':-4.637645574907678,'nonflat_win_rate_floor':0.6671428571428571},'scope':{'routes':34,'strategy_families':15,'route_strategy_cells':510}}
          (out/'R5_5_LANE6B_STATUS.json').write_text(json.dumps(s,indent=2));print(json.dumps(s,indent=2))
          PY
      - name: Commit Lane 6B matrix evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_5/lane6b_results/R5_5_LANE6B_RESULTS.csv trailaris_r5_5/lane6b_results/R5_5_LANE6B_STATUS.json 2>/dev/null || true
          git commit -m 'test: R5.5 Lane 6B winner amplification evidence [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815 || true
          git push origin HEAD:trailaris-ephemeral-research-20260815 || true
