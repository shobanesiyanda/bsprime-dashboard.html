name: Trailaris Quant V2 — Approved 16 Evaluation Data Gate
on:
  push:
    branches: [trailaris-quant-v2-50-asset-evaluation-20260818]
    paths: ['.github/workflows/trailaris_qv2_50_approved16_eval_data_gate.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
env:
  DISCOVERY_ARTIFACT_ID: 9301401424
jobs:
  data_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-quant-v2-50-asset-evaluation-20260818}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          npm install --no-save --silent dukascopy-node@1.50.0
          python -m pip install --quiet pandas
      - name: Resolve exact approved 16
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/artifacts/${DISCOVERY_ARTIFACT_ID}/zip > discovery.zip
          mkdir discovery && unzip -q discovery.zip -d discovery
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          approved=[x.strip() for x in Path('trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt').read_text().splitlines() if x.strip()]
          d=pd.read_csv('discovery/DISCOVERED_UNIVERSE.csv');by={str(r.canonical_instrument):r for _,r in d.iterrows()}
          assert len(approved)==16 and set(approved)<=set(by)
          with open('trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16_RESOLVED.tsv','w') as f:
            f.write('instrument_id\tcanonical_instrument\tprovider_name\n')
            for x in approved:
              r=by[x];f.write(f'{r.instrument_id}\t{x}\t{r.provider_name}\n')
          PY
      - name: Acquire exact 26-week M1 for approved 16
        run: node trailaris_full_universe/acquire_duka_exact_26w_shard.js --manifest trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16_RESOLVED.tsv --outdir approved16/raw --shard 0 --shards 1 --concurrency 4
      - name: Preserve eligibility evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.load(open('approved16/raw/ACQUISITION_EVIDENCE.json'))
          rows=[]
          for r in e['evidence']:
            rows.append({k:r.get(k) for k in ['canonical_instrument','instrument_id','provider_name','rows','full_window_coverage','status','first','last','error']})
          out={'state':'APPROVED_16_EVALUATION_DATA_GATE_COMPLETE','assets_scheduled':e['assets_scheduled'],'assets_pass':e['assets_pass'],'assets_fail':e['assets_scheduled']-e['assets_pass'],'all_16_pass':e['assets_pass']==16,'evidence':rows}
          Path('trailaris_50_asset/QV2_50_APPROVED16_EVAL_DATA_STATUS.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trailaris-qv2-50-approved16-eval-data
          path: |
            approved16/raw/ACQUISITION_EVIDENCE.json
            trailaris_50_asset/QV2_50_APPROVED16_EVAL_DATA_STATUS.json
            trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16_RESOLVED.tsv
          retention-days: 30
      - name: Commit compact gate evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trailaris_50_asset/QV2_50_APPROVED16_EVAL_DATA_STATUS.json trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16_RESOLVED.tsv
          git commit -m 'evidence: approved 16 evaluation-data gate [skip ci]' || exit 0
          git pull --rebase origin trailaris-quant-v2-50-asset-evaluation-20260818
          git push origin HEAD:trailaris-quant-v2-50-asset-evaluation-20260818
