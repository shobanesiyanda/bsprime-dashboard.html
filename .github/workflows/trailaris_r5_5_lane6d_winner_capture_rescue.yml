name: Trailaris R5.5 Lane 6D Winner Capture Rescue
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths:
      - '.github/workflows/trailaris_r5_5_lane6d_winner_capture_rescue.yml'
      - 'trailaris_r5_5/lane6d_winner_capture_rescue.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trailaris-r5-5-lane6d-winner-capture-rescue
  cancel-in-progress: true
env:
  BRANCH: trailaris-ephemeral-research-20260815
  CACHE_KEY: trailaris-r5-m1-34-20260504-20260814-v1
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct immutable engine
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: ${{ env.CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Rebuild causal evidence and run rescue replay
        run: |
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit EVENT_AUDIT_L6D_RESCUE.csv
          python trailaris_r4/build_research_specs.py
          python -m py_compile trailaris_r5_5/lane6d_winner_capture_rescue.py
          rm -rf /tmp/l6drescue && mkdir -p /tmp/l6drescue
          PYTHONPATH=trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5 python trailaris_r5_5/lane6d_winner_capture_rescue.py \
            --rawdir trailaris_r5/raw_m1 \
            --specs trailaris_r4/research_proxy_specs.csv \
            --rules trailaris_r5_5/lane6a_results/R5_5_LANE6A_WINNER_RULES.csv \
            --rule-rank 0 \
            --outdir /tmp/l6drescue
      - name: Publish rescue evidence
        run: |
          cp -a /tmp/l6drescue /tmp/l6drescue_publish
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          rm -rf trailaris_r5_5/lane6d_rescue_results
          cp -a /tmp/l6drescue_publish trailaris_r5_5/lane6d_rescue_results
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_5/lane6d_rescue_results
          git commit -m 'test: R5.5 Lane 6D winner-capture rescue evidence [skip ci]' || exit 0
          for i in 1 2 3; do git push origin HEAD:"$BRANCH" && exit 0; git pull --rebase origin "$BRANCH"; done
          exit 1
