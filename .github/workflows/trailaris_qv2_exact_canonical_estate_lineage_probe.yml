name: Trailaris Quant V2 — Exact Canonical Estate Lineage Probe
on:
  push:
    branches: [trailaris-qv2-34-success-attribution-20260818]
    paths: ['.github/workflows/trailaris_qv2_exact_canonical_estate_lineage_probe.yml']
permissions:
  actions: read
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-qv2-34-success-attribution-20260818}
      - name: Locate exact canonical estate runs and artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api 'repos/shobanesiyanda/bsprime-dashboard.html/actions/runs?branch=trailaris-ephemeral-research-20260815&per_page=100' > /tmp/runs.json
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          d=json.load(open('/tmp/runs.json')); names=['Trailaris R5.5 — Quantitative V2 Exact Canonical Estate 26W','Trailaris R5.5 — Quantitative V2 Exact Estate R3 26W']
          out=[]
          for r in sorted(d.get('workflow_runs',[]),key=lambda x:x['created_at'],reverse=True):
              if r.get('name') not in names: continue
              arts=json.loads(subprocess.check_output(['gh','api',f"repos/shobanesiyanda/bsprime-dashboard.html/actions/runs/{r['id']}/artifacts?per_page=100"],text=True)).get('artifacts',[])
              out.append({'name':r['name'],'run_id':r['id'],'status':r['status'],'conclusion':r.get('conclusion'),'head_sha':r['head_sha'],'created_at':r['created_at'],'updated_at':r['updated_at'],'artifacts':[{'id':a['id'],'name':a['name'],'size_in_bytes':a['size_in_bytes'],'expired':a['expired'],'digest':a.get('digest')} for a in arts]})
          Path('trailaris_34_attribution/EXACT_CANONICAL_ESTATE_LINEAGE.json').write_text(json.dumps({'runs':out},indent=2));print(json.dumps(out,indent=2))
          PY
      - name: Commit lineage snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trailaris_34_attribution/EXACT_CANONICAL_ESTATE_LINEAGE.json
          git commit -m 'evidence: exact canonical estate lineage [skip ci]' || exit 0
          git pull --rebase origin trailaris-qv2-34-success-attribution-20260818
          git push origin HEAD:trailaris-qv2-34-success-attribution-20260818
