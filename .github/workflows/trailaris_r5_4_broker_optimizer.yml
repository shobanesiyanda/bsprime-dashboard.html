name: Trailaris R5.4 Multi-Broker Optimizer
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_4_broker_optimizer.yml']
permissions:
  contents: write
jobs:
  broker_optimizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trailaris-ephemeral-research-20260815
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy
      - name: Compile and test optimizer
        run: |
          python -m py_compile trailaris_r5_4/broker_optimizer.py trailaris_r5_4/test_broker_optimizer.py
          cd trailaris_r5_4 && python test_broker_optimizer.py | tee R5_4_BROKER_OPTIMIZER_TEST_RESULTS.txt
      - name: Audit broker universe and hard locks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('trailaris_r5_4/broker_universe.json');d=json.loads(p.read_text())
          ids=[x['broker_id'] for x in d['brokers']]
          new=[x for x in d['brokers'] if x['role']=='NEW_CANDIDATE']
          required={'EXNESS_RAW_SPREAD_MT5','IC_MARKETS_RAW_SPREAD_MT5','PEPPERSTONE_RAZOR_MT5','FP_MARKETS_RAW_MT5','HFM_ZERO_MT5','TICKMILL_RAW_MT5','DERIV_MT5_SYNTHETIC'}
          s={'broker_candidates_total':len(ids),'new_brokers_added':len(new),'exact_broker_set_pass':set(ids)==required,'routes_hard_locked':d['hard_lock']['route_scope'],'strategies_hard_locked':d['hard_lock']['strategy_scope'],'cells_hard_locked':d['hard_lock']['strategy_cells'],'baseline_end_equity':d['hard_lock']['baseline_end_equity'],'ib_cannot_override_execution':d['hard_lock']['ib_revenue_may_not_override_customer_execution_quality'],'route_specific_selection':True,'advertised_spread_is_not_certification':True,'status':'R5_4_BROKER_OPTIMIZER_FOUNDATION_PASS'}
          assert s['broker_candidates_total']==7 and s['new_brokers_added']==5 and s['exact_broker_set_pass']
          assert s['routes_hard_locked']==34 and s['strategies_hard_locked']==15 and s['cells_hard_locked']==510
          Path('trailaris_r5_4/R5_4_BROKER_OPTIMIZER_STATUS.json').write_text(json.dumps(s,indent=2));print(json.dumps(s,indent=2))
          PY
      - name: Commit evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_4/R5_4_BROKER_OPTIMIZER_TEST_RESULTS.txt trailaris_r5_4/R5_4_BROKER_OPTIMIZER_STATUS.json
          git commit -m 'test: R5.4 multi-broker optimizer foundation [skip ci]' || true
          git push origin HEAD:trailaris-ephemeral-research-20260815
