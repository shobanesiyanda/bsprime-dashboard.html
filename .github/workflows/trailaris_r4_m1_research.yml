name: Trailaris R4 34-Route M1 Historical Market Replay
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r4_m1_research.yml']
permissions:
  contents: write
jobs:
  r4-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trailaris-ephemeral-research-20260815
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore R4 true-M1 cache
        id: cache
        uses: actions/cache@v4
        with:
          path: trailaris_r4/raw_m1
          key: trailaris-r4-m1-34-20260504-20260812-v1
      - name: Install dependencies
        run: |
          python -m pip install --quiet pandas numpy
          npm install --no-save --silent dukascopy-node@1.50.0 ws
      - name: Decode exact R4 engine
        run: |
          cat trailaris_r4/r4_runner.part* | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part* | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          python -m py_compile trailaris_r4/trailaris_r4_full_universe_loop.py trailaris_r4/trailaris_r4_asset_adapter.py
      - name: Materialize 34-route true-M1 market histories
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p trailaris_r4/raw_m1
          node trailaris_r4/acquire_m1.js > trailaris_r4/acquire_m1_node.log 2>&1 & P1=$!
          python trailaris_r4/acquire_binance_m1.py > trailaris_r4/acquire_m1_binance.log 2>&1 & P2=$!
          wait $P1
          wait $P2
      - name: Validate 34/34 M1 truth gate
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          routes=['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','NZDUSD','EURJPY','GBPJPY','EURGBP','AUDJPY','CADJPY','GBPCHF','XAUUSD','XAGUSD','BTCUSD','ETHUSD','SOLUSD','BNBUSD','XRPUSD','US100','US500','US30','GER40','UK100','JP225','WTI','BRENT','NATGAS','V75','V50','V100','V25','V10']
          start=pd.Timestamp('2026-05-04T00:00:00Z');end=pd.Timestamp('2026-08-12T23:59:59Z')
          rows=[];passed=[]
          for a in routes:
              p=Path('trailaris_r4/raw_m1')/f'{a}_M1_normalized.csv'
              if not p.exists():rows.append({'asset':a,'state':'MISSING','rows':0});continue
              d=pd.read_csv(p,usecols=['timestamp','source']);ts=pd.to_datetime(d.timestamp,utc=True,errors='coerce');med=ts.sort_values().diff().dropna().dt.total_seconds().median();first=ts.min();last=ts.max();src=str(d.source.dropna().iloc[0]) if len(d) and d.source.notna().any() else ''
              reason=[]
              if ts.isna().any():reason.append('bad_timestamp')
              if pd.notna(med) and med>75:reason.append(f'not_M1_median={med}')
              if first>start+pd.Timedelta(days=1):reason.append('late_start')
              if last<end-pd.Timedelta(days=1):reason.append('early_end')
              if len(d)<100:reason.append('too_few_rows')
              state='PASS' if not reason else 'FAIL'
              if state=='PASS':passed.append(a)
              rows.append({'asset':a,'state':state,'rows':len(d),'first':str(first),'last':str(last),'median_sec':float(med) if pd.notna(med) else None,'source':src,'reason':';'.join(reason)})
          out=pd.DataFrame(rows);out.to_csv('trailaris_r4/M1_34Route_Coverage.csv',index=False)
          summary={'routes_required':34,'routes_pass':len(passed),'missing_or_failed':sorted(set(routes)-set(passed)),'gate_pass':len(passed)==34}
          Path('trailaris_r4/M1_34Route_Coverage.json').write_text(json.dumps(summary,indent=2));print(out.to_string(index=False));print(json.dumps(summary,indent=2))
          if len(passed)!=34:raise SystemExit('34/34 TRUE M1 GATE FAIL')
          PY
      - name: Save R4 M1 data cache
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: trailaris_r4/raw_m1
          key: trailaris-r4-m1-34-20260504-20260812-v1
      - name: Build non-certified research sizing layer
        run: python trailaris_r4/build_research_specs.py
      - name: Run R4 34-route historical-market proxy replay
        env:
          PYTHONPATH: trailaris_r4
        run: |
          rm -rf trailaris_r4/results && mkdir -p trailaris_r4/results
          python trailaris_r4/trailaris_r4_full_universe_loop.py research-proxy --rawdir trailaris_r4/raw_m1 --specs trailaris_r4/research_proxy_specs.csv --outdir trailaris_r4/results | tee trailaris_r4/r4_replay.log
      - name: R4 acceptance audit
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          s=json.load(open('trailaris_r4/results/STATUS.json'))
          v=pd.read_csv('trailaris_r4/results/01_data_validation.csv')
          w=pd.read_csv('trailaris_r4/results/14_untouched_test_weekly.csv')
          c=pd.read_csv('trailaris_r4/results/16b_weekly_34_asset_capture.csv')
          assert len(v)==34 and (v.state=='PASS').all()
          assert s['routes_pass']==34 and s['state']=='FULL_34_ASSET_OPPORTUNITY_LOOP_EXECUTED'
          assert set(c.asset)==set(v.asset)
          audit={'data_routes_pass':34,'weekly_rows':len(w),'capture_assets':c.asset.nunique(),'candidate_campaigns':s.get('candidate_campaigns'),'strategy_cells_triggered':s.get('strategy_cells_triggered'),'max_selected_open_risk_pct':s.get('max_selected_open_risk_pct'),'evidence_class':s.get('evidence_class'),'pass':True}
          Path('trailaris_r4/results/R4_ACCEPTANCE_AUDIT.json').write_text(json.dumps(audit,indent=2));print(json.dumps(audit,indent=2));print(json.dumps(s.get('untouched_test',{}),indent=2))
          PY
      - name: Commit compact evidence and results
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r4/M1_34Route_Coverage.csv trailaris_r4/M1_34Route_Coverage.json 2>/dev/null || true
          git add -f trailaris_r4/results/STATUS.json trailaris_r4/results/R4_ACCEPTANCE_AUDIT.json trailaris_r4/results/01_data_validation.csv trailaris_r4/results/04_asset_strategy_coverage.csv trailaris_r4/results/04b_strategy_factory_510_audit.csv trailaris_r4/results/06c_validation_confirmed_configurations.csv trailaris_r4/results/06d_34_asset_repair_queue.csv trailaris_r4/results/14_untouched_test_weekly.csv trailaris_r4/results/15_untouched_test_monthly.csv trailaris_r4/results/16_untouched_capture_attribution.csv trailaris_r4/results/16b_weekly_34_asset_capture.csv trailaris_r4/results/17_diagnosis.json 2>/dev/null || true
          git commit -m 'test: R4 34-route true-M1 historical market replay [skip ci]' || true
          git push origin HEAD:trailaris-ephemeral-research-20260815
