name: Trailaris R5.4 Broker Route Certification Matrix
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_4_broker_route_matrix.yml','trailaris_r5_4/build_broker_route_matrix.py']
permissions:
  contents: write
jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas
      - run: python trailaris_r5_4/build_broker_route_matrix.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_4/R5_4_BROKER_ROUTE_CERTIFICATION_238.csv trailaris_r5_4/R5_4_BROKER_ROUTE_CERTIFICATION_STATUS.json
          git commit -m 'audit: full R5.4 238-cell broker-route estate [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815
          git push origin HEAD:trailaris-ephemeral-research-20260815
