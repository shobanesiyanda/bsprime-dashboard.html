name: Trailaris R5.5 Cancel Superseded Runs
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_5_cancel_superseded_runs.yml']
permissions:
  actions: write
  contents: write
jobs:
  cancel:
    if: contains(github.event.head_commit.message, 'cancel superseded R5.5 replay runs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815, fetch-depth: 0}
      - name: Cancel superseded runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # Old Lane 5 pre-scope-fix matrix and duplicate frontier-triggered corrected matrix.
          gh api -X POST repos/${GITHUB_REPOSITORY}/actions/runs/31962431090/cancel
          gh api -X POST repos/${GITHUB_REPOSITORY}/actions/runs/31964659049/cancel
          exit 0
      - name: Remove one-shot cleanup workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin trailaris-ephemeral-research-20260815
          git reset --hard origin/trailaris-ephemeral-research-20260815
          git rm -f .github/workflows/trailaris_r5_5_cancel_superseded_runs.yml
          git commit -m 'chore: remove completed one-shot replay canceller [skip ci]'
          git push origin HEAD:trailaris-ephemeral-research-20260815
