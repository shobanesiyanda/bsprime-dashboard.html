name: Trailaris — Exact Canonical Estate Quantitative V2 Cache Bridge

on:
  push:
    branches: [trailaris-r5-4-26week-validation-20260816]
    paths: ['.github/workflows/trailaris_quantitative_v1_cache_bridge_26w.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: trailaris-r5-5-quant-v2-exact-cache-bridge
  cancel-in-progress: false

jobs:
  exact-canonical-estate-cache-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout cache-owning frozen R5.4 branch
        uses: actions/checkout@v4
        with:
          ref: trailaris-r5-4-26week-validation-20260816

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore exact canonical R5.4 34-route M1 cache
        uses: actions/cache/restore@v4
        with:
          path: trailaris_longcycle/raw_m1
          key: trailaris-r5-4-m1-34-20260119-20260814-v1
          fail-on-cache-miss: true

      - name: Checkout frozen-rule Quantitative V2 research source separately
        uses: actions/checkout@v4
        with:
          ref: trailaris-ephemeral-research-20260815
          path: source

      - name: Move exact canonical market cache into research workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/trailaris_longcycle/raw_m1
          mkdir -p source/trailaris_longcycle
          mv trailaris_longcycle/raw_m1 source/trailaris_longcycle/raw_m1
          test "$(find source/trailaris_longcycle/raw_m1 -type f | wc -l)" -gt 0

      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy

      - name: Reconstruct exact frozen R4 dependencies
        working-directory: source
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          python -m py_compile trailaris_r5_5/longcycle_bounded_memory_candidate.py trailaris_r5_5/longcycle_integrated_negative_refinement.py trailaris_r5_5/quantitative_integrated_v1.py trailaris_r5_5/run_quantitative_v2_from_canonical_v2_estate.py

      - name: Restore exact frozen factory audit and canonical V2 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r54_control source/canonical_v2
          mkdir -p /tmp/r54_control source/canonical_v2 source/trailaris_longcycle/results
          gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/artifacts/9268762003/zip > /tmp/r54_control.zip
          echo '3e5258cba30bc0d2d034e6cb9ae62c5520d04bda69ca4dc45183e7b861dcf86d  /tmp/r54_control.zip' | sha256sum -c -
          unzip -q /tmp/r54_control.zip -d /tmp/r54_control
          cp /tmp/r54_control/results/R4_FACTORY_AUDIT.csv source/trailaris_longcycle/results/R4_FACTORY_AUDIT.csv
          gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/artifacts/9270611209/zip > /tmp/canonical_v2.zip
          echo 'a8f48dc53f8e38de961bc757984bba12f90c37bce68ecdefa4e0ece59667dffb  /tmp/canonical_v2.zip' | sha256sum -c -
          unzip -q /tmp/canonical_v2.zip -d source/canonical_v2

      - name: Verify exact evidence estate and frozen rules
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          s=json.loads(Path('canonical_v2/R5_5_INTEGRATED_NEGATIVE_REFINEMENT_STATUS.json').read_text())
          p=pd.read_csv('canonical_v2/R5_5_INTEGRATED_NEGATIVE_REFINEMENT_PROMOTED.csv')
          r=pd.read_csv('canonical_v2/R5_5_INTEGRATED_NEGATIVE_REFINEMENT_GATE_REJECTED.csv')
          q=json.loads(Path('trailaris_r5_5/R5_5_QUANTITATIVE_V2_EXACT_ESTATE_SPEC.json').read_text())
          a=pd.read_csv('trailaris_longcycle/results/R4_FACTORY_AUDIT.csv')
          assert s['source_promotion_estate']=='EXACT_R5_5_MEMORY112_PROMOTED_3417'
          assert s['integrated_counters']['promoted_before_gate']==3417
          assert s['integrated_counters']['entry_gate_rejected']==228
          assert s['integrated_counters']['promoted_after_gate']==3189
          assert len(p)==3189 and len(r)==228
          assert abs(s['candidate']['end_equity']-1366.8938578865148)<1e-9
          assert len(a)==510 and a.strategy_family.nunique()==15
          assert q['state']=='RECONCILIATION_RULES_FROZEN_BEFORE_EXECUTION'
          assert q['causality']['target_week_outcomes_used_for_parameter_selection'] is False
          print('EXACT_CANONICAL_ESTATE_AND_RULE_GATE PASS')
          PY

      - name: Rebuild research sizing specs only
        working-directory: source
        run: python trailaris_r4/build_research_specs.py

      - name: Execute identity-gated exact-estate Quantitative V2 replay
        working-directory: source
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5
        run: |
          rm -rf trailaris_r5_5/quantitative_v2_exact_estate_results
          mkdir -p trailaris_r5_5/quantitative_v2_exact_estate_results
          python trailaris_r5_5/run_quantitative_v2_from_canonical_v2_estate.py \
            --rawdir trailaris_longcycle/raw_m1 \
            --specs trailaris_r4/research_proxy_specs.csv \
            --factory-audit trailaris_longcycle/results/R4_FACTORY_AUDIT.csv \
            --canonical-dir canonical_v2 \
            --outdir trailaris_r5_5/quantitative_v2_exact_estate_results

      - name: Upload complete exact-estate quantitative evidence
        uses: actions/upload-artifact@v4
        with:
          name: trailaris-r5-5-quantitative-v2-exact-canonical-estate-cache-bridge
          path: source/trailaris_r5_5/quantitative_v2_exact_estate_results/
          retention-days: 30
