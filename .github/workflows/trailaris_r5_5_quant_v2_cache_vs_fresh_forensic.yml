name: Trailaris R5.5 — Quant V2 Cache vs Fresh Forensic

on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_5_quant_v2_cache_vs_fresh_forensic.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: trailaris-r5-5-quant-v2-cache-vs-fresh-forensic
  cancel-in-progress: false

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout frozen Quant V2 rules
        uses: actions/checkout@v4
        with:
          ref: 194031e05594e6921b5410e3eb328a5fb53fde94
          path: source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact dependencies and reconstruct R4
        working-directory: source
        run: |
          python -m pip install --quiet pandas numpy
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          python -m py_compile trailaris_r5_5/run_longcycle_r5_5_memory_accelerated.py

      - name: Restore historical cached 34-route estate
        uses: actions/cache/restore@v4
        with:
          path: source/trailaris_longcycle/raw_m1
          key: trailaris-r5-5-active-m1-34-20260119-20260814-v1
          fail-on-cache-miss: true

      - name: Download fresh R3 evidence
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/r3e && mkdir -p /tmp/r3e
          gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/artifacts/9287222399/zip > /tmp/r3e.zip
          unzip -q /tmp/r3e.zip -d /tmp/r3e
          test -f /tmp/r3e/INDEPENDENT_RAW_M1_SHA256.csv
          test -f /tmp/r3e/memory112/R5_5_MEMORY112_PROMOTED.csv

      - name: Hash cached estate and compare raw files to fresh R3
        working-directory: source
        run: |
          mkdir -p trailaris_cache_fresh_forensic
          python - <<'PY'
          import hashlib,json
          import pandas as pd
          from pathlib import Path
          routes=['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','NZDUSD','EURJPY','GBPJPY','EURGBP','AUDJPY','CADJPY','GBPCHF','XAUUSD','XAGUSD','BTCUSD','ETHUSD','SOLUSD','BNBUSD','XRPUSD','US100','US500','US30','GER40','UK100','JP225','WTI','BRENT','NATGAS','V75','V50','V100','V25','V10']
          fresh=pd.read_csv('/tmp/r3e/INDEPENDENT_RAW_M1_SHA256.csv').set_index('asset')
          rows=[]
          for a in routes:
              p=Path('trailaris_longcycle/raw_m1')/f'{a}_M1_normalized.csv'
              d=pd.read_csv(p,usecols=['timestamp','source']); ts=pd.to_datetime(d.timestamp,utc=True,errors='coerce').sort_values()
              oldsha=hashlib.sha256(p.read_bytes()).hexdigest(); fr=fresh.loc[a]
              rows.append({'asset':a,'cached_sha256':oldsha,'fresh_sha256':fr.sha256,'same_sha256':oldsha==fr.sha256,'cached_rows':len(d),'fresh_rows':int(fr.rows),'row_delta_cached_minus_fresh':len(d)-int(fr.rows),'cached_first':str(ts.min()),'fresh_first':str(fr['first']),'cached_last':str(ts.max()),'fresh_last':str(fr['last']),'cached_sources':'|'.join(sorted(map(str,d.source.dropna().unique()))),'fresh_sources':str(fr.sources)})
          out=pd.DataFrame(rows)
          out.to_csv('trailaris_cache_fresh_forensic/RAW_CACHE_VS_FRESH.csv',index=False)
          summary={'state':'RAW_CACHE_VS_FRESH_COMPLETE','routes':len(out),'identical_sha_routes':int(out.same_sha256.sum()),'different_sha_routes':int((~out.same_sha256).sum()),'row_delta_total_cached_minus_fresh':int(out.row_delta_cached_minus_fresh.sum()),'different_assets':out.loc[~out.same_sha256,'asset'].tolist(),'row_delta_by_asset':{r.asset:int(r.row_delta_cached_minus_fresh) for _,r in out.iterrows() if r.row_delta_cached_minus_fresh!=0}}
          Path('trailaris_cache_fresh_forensic/RAW_CACHE_VS_FRESH_SUMMARY.json').write_text(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          PY

      - name: Rebuild factors and specs on cached estate
        working-directory: source
        run: |
          python trailaris_longcycle/build_longcycle_factors.py --rawdir trailaris_longcycle/raw_m1 --out trailaris_longcycle/raw_m1/Trailaris_R3_FactorFeed.csv --audit trailaris_cache_fresh_forensic/CACHED_FACTOR_EVIDENCE.json
          python trailaris_r4/build_research_specs.py

      - name: Reproduce Memory112 from cached estate
        working-directory: source
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5
        run: |
          rm -rf trailaris_cache_fresh_forensic/cached_memory112 && mkdir -p trailaris_cache_fresh_forensic/cached_memory112
          python trailaris_r5_5/run_longcycle_r5_5_memory_accelerated.py --rawdir trailaris_longcycle/raw_m1 --specs trailaris_r4/research_proxy_specs.csv --outdir trailaris_cache_fresh_forensic/cached_memory112

      - name: Compare cached and fresh Memory112 promotion estates
        working-directory: source
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          old=pd.read_csv('trailaris_cache_fresh_forensic/cached_memory112/R5_5_MEMORY112_PROMOTED.csv')
          new=pd.read_csv('/tmp/r3e/memory112/R5_5_MEMORY112_PROMOTED.csv')
          dims=['asset','eval_week']; oc=old.groupby(dims).size().rename('cached_rows'); nc=new.groupby(dims).size().rename('fresh_rows')
          d=pd.concat([oc,nc],axis=1).fillna(0).astype(int).reset_index(); d['delta_cached_minus_fresh']=d.cached_rows-d.fresh_rows
          d.to_csv('trailaris_cache_fresh_forensic/MEMORY112_DELTA_BY_ASSET_WEEK.csv',index=False)
          oa=old.groupby('asset').size().rename('cached_rows'); na=new.groupby('asset').size().rename('fresh_rows'); a=pd.concat([oa,na],axis=1).fillna(0).astype(int).reset_index(); a['delta_cached_minus_fresh']=a.cached_rows-a.fresh_rows; a.to_csv('trailaris_cache_fresh_forensic/MEMORY112_DELTA_BY_ASSET.csv',index=False)
          key=['entry_time','asset','strategy','eval_week']
          oks=set(map(tuple,old[key].astype(str).to_numpy())); nks=set(map(tuple,new[key].astype(str).to_numpy()))
          summary={'state':'MEMORY112_CACHE_VS_FRESH_FORENSIC_COMPLETE','cached_promoted_rows':len(old),'fresh_promoted_rows':len(new),'delta_cached_minus_fresh':len(old)-len(new),'cached_assets':old.asset.nunique(),'fresh_assets':new.asset.nunique(),'cached_only_key_rows':len(oks-nks),'fresh_only_key_rows':len(nks-oks),'asset_deltas':{r.asset:int(r.delta_cached_minus_fresh) for _,r in a.iterrows() if r.delta_cached_minus_fresh!=0},'largest_asset_week_deltas':d.loc[d.delta_cached_minus_fresh!=0].sort_values('delta_cached_minus_fresh',key=lambda s:s.abs(),ascending=False).head(40).to_dict('records'),'exact_frozen_3417_reproduced':len(old)==3417,'fresh_3326_confirmed':len(new)==3326}
          Path('trailaris_cache_fresh_forensic/MEMORY112_CACHE_VS_FRESH_SUMMARY.json').write_text(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          PY

      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trailaris-r5-5-quant-v2-cache-vs-fresh-forensic
          path: source/trailaris_cache_fresh_forensic/
          retention-days: 30
