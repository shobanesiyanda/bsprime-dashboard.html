name: Trailaris R5.5 Lane 4C Market-State Authentic Shortlist
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths:
      - 'trailaris_r5_5/lane4c_market_state_shortlist_rule.py'
      - '.github/workflows/trailaris_r5_5_lane4c_market_state_shortlist.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        rank: [0,1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct immutable R4 dependencies
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Rebuild exact causal evidence and specs
        run: |
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit EVENT_AUDIT_${{ matrix.rank }}.csv
          python trailaris_r4/build_research_specs.py
          python -m py_compile trailaris_r5_5/lane4_market_state_entry_repair.py trailaris_r5_5/lane4b_authentic_market_state_gate.py trailaris_r5_5/lane4c_market_state_shortlist_rule.py
      - name: Run authentic clean market-state rule
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5
        run: |
          mkdir -p rule_out
          python trailaris_r5_5/lane4c_market_state_shortlist_rule.py \
            --rawdir trailaris_r5/raw_m1 \
            --specs trailaris_r4/research_proxy_specs.csv \
            --rules-csv trailaris_r5_5/lane4a_results/R5_5_LANE4A_MARKET_STATE_RULES.csv \
            --status trailaris_r5_5/lane4a_results/R5_5_LANE4A_STATUS.json \
            --rank-index ${{ matrix.rank }} \
            --outdir rule_out
      - uses: actions/upload-artifact@v4
        with:
          name: r5-lane4c-${{ matrix.rank }}
          path: rule_out/*
          retention-days: 2
  aggregate:
    if: always()
    needs: replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: r5-lane4c-*
          path: collected
          merge-multiple: true
      - name: Aggregate clean market-state shortlist
        run: |
          mkdir -p trailaris_r5_5/lane4c_results
          python - <<'PY'
          import csv,glob,json
          from pathlib import Path
          rows=[]
          for f in sorted(glob.glob('collected/rule_*.json')):
              x=json.load(open(f));c=x['candidate'];r=x['rule'];g=x['gates']
              rows.append({'rank_index':x['rank_index'],'target':r['target'],'scope_type':r['scope_type'],'scope_value':r['scope_value'],'rule_type':r['rule_type'],'feature1':r['feature1'],'dir1':r['dir1'],'threshold1':r['threshold1'],'feature2':r.get('feature2',''),'dir2':r.get('dir2',''),'threshold2':r.get('threshold2'),'excluded_promotions':x['excluded_promotions'],'end_equity':c['end_equity'],'delta_end_equity':x['delta_end_equity'],'executed_trades':c['executed_trades'],'wins':c['wins'],'losses':c['losses'],'flat':c['flat'],'nonflat_win_rate':c['nonflat_win_rate'],'max_weekly_dd_pct':c['max_weekly_dd_pct'],'fresh_return_pct':c['fresh_return_pct'],'aug13_14_verification_delta_pct':x['aug13_14_verification_delta_pct'],**g,'pre_forward_candidate':x['pre_forward_candidate']})
          rows.sort(key=lambda z:(z['pre_forward_candidate'],z['end_equity'],-z['losses'],-z['flat'],z['nonflat_win_rate']),reverse=True)
          out=Path('trailaris_r5_5/lane4c_results')
          if rows:
              with open(out/'R5_5_LANE4C_RESULTS.csv','w',newline='') as h:
                  w=csv.DictWriter(h,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          best=rows[0] if rows else {}
          s={'state':'R5_5_LANE4C_MARKET_STATE_AUTHENTIC_SHORTLIST_COMPLETE','evidence_class':'END_TO_END_CAUSAL_FULL_REPLAY','rules_expected':9,'rules_completed':len(rows),'pre_forward_candidates':sum(bool(r['pre_forward_candidate']) for r in rows),'best_rule':best,'r5_4_control_end_equity':337.4231242104393,'approved_scope':{'routes':34,'strategy_families':15,'route_strategy_cells':510},'promotion_candidate':False,'promotion_blockers':['NEW_UNSEEN_FORWARD_HOLDOUT_REQUIRED','TARGET_SERVER_BROKER_EXECUTION_CERTIFICATION_REQUIRED']}
          (out/'R5_5_LANE4C_STATUS.json').write_text(json.dumps(s,indent=2,default=str));print(json.dumps(s,indent=2,default=str))
          PY
      - name: Assert full clean shortlist
        run: |
          python - <<'PY'
          import json
          s=json.load(open('trailaris_r5_5/lane4c_results/R5_5_LANE4C_STATUS.json'))
          assert s['rules_completed']==9
          assert s['approved_scope']=={'routes':34,'strategy_families':15,'route_strategy_cells':510}
          assert s['promotion_candidate'] is False
          PY
      - name: Commit Lane 4C evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_5/lane4c_results/R5_5_LANE4C_RESULTS.csv trailaris_r5_5/lane4c_results/R5_5_LANE4C_STATUS.json 2>/dev/null || true
          git commit -m 'test: R5.5 Lane 4C authentic market-state shortlist [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815 || true
          git push origin HEAD:trailaris-ephemeral-research-20260815 || true
