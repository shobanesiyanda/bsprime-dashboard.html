name: Trailaris R5.5 Lane 2A Entry Thesis Discovery
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths:
      - 'trailaris_r5_5/lane2_entry_thesis_discovery.py'
      - '.github/workflows/trailaris_r5_5_lane2a_entry_thesis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct immutable R4 dependencies
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Rebuild exact causal evidence and specs
        run: |
          mkdir -p trailaris_r5_5/lane2a_results
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit trailaris_r5_5/lane2a_results/EVENT_AUDIT.csv
          python trailaris_r4/build_research_specs.py
          python -m py_compile trailaris_r5_5/lane2_entry_thesis_discovery.py
      - name: Run chronological entry-thesis discovery
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5
        run: |
          python trailaris_r5_5/lane2_entry_thesis_discovery.py \
            --rawdir trailaris_r5/raw_m1 \
            --specs trailaris_r4/research_proxy_specs.csv \
            --outdir trailaris_r5_5/lane2a_results
      - name: Assert immutable R5.4 and full universe
        run: |
          python - <<'PY'
          import json
          s=json.load(open('trailaris_r5_5/lane2a_results/R5_5_LANE2A_STATUS.json'))
          assert abs(float(s['r5_4_control']['end_equity'])-337.4231242104393)<=1e-9
          assert s['scope']=={'approved_routes':34,'strategy_families':15,'route_strategy_cells':510}
          assert s['r5_4_control']['executed_trades']==1102
          PY
      - name: Commit Lane 2A evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_5/lane2a_results/R5_5_LANE2A_ENTRY_GATES.csv trailaris_r5_5/lane2a_results/R5_5_LANE2A_STATUS.json 2>/dev/null || true
          git commit -m 'test: R5.5 Lane 2A entry-thesis evidence [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815 || true
          git push origin HEAD:trailaris-ephemeral-research-20260815 || true
