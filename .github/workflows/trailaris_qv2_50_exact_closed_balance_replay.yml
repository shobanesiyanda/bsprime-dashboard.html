name: Trailaris Quant V2 — Exact 50 Asset Closed-Balance Replay

on:
  push:
    branches: [trailaris-quant-v2-50-asset-evaluation-20260818]
    paths:
      - '.github/workflows/trailaris_qv2_50_exact_closed_balance_replay.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  QV2_BLOB: 120390ab52e80f51bafedc42389ceb7420a410f2
  DISCOVERY_ARTIFACT_ID: 9301401424
  ORIGINAL34_ARTIFACT_ID: 9308647757
  COCOA_BUNDLE_ARTIFACT_ID: 9308982790
  EVAL_BRANCH: trailaris-quant-v2-50-asset-evaluation-20260818

jobs:
  new16:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-quant-v2-50-asset-evaluation-20260818}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact runtime
        run: |
          set -euo pipefail
          npm install --no-save --silent dukascopy-node@1.50.0
          python -m pip install --quiet pandas numpy
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v2.py)" = "$QV2_BLOB"
      - name: Resolve exact Founder-approved 16
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/artifacts/${DISCOVERY_ARTIFACT_ID}/zip > discovery.zip
          mkdir discovery && unzip -q discovery.zip -d discovery
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          approved=[x.strip() for x in Path('trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt').read_text().splitlines() if x.strip()]
          expected=['COCOA.CMD','SUGAR.CMD','COFFEE.CMD','AAPL.US','SOYBEAN.CMD','NVDA.US','MSFT.US','USDCNH','V.US','AUDNZD','EURCHF','GBPNZD','FRA.IDX','TSLA.US','CHI.IDX','COPPER.CMD']
          assert approved==expected and len(set(approved))==16
          d=pd.read_csv('discovery/DISCOVERED_UNIVERSE.csv');by={str(r.canonical_instrument):r for _,r in d.iterrows()}
          assert set(approved)<=set(by)
          with open('APPROVED16.tsv','w') as f:
              f.write('instrument_id\tcanonical_instrument\tprovider_name\n')
              for a in approved:
                  r=by[a];f.write(f"{r.instrument_id}\t{a}\t{r.provider_name}\n")
          print('FOUNDER_APPROVED_16_IDENTITY PASS')
          PY
      - name: Acquire exact 26-week M1 for approved additions
        run: node trailaris_full_universe/acquire_duka_exact_26w_shard.js --manifest APPROVED16.tsv --outdir raw16 --shard 0 --shards 1 --concurrency 4
      - name: Enforce fresh-data gate for 15 non-COCOA additions
        run: |
          set -euo pipefail
          mkdir -p raw15
          python - <<'PY'
          import json
          e=json.load(open('raw16/ACQUISITION_EVIDENCE.json'))
          keep=[r for r in e['evidence'] if r['canonical_instrument']!='COCOA.CMD']
          bad=[r for r in keep if r.get('status')!='PASS']
          assert len(keep)==15 and not bad,bad
          out={'shard':0,'shards':1,'assets_scheduled':15,'assets_pass':15,'evidence':keep}
          json.dump(out,open('raw15/ACQUISITION_EVIDENCE.json','w'),indent=2)
          print('FRESH_15_EVALUATION_DATA PASS')
          PY
      - name: Build fresh 15 asset-local bundle
        env: {PYTHONPATH: '.:trailaris_r4:trailaris_full_universe'}
        run: python trailaris_100_asset/build_asset_bundle.py --rawdir raw15 --outdir bundle16/fresh15
      - name: Restore preserved accepted COCOA bundle
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/artifacts/${COCOA_BUNDLE_ARTIFACT_ID}/zip > cocoa-source.zip
          echo 'c052fdcce4f54b8fb0f60350cf7e37d2b9b94b6f453bde109a675bead8361d41  cocoa-source.zip' | sha256sum -c -
          mkdir cocoa-source && unzip -q cocoa-source.zip -d cocoa-source
          mkdir -p bundle16/preserved-cocoa
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          import pandas as pd
          src=Path('cocoa-source');dst=Path('bundle16/preserved-cocoa')
          idx=pd.read_csv(src/'FEATURE_INDEX.csv');z=idx[idx.asset.astype(str).eq('COCOA.CMD')].copy();assert len(z)==1,z
          row=z.iloc[0];shutil.copy2(src/str(row.feature_file),dst/str(row.feature_file));z.to_csv(dst/'FEATURE_INDEX.csv',index=False)
          c=pd.read_csv(src/'CANDIDATES.csv.gz');c=c[c.asset.astype(str).eq('COCOA.CMD')].copy();assert len(c)>0 and c.asset.nunique()==1
          c.to_csv(dst/'CANDIDATES.csv.gz',index=False,compression='gzip')
          s={'state':'PRESERVED_COCOA_BUNDLE_EXTRACTED','asset':'COCOA.CMD','feature_rows':int(row.feature_rows),'candidate_rows':len(c),'source_artifact_id':9308982790,'source_artifact_digest':'sha256:c052fdcce4f54b8fb0f60350cf7e37d2b9b94b6f453bde109a675bead8361d41','selection_outcomes_used':False}
          (dst/'BUNDLE_SUMMARY.json').write_text(json.dumps(s,indent=2));print(json.dumps(s,indent=2))
          PY
      - name: Verify exact approved-16 bundle composition
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          rows=[]
          for f in Path('bundle16').rglob('FEATURE_INDEX.csv'):rows.extend(pd.read_csv(f).asset.astype(str).tolist())
          expected=set(x.strip() for x in Path('trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt').read_text().splitlines() if x.strip())
          assert len(rows)==16 and set(rows)==expected and len(set(rows))==16,(len(rows),sorted(set(rows)^expected))
          print('APPROVED_16_BUNDLE_IDENTITY PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qv2-50-approved16-bundle
          path: bundle16/
          retention-days: 30

  assemble:
    needs: new16
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-quant-v2-50-asset-evaluation-20260818}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore exact runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet pandas numpy
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v2.py)" = "$QV2_BLOB"
      - name: Restore preserved original-34 bundle
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p bundles/original34
          gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/artifacts/${ORIGINAL34_ARTIFACT_ID}/zip > original34.zip
          echo '50998265a97ea185025fc6b540f27f54e50157e9b233bfa01038c386e5750c27  original34.zip' | sha256sum -c -
          unzip -q original34.zip -d bundles/original34
          test -f bundles/original34/FEATURE_INDEX.csv
          test -f bundles/original34/Trailaris_R3_FactorFeed.csv
      - uses: actions/download-artifact@v4
        with: {name: qv2-50-approved16-bundle, path: bundles/approved16}
      - name: Assemble exact 50-asset universe
        env: {PYTHONPATH: '.:trailaris_r4'}
        run: |
          python trailaris_50_asset/assemble_50_universe.py --bundle-root bundles --factor-feed bundles/original34/Trailaris_R3_FactorFeed.csv --approved16 trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt --outdir assembled50
          python - <<'PY'
          import json
          s=json.load(open('assembled50/ASSEMBLY_SUMMARY.json'))
          assert s['feature_assets']==50 and s['candidate_assets']==50 and s['strategy_families']==15 and s['quant_v2_modified'] is False
          print('EXACT_50_ASSEMBLY PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qv2-50-exact-assembled
          path: assembled50/
          retention-days: 30

  promote:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-quant-v2-50-asset-evaluation-20260818}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore exact runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet pandas numpy
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v2.py)" = "$QV2_BLOB"
          test "$(git rev-parse HEAD:trailaris_r5_5/longcycle_integrated_negative_refinement.py)" = "a6f6fcc8dfc1d265c5917dc9df3f3c73eb08d6cb"
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v1.py)" = "c3debf8da3f184d86c59a287b25a58ebe105bd03"
      - uses: actions/download-artifact@v4
        with: {name: qv2-50-exact-assembled, path: assembled50}
      - name: Execute exact weekly promotion shard
        env: {PYTHONPATH: '.:trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5'}
        run: python trailaris_50_asset/promote_50_shard.py --universe-dir assembled50 --shard ${{ matrix.shard }} --shards 6 --outdir promoted-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: qv2-50-promoted-${{ matrix.shard }}
          path: promoted-${{ matrix.shard }}/
          retention-days: 30

  replay:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-quant-v2-50-asset-evaluation-20260818}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore runtime and verify identities
        run: |
          set -euo pipefail
          python -m pip install --quiet pandas numpy
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          python trailaris_r4/build_research_specs.py
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v2.py)" = "$QV2_BLOB"
          test "$(git rev-parse HEAD:trailaris_r5_5/longcycle_integrated_negative_refinement.py)" = "a6f6fcc8dfc1d265c5917dc9df3f3c73eb08d6cb"
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v1.py)" = "c3debf8da3f184d86c59a287b25a58ebe105bd03"
      - uses: actions/download-artifact@v4
        with: {name: qv2-50-exact-assembled, path: assembled50}
      - uses: actions/download-artifact@v4
        with: {pattern: qv2-50-promoted-*, path: promoted}
      - name: Apply realized closed-balance lot sizing only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('trailaris_r5_4/R5_BASE_CAUSAL_ENGINE.py');s=p.read_text();old='r4.size_trade(r.asset,eq,rf,float(r.stop_distance),specs)';new='r4.size_trade(r.asset,balance,rf,float(r.stop_distance),specs)'
          assert s.count(old)==2,s.count(old);p.write_text(s.replace(old,new));assert p.read_text().count(new)==2
          print('REALIZED_CLOSED_BALANCE_SIZING PASS')
          PY
      - name: Execute exact sequential 50-asset portfolio replay
        env: {PYTHONPATH: '.:trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5'}
        run: python trailaris_50_asset/replay_50_from_promoted.py --universe-dir assembled50 --promoted-root promoted --specs trailaris_r4/research_proxy_specs.csv --balance-control trailaris_100_asset/QV2_34_BALANCE_REPLAY_RESULT.json --approved16 trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt --outdir replay50
      - uses: actions/upload-artifact@v4
        with:
          name: trailaris-qv2-50-exact-closed-balance-replay
          path: replay50/
          retention-days: 30
      - name: Preserve compact evaluation evidence
        run: |
          set -euo pipefail
          mkdir -p trailaris_50_asset/results
          cp replay50/QV2_50_REPLAY_STATUS.json trailaris_50_asset/results/
          cp replay50/QV2_50_WEEKLY.csv trailaris_50_asset/results/
          cp assembled50/ASSEMBLY_SUMMARY.json trailaris_50_asset/results/QV2_50_ASSEMBLY_SUMMARY.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trailaris_50_asset/results/
          git commit -m 'evidence: exact Quant V2 50-asset closed-balance replay [skip ci]'
          git pull --rebase origin "$EVAL_BRANCH"
          git push origin HEAD:"$EVAL_BRANCH"
