name: Trailaris R5.5 Lane 2B Authentic Entry Gate
on:
  workflow_run:
    workflows: ['Trailaris R5.5 Lane 2A Entry Thesis Discovery']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  authentic_entry:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct immutable R4 dependencies
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Rebuild exact causal evidence and specs
        run: |
          mkdir -p trailaris_r5_5/lane2b_results
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit trailaris_r5_5/lane2b_results/EVENT_AUDIT.csv
          python trailaris_r4/build_research_specs.py
          python -m py_compile trailaris_r5_5/lane2b_authentic_entry_gate.py
      - name: Run authentic entry gate replay
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5
        run: |
          test -f trailaris_r5_5/lane2a_results/R5_5_LANE2A_STATUS.json
          python trailaris_r5_5/lane2b_authentic_entry_gate.py \
            --rawdir trailaris_r5/raw_m1 \
            --specs trailaris_r4/research_proxy_specs.csv \
            --lane2a-status trailaris_r5_5/lane2a_results/R5_5_LANE2A_STATUS.json \
            --outdir trailaris_r5_5/lane2b_results
      - name: Assert immutable scope if replay ran
        run: |
          python - <<'PY'
          import json
          s=json.load(open('trailaris_r5_5/lane2b_results/R5_5_LANE2B_STATUS.json'))
          if s['state']=='R5_5_LANE2B_AUTHENTIC_ENTRY_GATE_COMPLETE':
              assert abs(float(s['r5_4_control']['end_equity'])-337.4231242104393)<=1e-9
              assert s['approved_scope']['approved_routes']==34
              assert s['approved_scope']['strategy_families']==15
              assert s['approved_scope']['route_strategy_cells']==510
          PY
      - name: Commit Lane 2B evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_5/lane2b_results/R5_5_LANE2B_STATUS.json trailaris_r5_5/lane2b_results/R5_5_LANE2B_WEEKLY.csv 2>/dev/null || true
          git commit -m 'test: R5.5 Lane 2B authentic entry evidence [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815 || true
          git push origin HEAD:trailaris-ephemeral-research-20260815 || true
