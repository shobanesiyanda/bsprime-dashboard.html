name: Trailaris R5.3 Forensic Attribution
on:
  workflow_run:
    workflows: ["Trailaris R5.3 Forensic Ledger Recovery"]
    types: [completed]
permissions:
  contents: write
jobs:
  attribute:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trailaris-ephemeral-research-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy
      - name: Build exact forensic attribution from frozen event ledger
        run: |
          python - <<'PY'
          import json, gzip, math
          from pathlib import Path
          import numpy as np
          import pandas as pd
          root=Path('trailaris_r5_3_forensic')
          ev=pd.read_csv(root/'R5_events.csv.gz',compression='gzip')
          de=pd.read_csv(root/'R5_decisions.csv.gz',compression='gzip')
          for c in ['timestamp','entry_time','decision_time','exit_time','eval_week']:
              if c in ev: ev[c]=pd.to_datetime(ev[c],utc=True,errors='coerce')
              if c in de: de[c]=pd.to_datetime(de[c],utc=True,errors='coerce')
          for c in ['net_pnl','net_r','gross_r','cost_r','mfe_r','mae_r','giveback_r','risk_cash','lot','equity_at_entry']:
              if c in ev: ev[c]=pd.to_numeric(ev[c],errors='coerce')
          total=float(ev.net_pnl.sum())
          # Normalized research-spread dollar drag implied by the frozen risk-R accounting.
          ev['gross_pnl_model']=ev['risk_cash']*ev['gross_r'] if {'risk_cash','gross_r'}<=set(ev.columns) else np.nan
          ev['spread_cost_pnl_model']=ev['risk_cash']*ev['cost_r'] if {'risk_cash','cost_r'}<=set(ev.columns) else np.nan
          # Static no-compounding comparator: scale each executed event's original risk cash back to a $100 equity base.
          if {'net_pnl','equity_at_entry'}<=set(ev.columns):
              ev['fixed100_pnl_static']=ev.net_pnl*(100.0/ev.equity_at_entry.replace(0,np.nan))
          else: ev['fixed100_pnl_static']=np.nan
          def stat(group):
              g=group
              loss=g[g.net_pnl<0].net_pnl
              win=g[g.net_pnl>0].net_pnl
              return pd.Series({
                  'trades':len(g),'net_pnl':g.net_pnl.sum(),'wins':len(win),'losses':len(loss),'flats':int((g.net_pnl==0).sum()),
                  'avg_pnl':g.net_pnl.mean(),'avg_loss':loss.mean() if len(loss) else np.nan,'median_loss':loss.median() if len(loss) else np.nan,
                  'avg_mae_r':g.mae_r.mean() if 'mae_r' in g else np.nan,'avg_mfe_r':g.mfe_r.mean() if 'mfe_r' in g else np.nan,
                  'avg_giveback_r':g.giveback_r.mean() if 'giveback_r' in g else np.nan,
                  'model_spread_cost_pnl':g.spread_cost_pnl_model.sum(min_count=1),'fixed100_pnl_static':g.fixed100_pnl_static.sum(min_count=1)
              })
          def save_group(cols,name):
              x=ev.groupby(cols,dropna=False).apply(stat,include_groups=False).reset_index()
              x['pnl_contribution_pct']=100*x.net_pnl/total if total else 0
              x.to_csv(root/name,index=False)
              return x
          byfam=save_group(['strategy_family'],'FORENSIC_BY_STRATEGY_FAMILY.csv')
          bycell=save_group(['asset','strategy_family'],'FORENSIC_ASSET_X_FAMILY.csv')
          bystrat=save_group(['asset','strategy','strategy_family'],'FORENSIC_ASSET_X_STRATEGY.csv')
          bycamp=save_group(['campaign_id','asset','strategy','strategy_family'],'FORENSIC_BY_CAMPAIGN.csv')
          bymgmt=save_group(['management'],'FORENSIC_BY_MANAGEMENT.csv') if 'management' in ev else pd.DataFrame()
          byexit=save_group(['exit_reason'],'FORENSIC_BY_EXIT_REASON.csv') if 'exit_reason' in ev else pd.DataFrame()
          if 'is_addon' in ev:
              ev['entry_role']=np.where(ev.is_addon.astype(str).str.lower().isin(['true','1']),'ADDON','FOUNDATION')
          else: ev['entry_role']='FOUNDATION'
          byrole=save_group(['entry_role'],'FORENSIC_ENTRY_ROLE.csv')
          # day/week/session
          ev['day']=ev.timestamp.dt.floor('D')
          ev['week_start']=ev.eval_week.dt.floor('D') if 'eval_week' in ev else (ev.timestamp-pd.to_timedelta(ev.timestamp.dt.weekday,unit='D')).dt.floor('D')
          def sess(r):
              h=r.decision_time.hour+r.decision_time.minute/60 if pd.notna(r.decision_time) else -1
              a=str(r.asset)
              fx={'EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','NZDUSD','EURJPY','GBPJPY','EURGBP','AUDJPY','CADJPY','GBPCHF','XAUUSD','XAGUSD'}
              if a in fx:
                  return 'TOKYO' if 0<=h<7 else ('LONDON' if 7<=h<13.5 else ('NEW_YORK' if 13.5<=h<21 else 'OFF_SESSION'))
              if a in {'US100','US500','US30'}: return 'US_CASH' if 13.5<=h<21 else 'US_EXTENDED'
              if a in {'GER40','UK100'}: return 'EU_CASH' if 7<=h<16 else 'EU_EXTENDED'
              if a=='JP225': return 'TOKYO_CASH' if 0<=h<7 else 'JP_EXTENDED'
              if a in {'WTI','BRENT','NATGAS'}: return 'LONDON' if 7<=h<13.5 else ('NEW_YORK' if 13.5<=h<21 else 'ENERGY_OFF')
              if a in {'BTCUSD','ETHUSD','SOLUSD','BNBUSD','XRPUSD'}: return 'CRYPTO_ASIA' if 0<=h<8 else ('CRYPTO_EUROPE' if h<14 else 'CRYPTO_US')
              return 'SYNTH_BLOCK_A' if 0<=h<8 else ('SYNTH_BLOCK_B' if h<16 else 'SYNTH_BLOCK_C')
          ev['session_proxy']=ev.apply(sess,axis=1)
          byday=save_group(['day'],'FORENSIC_BY_DAY.csv')
          byweek=save_group(['week_start'],'FORENSIC_BY_WEEK.csv')
          bysession=save_group(['session_proxy'],'FORENSIC_BY_SESSION.csv')
          # Behavioral regime proxy - explicitly not an independent market-regime label.
          mp={'TREND_FOLLOWING':'TREND','MOMENTUM_PULLBACK':'TREND','BREAKOUT_RETEST':'BREAKOUT','SUPPLY_DEMAND':'REVERSAL_STRUCTURE','LIQUIDITY_STRUCTURE':'REVERSAL_STRUCTURE','MEAN_REVERSION':'RANGE_MEAN_REVERSION','VOLATILITY_REGIME':'VOLATILITY','SESSION_TIME':'SESSION','RELATIVE_VALUE_PAIRS':'CROSS_ASSET','INTERMARKET':'CROSS_ASSET','EVENT_RESPONSE':'EVENT_DRIVEN','ENSEMBLE_REGIME':'MIXED','CAMPAIGN_MANAGEMENT':'CAMPAIGN_MANAGEMENT'}
          ev['regime_proxy']=ev.strategy_family.map(mp).fillna('OTHER')
          byreg=save_group(['regime_proxy'],'FORENSIC_BY_REGIME_PROXY.csv')
          # Losing week autopsy.
          lw=ev[ev.week_start==pd.Timestamp('2026-06-08',tz='UTC')].copy()
          for cols,name in [(['asset'],'FORENSIC_LOSING_WEEK_ASSET.csv'),(['strategy_family'],'FORENSIC_LOSING_WEEK_FAMILY.csv'),(['exit_reason'],'FORENSIC_LOSING_WEEK_EXIT.csv'),(['management'],'FORENSIC_LOSING_WEEK_MANAGEMENT.csv')]:
              if all(c in lw for c in cols):
                  x=lw.groupby(cols,dropna=False).apply(stat,include_groups=False).reset_index();x.to_csv(root/name,index=False)
          # Decision rejection reasons during losing week.
          if len(de):
              de['week_start']=de.eval_week.dt.floor('D') if 'eval_week' in de else (de.decision_time-pd.to_timedelta(de.decision_time.dt.weekday,unit='D')).dt.floor('D')
              dl=de[de.week_start==pd.Timestamp('2026-06-08',tz='UTC')]
              dl.reason.value_counts(dropna=False).rename_axis('reason').reset_index(name='count').to_csv(root/'FORENSIC_LOSING_WEEK_DECISION_REASONS.csv',index=False)
          # Daily opportunity join.
          opp_path=root/'R5_3_DAILY_OPPORTUNITY.csv.gz'
          daily_capture={}
          if opp_path.exists():
              op=pd.read_csv(opp_path,compression='gzip');op['day']=pd.to_datetime(op.day,utc=True,errors='coerce')
              cap=ev.copy();cap['captured_positive_move_pct']=((((cap.exit_price-cap.entry_price)*cap.direction).clip(lower=0))/cap.entry_price.abs().clip(lower=1e-12)*100)
              c=cap.groupby(['asset','day']).agg(net_pnl=('net_pnl','sum'),captured_positive_move_pct=('captured_positive_move_pct','sum'),avg_mae_r=('mae_r','mean'),avg_mfe_r=('mfe_r','mean'),avg_giveback_r=('giveback_r','mean')).reset_index()
              j=op.merge(c,on=['asset','day'],how='left').fillna({'net_pnl':0,'captured_positive_move_pct':0,'avg_mae_r':0,'avg_mfe_r':0,'avg_giveback_r':0})
              j['directional_capture_ratio']=np.where(j.directional_open_close_pct>0,j.captured_positive_move_pct/j.directional_open_close_pct,0)
              j['swing_capture_ratio']=np.where(j.executable_swing_pct>0,j.captured_positive_move_pct/j.executable_swing_pct,0)
              j['missed_swing_pct']=(j.executable_swing_pct-j.captured_positive_move_pct).clip(lower=0)
              j.to_csv(root/'FORENSIC_DAILY_OPPORTUNITY_CAPTURE.csv',index=False)
              daily_capture={'asset_days':len(j),'swing_opportunity_pct_sum':float(j.executable_swing_pct.sum()),'directional_pct_sum':float(j.directional_open_close_pct.sum()),'captured_positive_move_pct_sum':float(j.captured_positive_move_pct.sum()),'aggregate_swing_capture_ratio':float(j.captured_positive_move_pct.sum()/j.executable_swing_pct.sum()) if j.executable_swing_pct.sum() else 0}
          # Global loss distribution and concentration.
          losses=ev[ev.net_pnl<0].net_pnl
          pos=ev[ev.net_pnl>0].net_pnl
          assets=ev.groupby('asset').net_pnl.sum().sort_values(ascending=False)
          def top_share(n): return float(assets.head(n).sum()/total) if total else 0
          summary={
              'events':len(ev),'event_pnl_sum':total,'wins':int((ev.net_pnl>0).sum()),'losses':int((ev.net_pnl<0).sum()),'flats':int((ev.net_pnl==0).sum()),
              'gross_positive_pnl':float(pos.sum()),'gross_negative_pnl':float(losses.sum()),'avg_loss':float(losses.mean()),'median_loss':float(losses.median()),'worst_loss':float(losses.min()),
              'loss_p05':float(losses.quantile(.05)),'loss_p01':float(losses.quantile(.01)),
              'avg_mae_r':float(ev.mae_r.mean()),'avg_mfe_r':float(ev.mfe_r.mean()),'avg_giveback_r':float(ev.giveback_r.mean()),
              'model_spread_cost_pnl':float(ev.spread_cost_pnl_model.sum()),'model_gross_pnl':float(ev.gross_pnl_model.sum()),
              'static_fixed100_pnl':float(ev.fixed100_pnl_static.sum()),'static_fixed100_end_equity':float(100+ev.fixed100_pnl_static.sum()),
              'top1_asset_share':top_share(1),'top3_asset_share':top_share(3),'top5_asset_share':top_share(5),'top10_asset_share':top_share(10),
              'top_asset':str(assets.index[0]),'top_asset_pnl':float(assets.iloc[0]),
              'best_strategy_family':str(byfam.sort_values('net_pnl',ascending=False).strategy_family.iloc[0]),'best_strategy_family_pnl':float(byfam.net_pnl.max()),
              'losing_week_event_pnl':float(lw.net_pnl.sum()),'losing_week_trades':len(lw),'losing_week_losses':int((lw.net_pnl<0).sum()),'losing_week_wins':int((lw.net_pnl>0).sum()),
              'daily_capture':daily_capture
          }
          Path(root/'FORENSIC_ATTRIBUTION_SUMMARY.json').write_text(json.dumps(summary,indent=2,default=str))
          print(json.dumps(summary,indent=2,default=str))
          PY
      - name: Commit compact attribution outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin trailaris-ephemeral-research-20260815
          git add -f trailaris_r5_3_forensic/FORENSIC_*.csv trailaris_r5_3_forensic/FORENSIC_ATTRIBUTION_SUMMARY.json
          git commit -m 'audit: complete frozen R5.3 forensic attribution [skip ci]' || true
          git push origin HEAD:trailaris-ephemeral-research-20260815
