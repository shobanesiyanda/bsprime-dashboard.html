name: Trailaris R5.4 Strategy Payoff Audit
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_4_payoff_audit.yml']
permissions:
  contents: write
jobs:
  payoff:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct exact engines and evidence
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          cat trailaris_r5/r5.part00 trailaris_r5/r5.part01 trailaris_r5/r5.part02 trailaris_r5/r5.part03 | base64 -d | gzip -d > trailaris_r5/trailaris_r5_capture_repair.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Rebuild baseline factor feed/specs and replay
        env: {PYTHONPATH: trailaris_r4}
        run: |
          mkdir -p trailaris_r5_4/payoff_audit/results
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit trailaris_r5_4/payoff_audit/EVENT_AUDIT.csv
          python trailaris_r4/build_research_specs.py
          python trailaris_r5/trailaris_r5_capture_repair.py --rawdir trailaris_r5/raw_m1 --specs trailaris_r4/research_proxy_specs.csv --outdir trailaris_r5_4/payoff_audit/results --start 100
      - name: Analyze payoff, MFE/MAE, giveback and exits
        run: |
          python - <<'PY'
          import json,pandas as pd,numpy as np
          from pathlib import Path
          p=Path('trailaris_r5_4/payoff_audit/results');o=Path('trailaris_r5_4/payoff_audit');st=json.load(open(p/'R5_STATUS.json'));assert abs(st['end_equity']-254.4465598357797)<=1e-9
          e=pd.read_csv(p/'R5_events.csv');num=['net_pnl','net_r','gross_r','cost_r','mfe_r','mae_r','giveback_r'];
          for c in num:e[c]=pd.to_numeric(e[c],errors='coerce')
          rows=[]
          for s,g in e.groupby('strategy'):
            w=g[g.net_pnl>0];l=g[g.net_pnl<0];nf=g[g.net_pnl!=0]
            rows.append({'strategy':s,'trades':len(g),'wins':len(w),'losses':len(l),'flat':int((g.net_pnl==0).sum()),'net_pnl':float(g.net_pnl.sum()),'nonflat_win_rate':float(len(w)/len(nf)) if len(nf) else np.nan,'avg_win_usd':float(w.net_pnl.mean()) if len(w) else 0.,'avg_loss_usd':float(l.net_pnl.mean()) if len(l) else 0.,'payoff_ratio':float(w.net_pnl.mean()/abs(l.net_pnl.mean())) if len(w) and len(l) and l.net_pnl.mean()!=0 else np.nan,'avg_net_r':float(g.net_r.mean()),'avg_mfe_r':float(g.mfe_r.mean()),'avg_mae_r':float(g.mae_r.mean()),'avg_giveback_r':float(g.giveback_r.mean()),'winner_avg_mfe_r':float(w.mfe_r.mean()) if len(w) else 0.,'winner_avg_giveback_r':float(w.giveback_r.mean()) if len(w) else 0.,'loser_avg_mfe_r':float(l.mfe_r.mean()) if len(l) else 0.,'loser_avg_mae_r':float(l.mae_r.mean()) if len(l) else 0.})
          z=pd.DataFrame(rows).sort_values('net_pnl');z.to_csv(o/'R5_4_STRATEGY_PAYOFF_AUDIT.csv',index=False)
          ex=e.groupby(['strategy','exit_reason']).agg(trades=('net_pnl','size'),net_pnl=('net_pnl','sum'),avg_net_r=('net_r','mean'),avg_mfe_r=('mfe_r','mean'),avg_giveback_r=('giveback_r','mean')).reset_index().sort_values(['strategy','net_pnl']);ex.to_csv(o/'R5_4_STRATEGY_EXIT_REASON_AUDIT.csv',index=False)
          target=z[z.strategy=='MEAN_REVERSION_EXTREME'].iloc[0].to_dict() if (z.strategy=='MEAN_REVERSION_EXTREME').any() else {}
          s={'baseline_reconciled':True,'strategies':len(z),'negative_strategies':int((z.net_pnl<0).sum()),'mean_reversion_extreme':target,'worst_payoff_strategies':z.head(10).to_dict('records')};(o/'R5_4_PAYOFF_AUDIT_STATUS.json').write_text(json.dumps(s,indent=2,default=str));print(json.dumps(s,indent=2,default=str))
          PY
      - name: Commit payoff intelligence safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_4/payoff_audit/R5_4_STRATEGY_PAYOFF_AUDIT.csv trailaris_r5_4/payoff_audit/R5_4_STRATEGY_EXIT_REASON_AUDIT.csv trailaris_r5_4/payoff_audit/R5_4_PAYOFF_AUDIT_STATUS.json
          git commit -m 'audit: R5.4 strategy payoff and exit attribution [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815
          git push origin HEAD:trailaris-ephemeral-research-20260815
