name: Trailaris R5.5 Long-Cycle Bounded-Memory 26-Week Replay
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths:
      - '.github/workflows/trailaris_r5_5_longcycle_memory_26w.yml'
      - 'trailaris_r5_5/longcycle_bounded_memory_candidate.py'
      - 'trailaris_r5_5/run_longcycle_r5_5_memory_candidate.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  causal_longcycle_replay:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout active R5.5 research branch
        uses: actions/checkout@v4
        with:
          ref: trailaris-ephemeral-research-20260815
          path: active

      - name: Checkout immutable frozen R5.4 26-week estate
        uses: actions/checkout@v4
        with:
          ref: trailaris-r5-4-26week-validation-20260816
          path: frozen

      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Install replay dependencies
        run: |
          python -m pip install --quiet pandas numpy
          cd frozen
          npm install --no-save --silent dukascopy-node@1.50.0 ws

      - name: Inject only the isolated R5.5 candidate into frozen long-cycle estate
        run: |
          mkdir -p frozen/trailaris_r5_5
          cp active/trailaris_r5_5/longcycle_bounded_memory_candidate.py frozen/trailaris_r5_5/
          cp active/trailaris_r5_5/run_longcycle_r5_5_memory_candidate.py frozen/trailaris_r5_5/

      - name: Reconstruct exact frozen R4 dependencies
        working-directory: frozen
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          python -m py_compile trailaris_r4/trailaris_r4_full_universe_loop.py trailaris_r4/trailaris_r4_asset_adapter.py trailaris_r5_4/R5_BASE_CAUSAL_ENGINE.py trailaris_r5_4/reliability_common.py trailaris_r5_5/longcycle_bounded_memory_candidate.py trailaris_r5_5/run_longcycle_r5_5_memory_candidate.py

      - name: Restore exact 34-route extended M1 cache when available
        id: cache
        uses: actions/cache@v4
        with:
          path: frozen/trailaris_longcycle/raw_m1
          key: trailaris-r5-4-m1-34-20260119-20260814-v1

      - name: Acquire exact extended 34-route M1 history on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: frozen
        shell: bash
        run: |
          set -e
          rm -rf trailaris_longcycle/raw_m1 && mkdir -p trailaris_longcycle/raw_m1
          node trailaris_longcycle/acquire_m1_26w.js > trailaris_longcycle/acquire_node.log 2>&1 & P1=$!
          python trailaris_longcycle/acquire_binance_m1_26w.py > trailaris_longcycle/acquire_binance.log 2>&1 & P2=$!
          wait $P1
          wait $P2

      - name: Enforce authentic 34-route raw-history gate
        working-directory: frozen
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          routes=['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','NZDUSD','EURJPY','GBPJPY','EURGBP','AUDJPY','CADJPY','GBPCHF','XAUUSD','XAGUSD','BTCUSD','ETHUSD','SOLUSD','BNBUSD','XRPUSD','US100','US500','US30','GER40','UK100','JP225','WTI','BRENT','NATGAS','V75','V50','V100','V25','V10']
          start=pd.Timestamp('2026-01-19T00:00:00Z');end=pd.Timestamp('2026-08-14T23:59:59Z');rows=[];passed=[]
          for a in routes:
              p=Path('trailaris_longcycle/raw_m1')/f'{a}_M1_normalized.csv'
              if not p.exists(): rows.append({'asset':a,'state':'MISSING','rows':0}); continue
              d=pd.read_csv(p,usecols=['timestamp','source']);ts=pd.to_datetime(d.timestamp,utc=True,errors='coerce').sort_values();med=ts.diff().dropna().dt.total_seconds().median();first=ts.min();last=ts.max();reason=[]
              if ts.isna().any(): reason.append('bad_timestamp')
              if pd.notna(med) and med>75: reason.append(f'not_M1_median={med}')
              if first>start+pd.Timedelta(days=1): reason.append('late_start')
              if last<end-pd.Timedelta(days=2): reason.append('early_end')
              if len(d)<1000: reason.append('too_few_rows')
              state='PASS' if not reason else 'FAIL'
              if state=='PASS': passed.append(a)
              rows.append({'asset':a,'state':state,'rows':len(d),'first':str(first),'last':str(last),'median_sec':float(med) if pd.notna(med) else None,'reason':';'.join(reason)})
          o=pd.DataFrame(rows);o.to_csv('trailaris_longcycle/R5_5_34ROUTE_26W_COVERAGE.csv',index=False)
          s={'routes_required':34,'routes_pass':len(passed),'failed':sorted(set(routes)-set(passed)),'gate_pass':len(passed)==34}
          Path('trailaris_longcycle/R5_5_34ROUTE_26W_COVERAGE.json').write_text(json.dumps(s,indent=2));print(o.to_string(index=False));print(json.dumps(s,indent=2));assert s['gate_pass']
          PY

      - name: Build timestamp-causal factor evidence and exact research specs
        working-directory: frozen
        run: |
          python trailaris_longcycle/build_longcycle_factors.py --rawdir trailaris_longcycle/raw_m1 --out trailaris_longcycle/raw_m1/Trailaris_R3_FactorFeed.csv --audit trailaris_longcycle/R5_5_FACTOR_EVIDENCE_26W.json
          python trailaris_r4/build_research_specs.py

      - name: Execute apples-to-apples R5.4 control and isolated R5.5 candidate
        working-directory: frozen
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5
        run: |
          rm -rf trailaris_longcycle/r5_5_longcycle_results && mkdir -p trailaris_longcycle/r5_5_longcycle_results
          python trailaris_r5_5/run_longcycle_r5_5_memory_candidate.py --rawdir trailaris_longcycle/raw_m1 --specs trailaris_r4/research_proxy_specs.csv --outdir trailaris_longcycle/r5_5_longcycle_results

      - name: Preserve complete replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: trailaris-r5-5-bounded-memory-26week-full-evidence
          path: |
            frozen/trailaris_longcycle/r5_5_longcycle_results/
            frozen/trailaris_longcycle/R5_5_34ROUTE_26W_COVERAGE.csv
            frozen/trailaris_longcycle/R5_5_34ROUTE_26W_COVERAGE.json
            frozen/trailaris_longcycle/R5_5_FACTOR_EVIDENCE_26W.json
          retention-days: 30

      - name: Commit compact long-cycle candidate evidence to active R5.5 branch
        if: success()
        shell: bash
        run: |
          set -e
          mkdir -p active/trailaris_r5_5/longcycle_results
          cp frozen/trailaris_longcycle/r5_5_longcycle_results/R5_5_LONGCYCLE_MEMORY_STATUS.json active/trailaris_r5_5/longcycle_results/
          cp frozen/trailaris_longcycle/r5_5_longcycle_results/R5_4_CONTROL_WEEKLY.csv active/trailaris_r5_5/longcycle_results/
          cp frozen/trailaris_longcycle/r5_5_longcycle_results/R5_4_CONTROL_ROLLING_11W.csv active/trailaris_r5_5/longcycle_results/
          cp frozen/trailaris_longcycle/r5_5_longcycle_results/R5_5_CANDIDATE_WEEKLY.csv active/trailaris_r5_5/longcycle_results/
          cp frozen/trailaris_longcycle/r5_5_longcycle_results/R5_5_CANDIDATE_ROLLING_11W.csv active/trailaris_r5_5/longcycle_results/
          cp frozen/trailaris_longcycle/R5_5_34ROUTE_26W_COVERAGE.json active/trailaris_r5_5/longcycle_results/
          cd active
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_5/longcycle_results
          git commit -m 'test: R5.5 bounded-memory 26-week causal replay evidence [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815 || true
          git push origin HEAD:trailaris-ephemeral-research-20260815
