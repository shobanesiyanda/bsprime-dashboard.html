name: Trailaris R5.4 Factor Candidate Integrity
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_4_factor_candidate_integrity.yml']
permissions:
  contents: write
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct R4 engine and adapter
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Build event and merged feeds
        run: |
          mkdir -p trailaris_r5_4/factor_candidate_integrity
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5_4/factor_candidate_integrity/EVENT.csv --audit trailaris_r5_4/factor_candidate_integrity/EVENT_AUDIT.csv
          python - <<'PY'
          import pandas as pd
          cols=['timestamp','asset','orderflow_score','carry_score','funding_score','event_score','evidence_state']
          e=pd.read_csv('trailaris_r5_4/factor_candidate_integrity/EVENT.csv');f=pd.read_csv('trailaris_r5_4/crypto_funding/CRYPTO_FUNDING_BASIS_FACTOR_FEED.csv');o=pd.read_csv('trailaris_r5_4/crypto_orderflow/CRYPTO_ORDERFLOW_FACTOR_FEED.csv')
          for d in (e,f,o):
            for c in cols:
              if c not in d:d[c]=pd.NA
          for name,parts in [('EVENT_FUNDING',[e,f]),('FULL',[e,f,o])]:
            z=pd.concat([x[cols] for x in parts],ignore_index=True);z['timestamp']=pd.to_datetime(z.timestamp,utc=True,format='mixed',errors='raise');z=z.sort_values(['timestamp','asset','evidence_state']);z.to_csv(f'trailaris_r5_4/factor_candidate_integrity/{name}.csv',index=False)
          PY
      - name: Reconstruct feature cache once and compare factor candidates
        env: {PYTHONPATH: trailaris_r4}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          import trailaris_r4_full_universe_loop as r4
          raw=Path('trailaris_r5/raw_m1');data,v=r4.validate_34(raw,'research-proxy');assert len(data)==34
          fc={}
          for a in r4.ROUTES:
            _,xf=r4.generate_candidates(a,data[a]);fc[a]=xf
          out={}
          for name in ['EVENT','EVENT_FUNDING','FULL']:
            f=r4.load_factor_feed(Path(f'trailaris_r5_4/factor_candidate_integrity/{name}.csv'))
            c=r4.generate_factor_candidates(fc,f,'research-proxy')
            by=c.groupby('strategy_family').size().to_dict() if len(c) else {}
            cells=c.groupby(['asset','strategy_family']).size().reset_index().groupby('strategy_family').size().to_dict() if len(c) else {}
            out[name]={'feed_rows':len(f),'candidates':len(c),'candidate_rows_by_family':{str(k):int(v) for k,v in by.items()},'triggered_cells_by_family':{str(k):int(v) for k,v in cells.items()},'event_feed_rows_abs_ge_070':int((pd.to_numeric(f.get('event_score'),errors='coerce').abs()>=.70).sum()) if 'event_score' in f else 0}
          out['event_candidate_invariance_pass']=out['EVENT']['candidate_rows_by_family'].get('EVENT_RESPONSE',0)==out['EVENT_FUNDING']['candidate_rows_by_family'].get('EVENT_RESPONSE',0)==out['FULL']['candidate_rows_by_family'].get('EVENT_RESPONSE',0)
          p=Path('trailaris_r5_4/factor_candidate_integrity/FACTOR_CANDIDATE_INTEGRITY.json');p.write_text(json.dumps(out,indent=2));print(json.dumps(out,indent=2));assert out['event_candidate_invariance_pass']
          PY
      - name: Commit audit safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_4/factor_candidate_integrity/FACTOR_CANDIDATE_INTEGRITY.json
          git commit -m 'audit: R5.4 factor candidate invariance [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815
          git push origin HEAD:trailaris-ephemeral-research-20260815
