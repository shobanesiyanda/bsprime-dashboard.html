name: Trailaris R5.4 Factor Feed Integrity
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_4_factor_integrity.yml']
permissions:
  contents: write
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Rebuild event feed and compare merge values
        run: |
          mkdir -p trailaris_r5_4/factor_integrity
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5_4/factor_integrity/EVENT.csv --audit trailaris_r5_4/factor_integrity/EVENT_AUDIT.csv
          python - <<'PY'
          import json,pandas as pd,numpy as np
          from pathlib import Path
          e=pd.read_csv('trailaris_r5_4/factor_integrity/EVENT.csv')
          f=pd.read_csv('trailaris_r5_4/crypto_funding/CRYPTO_FUNDING_BASIS_FACTOR_FEED.csv')
          o=pd.read_csv('trailaris_r5_4/crypto_orderflow/CRYPTO_ORDERFLOW_FACTOR_FEED.csv')
          cols=['timestamp','asset','orderflow_score','carry_score','funding_score','event_score','evidence_state']
          for d in (e,f,o):
            for c in cols:
              if c not in d:d[c]=pd.NA
          z=pd.concat([e[cols],f[cols],o[cols]],ignore_index=True)
          z['timestamp']=pd.to_datetime(z.timestamp,utc=True,format='mixed',errors='raise');z=z.sort_values(['timestamp','asset','evidence_state'])
          ez=z[z.evidence_state=='RELEASED_OFFICIAL_CALENDAR_CAUSAL_POST_EVENT'].copy()
          es=pd.to_numeric(e.event_score,errors='coerce');zs=pd.to_numeric(ez.event_score,errors='coerce')
          s={'event_rows_original':len(e),'event_rows_merged':len(ez),'event_abs_ge_070_original':int((es.abs()>=.70).sum()),'event_abs_ge_070_merged':int((zs.abs()>=.70).sum()),'event_assets_original':int(e.asset.nunique()),'event_assets_merged':int(ez.asset.nunique()),'event_score_sum_original':float(es.fillna(0).sum()),'event_score_sum_merged':float(zs.fillna(0).sum()),'merge_preserves_event_scores':bool(len(e)==len(ez) and np.allclose(np.sort(es.dropna().to_numpy()),np.sort(zs.dropna().to_numpy()),rtol=0,atol=1e-12))}
          Path('trailaris_r5_4/factor_integrity/FACTOR_INTEGRITY_STATUS.json').write_text(json.dumps(s,indent=2));print(json.dumps(s,indent=2));assert s['merge_preserves_event_scores'] and s['event_abs_ge_070_original']>0
          PY
      - name: Commit audit safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_4/factor_integrity/FACTOR_INTEGRITY_STATUS.json
          git commit -m 'audit: R5.4 factor feed integrity [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815
          git push origin HEAD:trailaris-ephemeral-research-20260815
