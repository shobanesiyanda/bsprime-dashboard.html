name: Trailaris R5.4 Reliability Payoff Hybrid
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_4_hybrid_reliability_mre.yml']
permissions:
  contents: write
jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct R4 dependencies
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Rebuild exact baseline evidence/specs
        run: |
          mkdir -p trailaris_r5_4/hybrid_results
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit trailaris_r5_4/hybrid_results/EVENT_AUDIT.csv
          python trailaris_r4/build_research_specs.py
          PYTHONPATH=trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants python -m py_compile trailaris_r5_4/hybrid_reliability_mre_experiments.py
      - name: Run hybrid experiments
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants
        run: |
          python trailaris_r5_4/hybrid_reliability_mre_experiments.py --rawdir trailaris_r5/raw_m1 --specs trailaris_r4/research_proxy_specs.csv --outdir trailaris_r5_4/hybrid_results
      - name: Commit results safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_4/hybrid_results/R5_4_HYBRID_EXPERIMENTS.csv trailaris_r5_4/hybrid_results/R5_4_HYBRID_STATUS.json trailaris_r5_4/hybrid_results/*_weekly.csv
          git commit -m 'test: R5.4 reliability payoff hybrid [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815
          git push origin HEAD:trailaris-ephemeral-research-20260815
