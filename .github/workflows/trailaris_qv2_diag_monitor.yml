name: Trailaris QV2 Diagnostic Monitor

on:
  push:
    branches: [trailaris-qv2-50-independent-validation-20260818]
    paths: ['.github/workflows/trailaris_qv2_diag_monitor.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-qv2-50-independent-validation-20260818}
      - name: Snapshot active diagnostics
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p trailaris_50_asset
          gh run list --workflow trailaris_qv2_34_recompute_from_bundle.yml --branch trailaris-qv2-50-independent-validation-20260818 --limit 5 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url > trailaris_50_asset/ACTIVE_ORIGINAL34_CORRECTED_DD_STATUS.json
          gh run list --workflow trailaris_qv2_locate_exact34_events.yml --branch trailaris-qv2-50-independent-validation-20260818 --limit 5 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url > trailaris_50_asset/ACTIVE_EXACT34_EVENT_LOCATOR_STATUS.json
          gh run list --workflow trailaris_qv2_msft_raw_recovery.yml --branch trailaris-qv2-50-independent-validation-20260818 --limit 5 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url > trailaris_50_asset/ACTIVE_MSFT_RAW_RECOVERY_STATUS.json
          gh run list --workflow trailaris_qv2_deriv_paged_recovery.yml --branch trailaris-qv2-50-independent-validation-20260818 --limit 5 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url > trailaris_50_asset/ACTIVE_DERIV_PAGED_RECOVERY_STATUS.json
          gh run list --workflow trailaris_qv2_50_independent_26w_validation_v3.yml --branch trailaris-qv2-50-independent-validation-20260818 --limit 5 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url > trailaris_50_asset/ACTIVE_INDEPENDENT_V3_STATUS.json
          cat trailaris_50_asset/ACTIVE_ORIGINAL34_CORRECTED_DD_STATUS.json
          cat trailaris_50_asset/ACTIVE_EXACT34_EVENT_LOCATOR_STATUS.json
          cat trailaris_50_asset/ACTIVE_MSFT_RAW_RECOVERY_STATUS.json
          cat trailaris_50_asset/ACTIVE_DERIV_PAGED_RECOVERY_STATUS.json
          cat trailaris_50_asset/ACTIVE_INDEPENDENT_V3_STATUS.json
      - name: Commit status snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trailaris_50_asset/ACTIVE_ORIGINAL34_CORRECTED_DD_STATUS.json trailaris_50_asset/ACTIVE_EXACT34_EVENT_LOCATOR_STATUS.json trailaris_50_asset/ACTIVE_MSFT_RAW_RECOVERY_STATUS.json trailaris_50_asset/ACTIVE_DERIV_PAGED_RECOVERY_STATUS.json trailaris_50_asset/ACTIVE_INDEPENDENT_V3_STATUS.json
          git commit -m 'status: snapshot active Quant V2 diagnostics [skip ci]' || exit 0
          git pull --rebase origin trailaris-qv2-50-independent-validation-20260818 || true
          git push origin HEAD:trailaris-qv2-50-independent-validation-20260818 || true
