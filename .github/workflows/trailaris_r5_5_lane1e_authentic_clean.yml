name: Trailaris R5.5 Lane 1E Authentic Clean Management
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths:
      - 'trailaris_r5_5/lane1e_authentic_clean_management.py'
      - 'trailaris_r5_5/lane1d_results/R5_5_LANE1D_STATUS.json'
      - '.github/workflows/trailaris_r5_5_lane1e_authentic_clean.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Require committed holdout-clean Lane 1D evidence
        run: |
          git fetch origin trailaris-ephemeral-research-20260815
          git reset --hard origin/trailaris-ephemeral-research-20260815
          test -s trailaris_r5_5/lane1d_results/R5_5_LANE1D_STATUS.json
          python - <<'PY'
          import json
          s=json.load(open('trailaris_r5_5/lane1d_results/R5_5_LANE1D_STATUS.json'))
          assert s['state']=='R5_5_LANE1D_HOLDOUT_CLEAN_MANAGEMENT_DISCOVERY_COMPLETE'
          assert s['scope']=={'approved_routes':34,'strategy_families':15,'route_strategy_cells':510}
          assert abs(float(s['r5_4_control']['end_equity'])-337.4231242104393)<=1e-9
          assert int(s['r5_4_control']['executed_trades'])==1102
          assert s['split']['fresh_outcomes_used_for_selection'] is False
          assert int(s['split']['fresh_quarantine_events'])>0
          PY
      - name: Reconstruct immutable R4 dependencies
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Rebuild exact causal evidence and specs
        run: |
          mkdir -p trailaris_r5_5/lane1e_results
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit trailaris_r5_5/lane1e_results/EVENT_AUDIT.csv
          python trailaris_r4/build_research_specs.py
          python -m py_compile trailaris_r5_5/lane1b_full_replay.py trailaris_r5_5/lane1e_authentic_clean_management.py
      - name: Run authentic holdout-clean management replay
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5
        run: |
          python trailaris_r5_5/lane1e_authentic_clean_management.py \
            --rawdir trailaris_r5/raw_m1 \
            --specs trailaris_r4/research_proxy_specs.csv \
            --lane1d-status trailaris_r5_5/lane1d_results/R5_5_LANE1D_STATUS.json \
            --outdir trailaris_r5_5/lane1e_results
      - name: Assert immutable scope and forward gate
        run: |
          python - <<'PY'
          import json
          s=json.load(open('trailaris_r5_5/lane1e_results/R5_5_LANE1E_STATUS.json'))
          if s['state']=='R5_5_LANE1E_NOT_RUN_NO_CLEAN_MANAGEMENT_RULE':
              assert int(s['joint_passing_rules'])==0
          else:
              assert s['state']=='R5_5_LANE1E_AUTHENTIC_CLEAN_MANAGEMENT_COMPLETE'
              assert abs(float(s['r5_4_control']['end_equity'])-337.4231242104393)<=1e-9
              assert s['approved_scope']['approved_routes']==34
              assert s['approved_scope']['strategy_families']==15
              assert s['approved_scope']['route_strategy_cells']==510
              assert s['promotion_candidate'] is False
              assert 'NEW_UNSEEN_FORWARD_HOLDOUT_REQUIRED' in s['promotion_blockers']
              assert 'TARGET_SERVER_BROKER_EXECUTION_CERTIFICATION_REQUIRED' in s['promotion_blockers']
          PY
      - name: Commit Lane 1E evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_5/lane1e_results/R5_5_LANE1E_STATUS.json trailaris_r5_5/lane1e_results/R5_5_LANE1E_WEEKLY.csv 2>/dev/null || true
          git commit -m 'test: R5.5 Lane 1E authentic clean management evidence [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815 || true
          git push origin HEAD:trailaris-ephemeral-research-20260815 || true
