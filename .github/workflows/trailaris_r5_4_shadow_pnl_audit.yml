name: Trailaris R5.4 Shadow Leader P&L Audit
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_4_shadow_pnl_audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct R4 dependencies
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Rebuild causal evidence and specs
        run: |
          mkdir -p trailaris_r5_4/shadow_pnl_audit
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit trailaris_r5_4/shadow_pnl_audit/EVENT_AUDIT.csv
          python trailaris_r4/build_research_specs.py
      - name: Reproduce current R5.4 shadow leader and audit P&L
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          import numpy as np,pandas as pd
          import R5_BASE_CAUSAL_ENGINE as base
          import trailaris_r4_full_universe_loop as r4
          from precision_experiment_harness import eval_variant,load_module

          raw=Path('trailaris_r5/raw_m1'); out=Path('trailaris_r5_4/shadow_pnl_audit')
          data,v,cands,opps,fcache=base.build_universe(raw)
          specs=r4.load_specs(Path('trailaris_r4/research_proxy_specs.csv'),'research-proxy')
          mod=load_module(Path('trailaris_r5_4/reliability_variants/variant_hierarchical_combined.py'),'r54_shadow')
          res,W,EV,DE,PR=eval_variant(mod,data,cands,opps,fcache,specs,100.0)
          target=337.4231242104393
          assert abs(float(res['end_equity'])-target)<=1e-9,(res['end_equity'],target)
          assert int(res['executed_trades'])==1102 and int(res['losses'])==231 and int(res['wins'])==446

          for c in ['net_pnl','net_r','gross_r','cost_r','mfe_r','mae_r','giveback_r','risk_cash','equity_before','equity']:
              if c in EV: EV[c]=pd.to_numeric(EV[c],errors='coerce')
          tcol='entry_time' if 'entry_time' in EV else 'timestamp'
          EV['_time']=pd.to_datetime(EV[tcol],utc=True,errors='coerce')
          EV['entry_hour_utc']=EV['_time'].dt.hour
          EV['entry_dow']=EV['_time'].dt.day_name()
          win=EV[EV.net_pnl>0].copy(); loss=EV[EV.net_pnl<0].copy(); flat=EV[EV.net_pnl==0].copy()

          def agg_dim(col):
              if col not in EV:return pd.DataFrame()
              rows=[]
              for k,g in EV.groupby(col,dropna=False):
                  w=g[g.net_pnl>0];l=g[g.net_pnl<0];nf=g[g.net_pnl!=0]
                  rows.append({
                    col:k,'trades':len(g),'wins':len(w),'losses':len(l),'flat':int((g.net_pnl==0).sum()),
                    'net_pnl':float(g.net_pnl.sum()),'gross_win_pnl':float(w.net_pnl.sum()),'gross_loss_pnl':float(l.net_pnl.sum()),
                    'nonflat_win_rate':float(len(w)/len(nf)) if len(nf) else np.nan,
                    'avg_win_pnl':float(w.net_pnl.mean()) if len(w) else 0.0,'avg_loss_pnl':float(l.net_pnl.mean()) if len(l) else 0.0,
                    'profit_factor':float(w.net_pnl.sum()/(-l.net_pnl.sum())) if len(l) and -l.net_pnl.sum()>0 else np.nan,
                    'avg_net_r':float(g.net_r.mean()) if 'net_r' in g else np.nan,
                    'avg_mfe_r':float(g.mfe_r.mean()) if 'mfe_r' in g else np.nan,
                    'avg_mae_r':float(g.mae_r.mean()) if 'mae_r' in g else np.nan,
                    'avg_giveback_r':float(g.giveback_r.mean()) if 'giveback_r' in g else np.nan,
                    'cost_r_sum':float(g.cost_r.sum()) if 'cost_r' in g else np.nan
                  })
              return pd.DataFrame(rows).sort_values(['net_pnl','losses'],ascending=[True,False])

          dims=['asset','strategy_family','strategy','exit_reason','direction','entry_hour_utc','entry_dow','promotion_tier','eval_week']
          for d in dims:
              z=agg_dim(d)
              if len(z): z.to_csv(out/f'R5_4_CURRENT_PNL_BY_{d.upper()}.csv',index=False)

          loss_sorted=loss.sort_values('net_pnl').copy()
          cols=[c for c in ['entry_time','decision_time','exit_time','asset','strategy_family','strategy','direction','exit_reason','net_pnl','gross_r','cost_r','net_r','mfe_r','mae_r','giveback_r','risk_cash','equity_before','equity','eval_week'] if c in loss_sorted]
          loss_sorted[cols].head(100).to_csv(out/'R5_4_CURRENT_WORST_100_LOSSES.csv',index=False)

          # Diagnostic loss-source proxies. These identify candidates for repair; they are not hindsight deletion permissions.
          cost_flip=loss[(loss.gross_r>0)&(loss.net_r<0)] if {'gross_r','net_r'}.issubset(loss.columns) else loss.iloc[0:0]
          gave_back=loss[(loss.mfe_r>=0.50)&(loss.net_r<0)] if {'mfe_r','net_r'}.issubset(loss.columns) else loss.iloc[0:0]
          severe_adverse=loss[loss.mae_r>=1.50] if 'mae_r' in loss else loss.iloc[0:0]
          low_mfe=loss[loss.mfe_r<=0.20] if 'mfe_r' in loss else loss.iloc[0:0]

          # Losing-streak and correlated sequencing diagnostics.
          seq=EV.sort_values('_time').copy();seq['is_loss']=(seq.net_pnl<0).astype(int)
          streak=0;max_streak=0
          for x in seq.is_loss:
              streak=streak+1 if x else 0;max_streak=max(max_streak,streak)
          seq['date_utc']=seq['_time'].dt.date.astype(str)
          daily=seq.groupby('date_utc').agg(trades=('net_pnl','size'),net_pnl=('net_pnl','sum'),losses=('is_loss','sum')).reset_index().sort_values('net_pnl')
          daily.head(30).to_csv(out/'R5_4_CURRENT_WORST_PNL_DAYS.csv',index=False)

          gross_win=float(win.net_pnl.sum());gross_loss=float(-loss.net_pnl.sum())
          abs_loss=(-loss.net_pnl)
          summary={
            'state':'R5_4_CURRENT_SHADOW_PNL_AUDIT_COMPLETE','candidate':'variant_hierarchical_combined',
            'scope':{'routes':34,'strategy_cells':510,'strategy_families_retained':15,'assets_with_selected':int(res['assets_with_selected'])},
            'portfolio':res,
            'pnl':{
              'gross_win_dollars':gross_win,'gross_loss_dollars':gross_loss,'net_trade_pnl_dollars':float(EV.net_pnl.sum()),
              'profit_factor':float(gross_win/gross_loss),'avg_win_dollars':float(win.net_pnl.mean()),'median_win_dollars':float(win.net_pnl.median()),
              'avg_loss_dollars':float(loss.net_pnl.mean()),'median_loss_dollars':float(loss.net_pnl.median()),
              'loss_abs_p90_dollars':float(abs_loss.quantile(.90)),'loss_abs_p95_dollars':float(abs_loss.quantile(.95)),'worst_loss_dollars':float(loss.net_pnl.min())
            },
            'loss_path':{
              'loss_count':int(len(loss)),'loss_rate_all_trades':float(len(loss)/len(EV)),'loss_rate_nonflat':float(len(loss)/(len(loss)+len(win))),
              'max_consecutive_losses':int(max_streak),'worst_day_net_pnl':float(daily.net_pnl.min()),'worst_day_losses':int(daily.iloc[0].losses)
            },
            'loss_source_proxies':{
              'cost_flip_losses':int(len(cost_flip)),'cost_flip_pnl':float(cost_flip.net_pnl.sum()),
              'positive_mfe_then_loss_ge_0_5R':int(len(gave_back)),'positive_mfe_then_loss_pnl':float(gave_back.net_pnl.sum()),
              'severe_adverse_mae_ge_1_5R':int(len(severe_adverse)),'severe_adverse_pnl':float(severe_adverse.net_pnl.sum()),
              'low_mfe_le_0_2R_losses':int(len(low_mfe)),'low_mfe_pnl':float(low_mfe.net_pnl.sum())
            },
            'risk_excursion':{
              'loser_avg_mfe_r':float(loss.mfe_r.mean()),'loser_median_mfe_r':float(loss.mfe_r.median()),
              'loser_avg_mae_r':float(loss.mae_r.mean()),'loser_median_mae_r':float(loss.mae_r.median()),
              'loser_avg_giveback_r':float(loss.giveback_r.mean()),'winner_avg_giveback_r':float(win.giveback_r.mean())
            },
            'baseline_delta':{'r5_3_losses':374,'losses_removed':143,'loss_reduction_pct':100*(374-len(loss))/374,'trade_reduction_pct':100*(1393-len(EV))/1393,'ending_equity_gain_vs_r5_3':float(res['end_equity']-254.4465598357797)}
          }
          (out/'R5_4_CURRENT_PNL_LOSS_AUDIT.json').write_text(json.dumps(summary,indent=2,default=str))
          W.to_csv(out/'R5_4_CURRENT_WEEKLY.csv',index=False)
          print(json.dumps(summary,indent=2,default=str))
          PY
      - name: Commit current R5.4 audit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_4/shadow_pnl_audit/R5_4_CURRENT_*.json trailaris_r5_4/shadow_pnl_audit/R5_4_CURRENT_*.csv
          git commit -m 'audit: current R5.4 shadow-leader P&L forensic [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815
          git push origin HEAD:trailaris-ephemeral-research-20260815
