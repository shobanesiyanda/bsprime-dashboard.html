name: Trailaris R5.5 Cancel Superseded Winner Path Attribution
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_5_cancel_old_path_attribution.yml']
permissions:
  actions: write
  contents: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815, fetch-depth: 0}
      - name: Cancel superseded attribution run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api -X POST repos/${GITHUB_REPOSITORY}/actions/runs/31965161474/cancel
          exit 0
      - name: Remove one-shot canceller
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin trailaris-ephemeral-research-20260815
          git reset --hard origin/trailaris-ephemeral-research-20260815
          git rm -f .github/workflows/trailaris_r5_5_cancel_old_path_attribution.yml
          git commit -m 'chore: remove completed attribution canceller [skip ci]'
          git push origin HEAD:trailaris-ephemeral-research-20260815
