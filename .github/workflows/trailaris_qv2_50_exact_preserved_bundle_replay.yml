name: Trailaris Quant V2 — Exact 50 Preserved Bundle Replay

on:
  push:
    branches: [trailaris-quant-v2-50-asset-evaluation-20260818]
    paths:
      - '.github/workflows/trailaris_qv2_50_exact_preserved_bundle_replay.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  QV2_BLOB: 120390ab52e80f51bafedc42389ceb7420a410f2
  ORIGINAL34_ARTIFACT_ID: 9308647757
  EVAL_BRANCH: trailaris-quant-v2-50-asset-evaluation-20260818

jobs:
  bundle16:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-quant-v2-50-asset-evaluation-20260818}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact runtime
        run: |
          set -euo pipefail
          npm install --no-save --silent dukascopy-node@1.50.0
          python -m pip install --quiet pandas numpy
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v2.py)" = "$QV2_BLOB"
      - name: Restore preserved expanded-asset source bundles
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p source66
          ids=(9308965031 9308976646 9308921046 9308910212 9308970309 9309028128 9309033167 9308982790)
          digests=(1cb6c0ee68c33dc4feadf948bb0d334dfad741bde58c4ead4661c8f412c70381 b291523dc477e792ac281740d2e3dbda707d1f19a06ffd522d4aecb0655d6521 ff423bc2664e0c3e6ea6d12187f6beb9cebeddf1ac28b9c6e5d2b1ecd688bb71 d19da7e0d04c98c72ecb1f68ba0529953212b52c7bf40f12d439821f1cd5e20b d0cf217a5a994f5df2ac767d112f51a7adf4eae0b1dd36478bacc6c99e70fd3a 91e14244431e7c29be743ecf9116fca3b64cf62b4506bbd7a2689cb8a4e5e60d 7d070c8c944dff7cbd268746c1e9c6075f65cd6176bf0a06be3f11a2b20f6865 c052fdcce4f54b8fb0f60350cf7e37d2b9b94b6f453bde109a675bead8361d41)
          for i in $(seq 0 7); do
            gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/artifacts/${ids[$i]}/zip > b${i}.zip
            echo "${digests[$i]}  b${i}.zip" | sha256sum -c -
            mkdir -p source66/s${i}; unzip -q b${i}.zip -d source66/s${i}
          done
      - name: Extract exact preserved 15 additions
        run: |
          set -euo pipefail
          mkdir -p bundle16/preserved15
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          import pandas as pd
          approved=[x.strip() for x in Path('trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt').read_text().splitlines() if x.strip()]
          keep=set(approved)-{'V.US'}
          idxrows=[];parts=[]
          for f in Path('source66').rglob('FEATURE_INDEX.csv'):
              z=pd.read_csv(f)
              for _,r in z[z.asset.astype(str).isin(keep)].iterrows():
                  src=f.parent/str(r.feature_file);dst=Path('bundle16/preserved15')/str(r.feature_file)
                  shutil.copy2(src,dst);idxrows.append(r.to_dict())
          for f in Path('source66').rglob('CANDIDATES.csv.gz'):
              try:z=pd.read_csv(f)
              except pd.errors.EmptyDataError:continue
              z=z[z.asset.astype(str).isin(keep)]
              if len(z):parts.append(z)
          idx=pd.DataFrame(idxrows).drop_duplicates('asset');assert len(idx)==15 and set(idx.asset.astype(str))==keep,(len(idx),sorted(keep-set(idx.asset.astype(str))))
          C=pd.concat(parts,ignore_index=True);assert C.asset.nunique()==15
          idx.to_csv('bundle16/preserved15/FEATURE_INDEX.csv',index=False);C.to_csv('bundle16/preserved15/CANDIDATES.csv.gz',index=False,compression='gzip')
          out={'state':'PRESERVED_15_BUNDLE_EXTRACTED','assets':15,'candidate_rows':len(C),'source_run_id':32092514125,'outcome_information_used_for_extraction':False}
          Path('bundle16/preserved15/BUNDLE_SUMMARY.json').write_text(json.dumps(out,indent=2));print(json.dumps(out,indent=2))
          PY
      - name: Acquire and build V.US only
        env: {PYTHONPATH: '.:trailaris_r4:trailaris_full_universe'}
        run: |
          set -euo pipefail
          printf 'instrument_id\tcanonical_instrument\tprovider_name\nvususd\tV.US\tV.US/USD\n' > V_ONLY.tsv
          node trailaris_full_universe/acquire_duka_exact_26w_shard.js --manifest V_ONLY.tsv --outdir raw-v --shard 0 --shards 1 --concurrency 1
          python - <<'PY'
          import json
          e=json.load(open('raw-v/ACQUISITION_EVIDENCE.json'));assert e['assets_pass']==1,e
          print('V_US_EVALUATION_DATA PASS')
          PY
          python trailaris_100_asset/build_asset_bundle.py --rawdir raw-v --outdir bundle16/v-us
      - name: Verify exact approved 16
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          assets=[]
          for f in Path('bundle16').rglob('FEATURE_INDEX.csv'):assets.extend(pd.read_csv(f).asset.astype(str).tolist())
          expected=set(x.strip() for x in Path('trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt').read_text().splitlines() if x.strip())
          assert len(assets)==16 and len(set(assets))==16 and set(assets)==expected,(len(assets),sorted(set(assets)^expected))
          print('EXACT_APPROVED_16_BUNDLE PASS')
          PY
      - uses: actions/upload-artifact@v4
        with: {name: qv2-50-preserved-approved16-bundle, path: bundle16/, retention-days: 30}

  assemble:
    needs: bundle16
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-quant-v2-50-asset-evaluation-20260818}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore exact runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet pandas numpy
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v2.py)" = "$QV2_BLOB"
      - name: Restore preserved original-34 bundle
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p bundles/original34
          gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/artifacts/${ORIGINAL34_ARTIFACT_ID}/zip > original34.zip
          echo '50998265a97ea185025fc6b540f27f54e50157e9b233bfa01038c386e5750c27  original34.zip' | sha256sum -c -
          unzip -q original34.zip -d bundles/original34
      - uses: actions/download-artifact@v4
        with: {name: qv2-50-preserved-approved16-bundle, path: bundles/approved16}
      - name: Assemble exact 50 assets from preserved comparison estate
        env: {PYTHONPATH: '.:trailaris_r4'}
        run: |
          python trailaris_50_asset/assemble_50_universe.py --bundle-root bundles --factor-feed bundles/original34/Trailaris_R3_FactorFeed.csv --approved16 trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt --outdir assembled50
          python - <<'PY'
          import json
          s=json.load(open('assembled50/ASSEMBLY_SUMMARY.json'));assert s['feature_assets']==50 and s['candidate_assets']==50 and s['strategy_families']==15 and s['quant_v2_modified'] is False
          print('EXACT_50_PRESERVED_ESTATE_ASSEMBLY PASS')
          PY
      - uses: actions/upload-artifact@v4
        with: {name: qv2-50-preserved-exact-assembled, path: assembled50/, retention-days: 30}

  promote:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: {shard: [0,1,2,3,4,5]}
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-quant-v2-50-asset-evaluation-20260818}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore exact runtime
        run: |
          python -m pip install --quiet pandas numpy
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v2.py)" = "$QV2_BLOB"
          test "$(git rev-parse HEAD:trailaris_r5_5/longcycle_integrated_negative_refinement.py)" = "a6f6fcc8dfc1d265c5917dc9df3f3c73eb08d6cb"
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v1.py)" = "c3debf8da3f184d86c59a287b25a58ebe105bd03"
      - uses: actions/download-artifact@v4
        with: {name: qv2-50-preserved-exact-assembled, path: assembled50}
      - name: Execute exact weekly promotion shard
        env: {PYTHONPATH: '.:trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5'}
        run: python trailaris_50_asset/promote_50_shard.py --universe-dir assembled50 --shard ${{ matrix.shard }} --shards 6 --outdir promoted-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with: {name: qv2-50-preserved-promoted-${{ matrix.shard }}, path: promoted-${{ matrix.shard }}/, retention-days: 30}

  replay:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-quant-v2-50-asset-evaluation-20260818}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore exact runtime and closed-balance semantics
        run: |
          set -euo pipefail
          python -m pip install --quiet pandas numpy
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          python trailaris_r4/build_research_specs.py
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v2.py)" = "$QV2_BLOB"
          python - <<'PY'
          from pathlib import Path
          p=Path('trailaris_r5_4/R5_BASE_CAUSAL_ENGINE.py');s=p.read_text();old='r4.size_trade(r.asset,eq,rf,float(r.stop_distance),specs)';new='r4.size_trade(r.asset,balance,rf,float(r.stop_distance),specs)'
          assert s.count(old)==2,s.count(old);p.write_text(s.replace(old,new));assert p.read_text().count(new)==2
          print('REALIZED_CLOSED_BALANCE_SIZING PASS')
          PY
      - uses: actions/download-artifact@v4
        with: {name: qv2-50-preserved-exact-assembled, path: assembled50}
      - uses: actions/download-artifact@v4
        with: {pattern: qv2-50-preserved-promoted-*, path: promoted}
      - name: Execute exact sequential 50-asset portfolio replay
        env: {PYTHONPATH: '.:trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5'}
        run: python trailaris_50_asset/replay_50_from_promoted.py --universe-dir assembled50 --promoted-root promoted --specs trailaris_r4/research_proxy_specs.csv --balance-control trailaris_100_asset/QV2_34_BALANCE_REPLAY_RESULT.json --approved16 trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt --outdir replay50
      - uses: actions/upload-artifact@v4
        with: {name: trailaris-qv2-50-preserved-exact-replay, path: replay50/, retention-days: 30}
      - name: Preserve compact result
        run: |
          mkdir -p trailaris_50_asset/results_preserved
          cp replay50/QV2_50_REPLAY_STATUS.json trailaris_50_asset/results_preserved/
          cp replay50/QV2_50_WEEKLY.csv trailaris_50_asset/results_preserved/
          cp assembled50/ASSEMBLY_SUMMARY.json trailaris_50_asset/results_preserved/QV2_50_ASSEMBLY_SUMMARY.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trailaris_50_asset/results_preserved/
          git commit -m 'evidence: exact 50-asset preserved-estate replay [skip ci]'
          git pull --rebase origin "$EVAL_BRANCH"
          git push origin HEAD:"$EVAL_BRANCH"
