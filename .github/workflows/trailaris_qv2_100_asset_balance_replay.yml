name: Trailaris Quant V2 — 100 Asset Balance Replay

on:
  push:
    branches: [trailaris-r5-4-26week-validation-20260816]
    paths:
      - '.github/workflows/trailaris_qv2_100_asset_balance_replay.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: trailaris-qv2-100-asset-balance-replay
  cancel-in-progress: false

env:
  SOURCE_BRANCH: trailaris-quant-v2-100-asset-canonical-expansion-20260818
  QV2_BLOB: 120390ab52e80f51bafedc42389ceb7420a410f2
  DISCOVERY_ARTIFACT_ID: 9301401424

jobs:
  original34:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout cache-owning 34-asset estate
        uses: actions/checkout@v4
        with:
          ref: trailaris-r5-4-26week-validation-20260816
      - name: Checkout 100-asset replay source
        uses: actions/checkout@v4
        with:
          ref: trailaris-quant-v2-100-asset-canonical-expansion-20260818
          path: source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy
      - name: Verify Quant V2 and balance control identities
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v2.py)" = "$QV2_BLOB"
          python - <<'PY'
          import json
          p=json.load(open('trailaris_100_asset/QV2_34_BALANCE_REPLAY_RESULT.json'))
          assert p['state']=='BALANCE_REPLAY_COMPLETE'
          q=p['realized_closed_balance_replay']
          assert abs(q['end_equity']-1400.6510417217567)<1e-9
          assert q['positive_weeks']==26 and q['executed_trades']==2119
          assert abs(q['profit_factor']-3.0217601028262315)<1e-12
          print('BALANCE_CONTROL_34_VERIFIED')
          PY
      - name: Restore exact 34-asset M1 estate
        uses: actions/cache/restore@v4
        with:
          path: trailaris_longcycle/raw_m1
          key: trailaris-r5-4-m1-34-20260119-20260814-v1
          fail-on-cache-miss: true
      - name: Reconstruct R4 and canonical factor feed
        run: |
          set -euo pipefail
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          python trailaris_longcycle/build_longcycle_factors.py --rawdir trailaris_longcycle/raw_m1 --out trailaris_longcycle/raw_m1/Trailaris_R3_FactorFeed.csv --audit trailaris_longcycle/QV2_100_FACTOR_EVIDENCE.json
      - name: Build exact original-34 asset-local bundle
        env: {PYTHONPATH: '.:source:trailaris_r4'}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          routes=['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','NZDUSD','EURJPY','GBPJPY','EURGBP','AUDJPY','CADJPY','GBPCHF','XAUUSD','XAGUSD','BTCUSD','ETHUSD','SOLUSD','BNBUSD','XRPUSD','US100','US500','US30','GER40','UK100','JP225','WTI','BRENT','NATGAS','V75','V50','V100','V25','V10']
          root=Path('trailaris_longcycle/raw_m1');ev=[]
          for a in routes:
              f=root/f'{a}_M1_normalized.csv';assert f.exists(),a
              ev.append({'instrument_id':a.lower(),'canonical_instrument':a,'provider_name':a,'status':'PASS','file':str(f)})
          (root/'ACQUISITION_EVIDENCE.json').write_text(json.dumps({'assets_scheduled':34,'assets_pass':34,'evidence':ev},indent=2))
          PY
          python source/trailaris_100_asset/build_asset_bundle.py --rawdir trailaris_longcycle/raw_m1 --outdir original-bundle
          cp trailaris_longcycle/raw_m1/Trailaris_R3_FactorFeed.csv original-bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: qv2-100-original34-bundle
          path: original-bundle/
          retention-days: 30

  new66:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - name: Checkout 100-asset replay source
        uses: actions/checkout@v4
        with:
          ref: trailaris-quant-v2-100-asset-canonical-expansion-20260818
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact runtime
        run: |
          npm install --no-save --silent dukascopy-node@1.50.0
          python -m pip install --quiet pandas numpy
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - name: Materialize fixed 66 provider manifest from preserved discovery evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/artifacts/${DISCOVERY_ARTIFACT_ID}/zip > discovery.zip
          mkdir discovery && unzip -q discovery.zip -d discovery
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          names=[x.strip() for x in Path('trailaris_100_asset/ADDITIONAL_66_CANONICAL.txt').read_text().splitlines() if x.strip()]
          assert len(names)==66 and len(set(names))==66
          d=pd.read_csv('discovery/DISCOVERED_UNIVERSE.csv')
          z=d[d.canonical_instrument.astype(str).isin(names)].copy()
          assert len(z)==66 and set(z.canonical_instrument.astype(str))==set(names)
          assert z.has_full_26w_window.astype(bool).all() and z.factor_compatible.astype(bool).all()
          z=z.set_index('canonical_instrument').loc[names].reset_index()
          with open('NEW_66_MANIFEST.tsv','w') as f:
              f.write('instrument_id\tcanonical_instrument\tprovider_name\n')
              for _,r in z.iterrows():f.write(f"{r.instrument_id}\t{r.canonical_instrument}\t{r.provider_name}\n")
          print('FIXED_66_MANIFEST_VERIFIED')
          PY
      - name: Acquire exact 26-week shard
        run: node trailaris_full_universe/acquire_duka_exact_26w_shard.js --manifest NEW_66_MANIFEST.tsv --outdir raw-new --shard ${{ matrix.shard }} --shards 8 --concurrency 3
      - name: Build candidate and feature bundle
        env: {PYTHONPATH: '.:trailaris_r4'}
        run: python trailaris_100_asset/build_asset_bundle.py --rawdir raw-new --outdir new-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qv2-100-new66-bundle-${{ matrix.shard }}
          path: new-bundle/
          retention-days: 30

  assemble:
    needs: [original34,new66]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout 100-asset replay source
        uses: actions/checkout@v4
        with:
          ref: trailaris-quant-v2-100-asset-canonical-expansion-20260818
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install runtime and reconstruct R4
        run: |
          python -m pip install --quiet pandas numpy
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/download-artifact@v4
        with:
          name: qv2-100-original34-bundle
          path: bundles/original
      - uses: actions/download-artifact@v4
        with:
          pattern: qv2-100-new66-bundle-*
          path: bundles/new
      - name: Assemble exact 100-asset strategy universe
        env: {PYTHONPATH: '.:trailaris_r4'}
        run: |
          python trailaris_100_asset/assemble_100_universe.py --bundle-root bundles --factor-feed bundles/original/Trailaris_R3_FactorFeed.csv --outdir assembled
          python - <<'PY'
          import json
          s=json.load(open('assembled/ASSEMBLY_SUMMARY.json'))
          assert s['feature_assets']==100
          assert s['strategy_families']==15, s
          print('ASSEMBLY_100_X_15_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qv2-100-assembled-universe
          path: assembled/
          retention-days: 30

  replay:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout 100-asset replay source
        uses: actions/checkout@v4
        with:
          ref: trailaris-quant-v2-100-asset-canonical-expansion-20260818
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install runtime and reconstruct R4
        run: |
          python -m pip install --quiet pandas numpy
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          python trailaris_r4/build_research_specs.py
      - name: Verify preserved Quant V2 strategy identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v2.py)" = "$QV2_BLOB"
          test "$(git rev-parse HEAD:trailaris_r5_5/longcycle_integrated_negative_refinement.py)" = "a6f6fcc8dfc1d265c5917dc9df3f3c73eb08d6cb"
          test "$(git rev-parse HEAD:trailaris_r5_5/quantitative_integrated_v1.py)" = "c3debf8da3f184d86c59a287b25a58ebe105bd03"
      - uses: actions/download-artifact@v4
        with:
          name: qv2-100-assembled-universe
          path: assembled
      - name: Apply realized closed-balance lot sizing to both fresh-entry paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('trailaris_r5_4/R5_BASE_CAUSAL_ENGINE.py');s=p.read_text()
          old='r4.size_trade(r.asset,eq,rf,float(r.stop_distance),specs)';new='r4.size_trade(r.asset,balance,rf,float(r.stop_distance),specs)'
          assert s.count(old)==2,s.count(old)
          p.write_text(s.replace(old,new));assert p.read_text().count(new)==2
          print('REALIZED_BALANCE_SIZING_2_PATHS_PASS')
          PY
      - name: Execute exact Quant V2 100-asset 26-week replay
        env: {PYTHONPATH: '.:trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5'}
        run: python trailaris_100_asset/select_replay_100.py --universe-dir assembled --specs trailaris_r4/research_proxy_specs.csv --balance-control trailaris_100_asset/QV2_34_BALANCE_REPLAY_RESULT.json --outdir replay-100
      - uses: actions/upload-artifact@v4
        with:
          name: trailaris-qv2-100-asset-balance-replay
          path: replay-100/
          retention-days: 30
      - name: Commit compact 100-asset evidence
        run: |
          set -euo pipefail
          mkdir -p trailaris_100_asset/results
          cp replay-100/QV2_100_REPLAY_STATUS.json trailaris_100_asset/results/
          cp replay-100/QV2_100_WEEKLY.csv trailaris_100_asset/results/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trailaris_100_asset/results/
          git commit -m 'evidence: Quant V2 100-asset balance replay [skip ci]'
          git pull --rebase origin "$SOURCE_BRANCH"
          git push origin HEAD:"$SOURCE_BRANCH"
