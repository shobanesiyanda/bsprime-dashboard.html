name: Trailaris R5.5 Lane 6E Fast Fresh Winner Census
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths:
      - 'trailaris_r5_5/lane6e_fast_fresh_census.py'
      - '.github/workflows/trailaris_r5_5_lane6e_fast_fresh_census.yml'
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct immutable engine
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Rebuild causal feed and run census
        run: |
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit EVENT_AUDIT_6E_FAST.csv
          python trailaris_r4/build_research_specs.py
          mkdir -p trailaris_r5_5/lane6e_fast_results
          PYTHONPATH=trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5 python trailaris_r5_5/lane6e_fast_fresh_census.py --rawdir trailaris_r5/raw_m1 --rules trailaris_r5_5/lane6a_results/R5_5_LANE6A_WINNER_RULES.csv --out trailaris_r5_5/lane6e_fast_results/R5_5_LANE6E_FAST_STATUS.json
      - name: Publish diagnostic
        run: |
          cp trailaris_r5_5/lane6e_fast_results/R5_5_LANE6E_FAST_STATUS.json /tmp/status.json
          git fetch origin trailaris-ephemeral-research-20260815
          git reset --hard origin/trailaris-ephemeral-research-20260815
          mkdir -p trailaris_r5_5/lane6e_fast_results
          cp /tmp/status.json trailaris_r5_5/lane6e_fast_results/R5_5_LANE6E_FAST_STATUS.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_5/lane6e_fast_results/R5_5_LANE6E_FAST_STATUS.json
          git commit -m 'diagnostic: publish fast fresh winner census [skip ci]' || exit 0
          git push origin HEAD:trailaris-ephemeral-research-20260815
