name: Trailaris R5.4 Crypto Funding Basis Evidence
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_4_crypto_funding_basis.yml']
permissions:
  contents: write
jobs:
  funding_basis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Compile and acquire five-route native evidence
        run: |
          python -m py_compile trailaris_r5_4/build_crypto_funding_basis_feed.py
          mkdir -p trailaris_r5_4/crypto_funding
          python trailaris_r5_4/build_crypto_funding_basis_feed.py --out trailaris_r5_4/crypto_funding/CRYPTO_FUNDING_BASIS_FACTOR_FEED.csv --audit trailaris_r5_4/crypto_funding/CRYPTO_FUNDING_BASIS_AUDIT.csv
      - name: Evidence firewall
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          a=json.load(open('trailaris_r5_4/crypto_funding/CRYPTO_FUNDING_BASIS_AUDIT.csv.json'));f=pd.read_csv('trailaris_r5_4/crypto_funding/CRYPTO_FUNDING_BASIS_FACTOR_FEED.csv')
          assert a['assets_pass']==5 and set(f.asset)=={'BTCUSD','ETHUSD','SOLUSD','BNBUSD','XRPUSD'}
          assert a['trigger_rows_abs_ge_070']>0
          assert f.evidence_state.eq('VERIFIED_BINANCE_PUBLIC_FUTURES_FUNDING_BASIS_CAUSAL').all()
          print(json.dumps(a,indent=2))
          PY
      - name: Commit compact native evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_4/crypto_funding/CRYPTO_FUNDING_BASIS_AUDIT.csv trailaris_r5_4/crypto_funding/CRYPTO_FUNDING_BASIS_AUDIT.csv.json trailaris_r5_4/crypto_funding/CRYPTO_FUNDING_BASIS_FACTOR_FEED.csv
          git commit -m 'evidence: R5.4 native crypto funding-basis feed [skip ci]' || true
          git push origin HEAD:trailaris-ephemeral-research-20260815
