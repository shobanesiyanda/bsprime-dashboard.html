name: Trailaris R5.4 Crypto Order Flow Evidence
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_4_crypto_orderflow.yml','trailaris_r5_4/build_crypto_orderflow_feed.py']
permissions:
  contents: write
jobs:
  orderflow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Acquire five-route native taker-flow evidence
        run: |
          python -m py_compile trailaris_r5_4/build_crypto_orderflow_feed.py
          mkdir -p trailaris_r5_4/crypto_orderflow
          python trailaris_r5_4/build_crypto_orderflow_feed.py --out trailaris_r5_4/crypto_orderflow/CRYPTO_ORDERFLOW_FACTOR_FEED.csv --audit trailaris_r5_4/crypto_orderflow/CRYPTO_ORDERFLOW_AUDIT.csv
      - name: Evidence firewall
        run: |
          python - <<'PY'
          import json,os,pandas as pd
          a=json.load(open('trailaris_r5_4/crypto_orderflow/CRYPTO_ORDERFLOW_AUDIT.csv.json'));f=pd.read_csv('trailaris_r5_4/crypto_orderflow/CRYPTO_ORDERFLOW_FACTOR_FEED.csv')
          assert a['assets_pass']==5 and set(f.asset)=={'BTCUSD','ETHUSD','SOLUSD','BNBUSD','XRPUSD'}
          assert a['trigger_rows_abs_ge_070']>0 and (f.orderflow_score.abs()>=.70).all()
          assert f.evidence_state.eq('VERIFIED_BINANCE_USDM_TAKER_FLOW_15M_CAUSAL').all()
          assert os.path.getsize('trailaris_r5_4/crypto_orderflow/CRYPTO_ORDERFLOW_FACTOR_FEED.csv')<90_000_000
          print(json.dumps(a,indent=2))
          PY
      - name: Commit compact evidence safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_4/crypto_orderflow/CRYPTO_ORDERFLOW_AUDIT.csv trailaris_r5_4/crypto_orderflow/CRYPTO_ORDERFLOW_AUDIT.csv.json trailaris_r5_4/crypto_orderflow/CRYPTO_ORDERFLOW_FACTOR_FEED.csv
          git commit -m 'evidence: R5.4 compact native crypto order-flow feed [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815
          git push origin HEAD:trailaris-ephemeral-research-20260815
