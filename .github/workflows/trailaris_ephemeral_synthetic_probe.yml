name: Trailaris Synthetic History Probe
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_ephemeral_synthetic_probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trailaris-ephemeral-research-20260815
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --silent ws
      - name: Probe backward candle pagination
        shell: bash
        run: |
          mkdir -p trailaris_ephemeral
          node - <<'NODE'
          const fs=require('fs'); const WebSocket=require('ws');
          const symbols={V75:'R_75',V50:'R_50',V100:'R_100',V25:'R_25',V10:'R_10'};
          async function run(asset,symbol){
            const ws=new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089'); let id=1,pending=new Map();
            await new Promise((res,rej)=>{let t=setTimeout(()=>rej(new Error('open timeout')),15000);ws.once('open',()=>{clearTimeout(t);res()});ws.once('error',rej)});
            ws.on('message',m=>{let x;try{x=JSON.parse(m.toString())}catch{return};let p=pending.get(x.req_id);if(p){pending.delete(x.req_id);x.error?p.reject(new Error(x.error.message)):p.resolve(x)}});
            const req=o=>new Promise((res,rej)=>{let rid=id++;pending.set(rid,{resolve:res,reject:rej});ws.send(JSON.stringify({...o,req_id:rid}));setTimeout(()=>{if(pending.has(rid)){pending.delete(rid);rej(new Error('timeout'))}},20000)});
            let out={asset,symbol,pages:[]}; let end='latest';
            try{
              for(let page=0;page<3;page++){
                const x=await req({ticks_history:symbol,end,style:'candles',granularity:300,count:5000,adjust_start_time:1});
                const cs=x.candles||[]; const epochs=cs.map(c=>+c.epoch).filter(Number.isFinite);
                out.pages.push({page,count:cs.length,first:epochs.length?Math.min(...epochs):null,last:epochs.length?Math.max(...epochs):null,msg_type:x.msg_type||null});
                if(!epochs.length)break; end=Math.min(...epochs)-1;
              }
            }catch(e){out.error=String(e)} finally {try{ws.close()}catch{}}
            return out;
          }
          (async()=>{let result={};for(const [a,s] of Object.entries(symbols))result[a]=await run(a,s);result.pass=Object.values(result).filter(x=>x&&x.pages).every(x=>x.pages[0]?.count>100);fs.writeFileSync('trailaris_ephemeral/synthetic_probe.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));})();
          NODE
      - name: Commit probe
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trailaris_ephemeral/synthetic_probe.json
          git commit -m 'test: Deriv synthetic history pagination probe [skip ci]' || true
          git push origin HEAD:trailaris-ephemeral-research-20260815
