name: Trailaris R5.5 Lane 7 Winner-Management Fusion
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['trailaris_r5_5/lane7_trigger.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trailaris-r5-5-lane7-fusion
  cancel-in-progress: false

env:
  BRANCH: trailaris-ephemeral-research-20260815
  CACHE_KEY: trailaris-r5-m1-34-20260504-20260814-v1

jobs:
  fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trailaris-ephemeral-research-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Read locked fusion trigger
        id: cfg
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c=json.load(open('trailaris_r5_5/lane7_trigger.json'))
          assert c['state']=='R5_5_LANE7_TARGETED_FUSION_TRIGGER'
          for k in ['mode','rule_rank','copies','quality_boost','runner_frac','target_r','trail_gap','max_extra_bars']:
              print(f"{k}={c[k]}")
          PY
      - name: Reconstruct immutable engine
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: ${{ env.CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Rebuild causal inputs and run targeted full-universe fusion
        run: |
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit EVENT_AUDIT_L7.csv
          python trailaris_r4/build_research_specs.py
          python -m py_compile trailaris_r5_5/lane7_winner_management_fusion.py
          rm -rf /tmp/lane7 && mkdir -p /tmp/lane7
          PYTHONPATH=trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5 python trailaris_r5_5/lane7_winner_management_fusion.py \
            --rawdir trailaris_r5/raw_m1 \
            --specs trailaris_r4/research_proxy_specs.csv \
            --rules trailaris_r5_5/lane6a_results/R5_5_LANE6A_WINNER_RULES.csv \
            --mode '${{ steps.cfg.outputs.mode }}' \
            --rule-rank '${{ steps.cfg.outputs.rule_rank }}' \
            --copies '${{ steps.cfg.outputs.copies }}' \
            --quality-boost '${{ steps.cfg.outputs.quality_boost }}' \
            --runner-frac '${{ steps.cfg.outputs.runner_frac }}' \
            --target-r '${{ steps.cfg.outputs.target_r }}' \
            --trail-gap '${{ steps.cfg.outputs.trail_gap }}' \
            --max-extra-bars '${{ steps.cfg.outputs.max_extra_bars }}' \
            --outdir /tmp/lane7
      - name: Publish fusion evidence atomically
        run: |
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          rm -rf trailaris_r5_5/lane7_results
          mkdir -p trailaris_r5_5/lane7_results
          cp /tmp/lane7/* trailaris_r5_5/lane7_results/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_5/lane7_results
          git commit -m 'test: R5.5 targeted Lane 7 fusion evidence [skip ci]' || exit 0
          for i in 1 2 3; do
            git push origin HEAD:"$BRANCH" && exit 0
            git pull --rebase origin "$BRANCH"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: r5-lane7-fusion
          path: /tmp/lane7/*
          retention-days: 3
