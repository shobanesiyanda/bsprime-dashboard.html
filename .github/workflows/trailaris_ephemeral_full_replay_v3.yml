name: Trailaris Maximum Synchronized 34-Route Replay
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_ephemeral_full_replay_v3.yml']
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trailaris-ephemeral-research-20260815
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore synchronized history cache
        id: cache
        uses: actions/cache@v4
        with:
          path: trailaris_ephemeral/raw_common
          key: trailaris-m5-common34-20250815-20260812-v1
      - name: Install dependencies
        run: |
          python -m pip install --quiet pandas numpy
          npm install --no-save --silent dukascopy-node ws
      - name: Materialize maximum synchronized histories
        run: |
          set -euo pipefail
          mkdir -p trailaris_ephemeral/raw_common
          node trailaris_ephemeral/acquire_common.js > trailaris_ephemeral/acquire_common.log 2>&1 & P1=$!
          python trailaris_ephemeral/acquire_binance_common.py > trailaris_ephemeral/acquire_binance_common.log 2>&1 & P2=$!
          wait $P1; wait $P2
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          routes=['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','NZDUSD','EURJPY','GBPJPY','EURGBP','AUDJPY','CADJPY','GBPCHF','XAUUSD','XAGUSD','BTCUSD','ETHUSD','SOLUSD','BNBUSD','XRPUSD','US100','US500','US30','GER40','UK100','JP225','WTI','BRENT','NATGAS','V75','V50','V100','V25','V10']
          a=json.load(open('trailaris_ephemeral/coverage_common_node.json'));a.update(json.load(open('trailaris_ephemeral/coverage_common_binance.json')))
          rows={};first={};last={};missing=[]
          for r in routes:
              p=Path('trailaris_ephemeral/raw_common')/(r+'.csv')
              if not p.exists():rows[r]=0;missing.append(r);continue
              d=pd.read_csv(p,usecols=['timestamp']);rows[r]=len(d)
              if len(d):first[r]=int(d.timestamp.min());last[r]=int(d.timestamp.max())
              if len(d)<100:missing.append(r)
          common_start=max(first.values()) if first else None;common_end=min(last.values()) if last else None
          out={'routes_required':34,'routes_materialized':34-len(missing),'missing':missing,'rows':rows,'first':first,'last':last,'common_start_ms':common_start,'common_end_ms':common_end,'sources':a,'gate_pass':not missing}
          Path('trailaris_ephemeral/coverage_common_all.json').write_text(json.dumps(out,indent=2,default=str));print(json.dumps({'routes':out['routes_materialized'],'missing':missing,'common_start_ms':common_start,'common_end_ms':common_end,'min_rows':min(rows.values())},indent=2))
          if missing:raise SystemExit('34/34 COMMON DATA GATE FAIL: '+','.join(missing))
          PY
      - name: Save synchronized data cache
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: trailaris_ephemeral/raw_common
          key: trailaris-m5-common34-20250815-20260812-v1
      - name: Run causal train-validation-holdout replay with compounding
        run: |
          rm -rf trailaris_ephemeral/results && mkdir -p trailaris_ephemeral/results
          sed -e "s#RAW=ROOT/'raw'#RAW=ROOT/'raw_common'#" -e "s/pd.Timedelta(days=365)/pd.Timedelta(days=300)/" trailaris_ephemeral/replay_full.py > trailaris_ephemeral/replay_full_v3.py
          python trailaris_ephemeral/replay_full_v3.py | tee trailaris_ephemeral/replay_full_v3.log
      - name: Acceptance audit
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          s=json.load(open('trailaris_ephemeral/results/summary.json'));r=pd.read_csv('trailaris_ephemeral/results/route_results.csv');w=pd.read_csv('trailaris_ephemeral/results/weekly_results.csv');m=pd.read_csv('trailaris_ephemeral/results/monthly_results.csv')
          assert len(r)==34 and s['scope_gate_open']=='34/34 PASS' and s['scope_gate_close']=='34/34 PASS' and len(w)>=8 and len(m)>=2
          audit={'routes':len(r),'selected_routes':int(r.selected.sum()),'weekly_rows':len(w),'monthly_rows':len(m),'scope_open':s['scope_gate_open'],'scope_close':s['scope_gate_close'],'pass':True}
          Path('trailaris_ephemeral/results/acceptance_audit.json').write_text(json.dumps(audit,indent=2));print(json.dumps(audit,indent=2));print(json.dumps(s['canonical_100_stress'],indent=2))
          PY
      - name: Commit compact results
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_ephemeral/coverage_common_all.json 2>/dev/null || true
          git add -f trailaris_ephemeral/results/summary.json trailaris_ephemeral/results/acceptance_audit.json trailaris_ephemeral/results/route_results.csv trailaris_ephemeral/results/portfolio_scenarios.csv trailaris_ephemeral/results/weekly_results.csv trailaris_ephemeral/results/monthly_results.csv trailaris_ephemeral/results/data_coverage.csv 2>/dev/null || true
          git commit -m 'test: maximum synchronized 34-route compounded replay [skip ci]' || true
          git push origin HEAD:trailaris-ephemeral-research-20260815
