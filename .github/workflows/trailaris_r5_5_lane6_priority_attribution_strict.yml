name: Trailaris R5.5 Lane 6 Priority Attribution Strict
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths:
      - 'trailaris_r5_5/lane6_priority_attribution_strict.py'
      - '.github/workflows/trailaris_r5_5_lane6_priority_attribution_strict.yml'
permissions:
  contents: write
concurrency:
  group: trailaris-r5-5-lane6-priority-strict
  cancel-in-progress: false
jobs:
  attribute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct immutable engine
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Rebuild causal evidence and run strict priority attribution
        run: |
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit EVENT_AUDIT_L6_PRIORITY_STRICT.csv
          python trailaris_r4/build_research_specs.py
          rm -rf trailaris_r5_5/lane6_priority_strict_results
          mkdir -p trailaris_r5_5/lane6_priority_strict_results
          PYTHONPATH=trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5 python trailaris_r5_5/lane6_priority_attribution_strict.py --rawdir trailaris_r5/raw_m1 --specs trailaris_r4/research_proxy_specs.csv --outdir trailaris_r5_5/lane6_priority_strict_results
      - name: Publish evidence
        run: |
          cp -a trailaris_r5_5/lane6_priority_strict_results /tmp/l6prio
          git fetch origin trailaris-ephemeral-research-20260815
          git reset --hard origin/trailaris-ephemeral-research-20260815
          rm -rf trailaris_r5_5/lane6_priority_strict_results
          cp -a /tmp/l6prio trailaris_r5_5/lane6_priority_strict_results
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_5/lane6_priority_strict_results
          git commit -m 'research: R5.5 strict priority attribution evidence [skip ci]' || exit 0
          git push origin HEAD:trailaris-ephemeral-research-20260815
