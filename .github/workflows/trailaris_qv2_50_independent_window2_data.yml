name: Trailaris Quant V2 — Independent Window 2 Data Gate
on:
  push:
    branches: [trailaris-qv2-50-independent-validation-20260818]
    paths: ['.github/workflows/trailaris_qv2_50_independent_window2_data.yml']
permissions:
  actions: read
  contents: read
env:
  DISCOVERY_ARTIFACT_ID: 9301401424
  START: '2024-12-16T00:00:00Z'
  END: '2025-07-14T00:00:00Z'
jobs:
  acquire34:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-qv2-50-independent-validation-20260818}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install acquisition runtime
        run: |
          npm install --no-save --silent dukascopy-node@1.50.0 ws
          python -m pip install --quiet pandas numpy
      - name: Acquire untouched original-34 raw estate
        shell: bash
        run: |
          set -euo pipefail
          node trailaris_50_asset/acquire_independent_core.js --start "$START" --end "$END" --outdir raw_core --chunk-days 28 > core.log 2>&1 & P1=$!
          python trailaris_50_asset/acquire_independent_crypto.py --start "$START" --end "$END" --outdir raw_crypto > crypto.log 2>&1 & P2=$!
          FAIL=0; wait $P1 || FAIL=1; wait $P2 || FAIL=1
          cat core.log; cat crypto.log
          test "$FAIL" = 0
      - name: Merge and enforce exact 34 data gate
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          routes=['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','NZDUSD','EURJPY','GBPJPY','EURGBP','AUDJPY','CADJPY','GBPCHF','XAUUSD','XAGUSD','BTCUSD','ETHUSD','SOLUSD','BNBUSD','XRPUSD','US100','US500','US30','GER40','UK100','JP225','WTI','BRENT','NATGAS','V75','V50','V100','V25','V10']
          root=Path('raw34');root.mkdir();rows=[]
          for src,name in [(Path('raw_core'),'ACQUISITION_EVIDENCE_CORE.json'),(Path('raw_crypto'),'ACQUISITION_EVIDENCE_CRYPTO.json')]:
              e=json.loads((src/name).read_text())
              for r in e['evidence']:
                  asset=str(r['canonical_instrument']);p=src/f'{asset}_M1_normalized.csv'
                  if r['status']=='PASS':
                      assert p.exists(),(asset,p);dst=root/p.name;shutil.copy2(p,dst);r['file']=str(dst)
                  rows.append(r)
          assert len(rows)==34 and {r['canonical_instrument'] for r in rows}==set(routes)
          bad=[r for r in rows if r['status']!='PASS' or not r.get('full_window_coverage')]
          assert not bad,bad
          out={'state':'INDEPENDENT_WINDOW2_34_DATA_PASS','start':'2024-12-16T00:00:00Z','end_exclusive':'2025-07-14T00:00:00Z','assets_scheduled':34,'assets_pass':34,'evidence':rows,'data_reused_from_2026':False,'strategy_outcomes_used':False}
          (root/'ACQUISITION_EVIDENCE.json').write_text(json.dumps(out,indent=2));print('INDEPENDENT_WINDOW2_34_DATA_GATE PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qv2-independent-window2-raw34
          path: raw34/
          retention-days: 30

  acquire16:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-qv2-50-independent-validation-20260818}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install acquisition runtime
        run: |
          npm install --no-save --silent dukascopy-node@1.50.0
          python -m pip install --quiet pandas
      - name: Resolve immutable approved-16 provider identities
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api repos/shobanesiyanda/bsprime-dashboard.html/actions/artifacts/${DISCOVERY_ARTIFACT_ID}/zip > discovery.zip
          mkdir discovery && unzip -q discovery.zip -d discovery
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          approved=[x.strip() for x in Path('trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt').read_text().splitlines() if x.strip()]
          expected=['COCOA.CMD','SUGAR.CMD','COFFEE.CMD','AAPL.US','SOYBEAN.CMD','NVDA.US','MSFT.US','USDCNH','V.US','AUDNZD','EURCHF','GBPNZD','FRA.IDX','TSLA.US','CHI.IDX','COPPER.CMD'];assert approved==expected
          d=pd.read_csv('discovery/DISCOVERED_UNIVERSE.csv');by={str(r.canonical_instrument):r for _,r in d.iterrows()};assert set(approved)<=set(by)
          with open('APPROVED16.tsv','w') as f:
              f.write('instrument_id\tcanonical_instrument\tprovider_name\n')
              for asset in approved:
                  r=by[asset];f.write(f"{r.instrument_id}\t{asset}\t{r.provider_name}\n")
          print('APPROVED16_PROVIDER_IDENTITY PASS')
          PY
      - name: Acquire untouched exact approved-16 raw estate
        run: node trailaris_50_asset/acquire_independent_manifest.js --manifest APPROVED16.tsv --start "$START" --end "$END" --outdir raw16 --concurrency 4 --chunk-days 28
      - name: Enforce exact 16 data gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('raw16/ACQUISITION_EVIDENCE_ADDITIONS.json').read_text());approved=[x.strip() for x in Path('trailaris_50_asset/QV2_50_APPROVED_EVALUATION_16.txt').read_text().splitlines() if x.strip()]
          assert e['assets_scheduled']==16 and e['assets_pass']==16,(e['assets_pass'],[(r['canonical_instrument'],r['status'],r.get('error','')) for r in e['evidence'] if r['status']!='PASS'])
          assert {r['canonical_instrument'] for r in e['evidence']}==set(approved)
          assert all(r.get('conflicting_duplicates',0)==0 and r.get('invalid_ohlc',0)==0 for r in e['evidence'])
          for r in e['evidence']:r['file']=str(Path('raw16')/f"{r['canonical_instrument']}_M1_normalized.csv")
          e['state']='INDEPENDENT_WINDOW2_16_DATA_PASS';e['data_reused_from_2026']=False;e['strategy_outcomes_used']=False;Path('raw16/ACQUISITION_EVIDENCE.json').write_text(json.dumps(e,indent=2));print('INDEPENDENT_WINDOW2_16_DATA_GATE PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qv2-independent-window2-raw16
          path: raw16/
          retention-days: 30
# broad-terminal-recovery-rerun
