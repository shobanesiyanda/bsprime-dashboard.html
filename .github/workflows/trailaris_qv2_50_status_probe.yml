name: Trailaris Quant V2 — 50 Selection Status Probe
on:
  push:
    branches: [trailaris-r5-4-26week-validation-20260816]
    paths: ['.github/workflows/trailaris_qv2_50_status_probe.yml']
permissions:
  actions: read
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-quant-v2-50-asset-complementarity-20260818}
      - name: Capture fast continuation run
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api 'repos/shobanesiyanda/bsprime-dashboard.html/actions/runs?branch=trailaris-r5-4-26week-validation-20260816&per_page=50' > /tmp/runs.json
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          d=json.load(open('/tmp/runs.json'));name='Trailaris Quant V2 — 50 Selection Fast Continuation'
          rs=[r for r in d.get('workflow_runs',[]) if r.get('name')==name]
          if not rs: raise SystemExit('fast continuation not found')
          r=sorted(rs,key=lambda x:x['created_at'],reverse=True)[0]
          jobs=json.loads(subprocess.check_output(['gh','api',f"repos/shobanesiyanda/bsprime-dashboard.html/actions/runs/{r['id']}/jobs?per_page=100"],text=True)).get('jobs',[])
          out={'run_id':r['id'],'status':r['status'],'conclusion':r.get('conclusion'),'jobs':[{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j.get('conclusion')} for j in jobs]}
          Path('trailaris_50_asset/ACTIVE_SELECTION_FAST_STATUS.json').write_text(json.dumps(out,indent=2));print(json.dumps(out,indent=2))
          PY
      - name: Commit snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trailaris_50_asset/ACTIVE_SELECTION_FAST_STATUS.json
          git commit -m 'ops: snapshot fast 50-selection [skip ci]'
          git pull --rebase origin trailaris-quant-v2-50-asset-complementarity-20260818
          git push origin HEAD:trailaris-quant-v2-50-asset-complementarity-20260818
