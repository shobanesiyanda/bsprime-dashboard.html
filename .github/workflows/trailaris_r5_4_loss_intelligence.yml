name: Trailaris R5.4 Losing-Trade Intelligence Audit
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_4_loss_intelligence.yml']
permissions:
  contents: write
jobs:
  loss_intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct engines and exact R5.3 evidence
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
          cat trailaris_r5/r5.part00 trailaris_r5/r5.part01 trailaris_r5/r5.part02 trailaris_r5/r5.part03 | base64 -d | gzip -d > trailaris_r5/trailaris_r5_capture_repair.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Rebuild causal event factor feed and specs
        run: |
          mkdir -p trailaris_r5_4/loss_audit
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit trailaris_r5_4/loss_audit/EVENT_AUDIT.csv
          python trailaris_r4/build_research_specs.py
      - name: Reproduce hard-locked baseline ledger
        env: {PYTHONPATH: trailaris_r4}
        run: |
          rm -rf trailaris_r5_4/loss_audit/results && mkdir -p trailaris_r5_4/loss_audit/results
          python trailaris_r5/trailaris_r5_capture_repair.py --rawdir trailaris_r5/raw_m1 --specs trailaris_r4/research_proxy_specs.csv --outdir trailaris_r5_4/loss_audit/results --start 100
      - name: Assert exact baseline and analyze losing trades
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np,pandas as pd
          p=Path('trailaris_r5_4/loss_audit/results');out=Path('trailaris_r5_4/loss_audit')
          st=json.load(open(p/'R5_STATUS.json')); target=254.4465598357797
          assert abs(float(st['end_equity'])-target)<=1e-9,(st['end_equity'],target)
          ev=pd.read_csv(p/'R5_events.csv');de=pd.read_csv(p/'R5_decisions.csv')
          ev['net_pnl']=pd.to_numeric(ev.net_pnl,errors='coerce').fillna(0);loss=ev[ev.net_pnl<0].copy();win=ev[ev.net_pnl>0].copy();flat=ev[ev.net_pnl==0].copy()
          # Time-derived diagnostics are causal descriptors of already executed entries.
          for d in (ev,loss,win,flat):
            for tc in ['entry_time','entry_ts','timestamp','open_time']:
              if tc in d.columns:
                t=pd.to_datetime(d[tc],utc=True,errors='coerce');d['entry_hour_utc']=t.dt.hour;d['entry_dow']=t.dt.day_name();break
          rows=[]
          def add_group(col):
            if col not in ev.columns:return
            z=ev.groupby(col,dropna=False).agg(trades=('net_pnl','size'),net_pnl=('net_pnl','sum'),wins=('net_pnl',lambda s:int((s>0).sum())),losses=('net_pnl',lambda s:int((s<0).sum())),flat=('net_pnl',lambda s:int((s==0).sum())),avg_pnl=('net_pnl','mean')).reset_index()
            z['nonflat_win_rate']=z.wins/(z.wins+z.losses).replace(0,np.nan);z['dimension']=col;z['value']=z[col].astype(str);z=z.drop(columns=[col]);rows.append(z)
          preferred=['asset','strategy_family','family','strategy','config_id','configuration','tier','direction','side','entry_hour_utc','entry_dow','session','regime','entry_reason','signal_type']
          for c in preferred:add_group(c)
          slices=pd.concat(rows,ignore_index=True) if rows else pd.DataFrame()
          if len(slices):slices.sort_values(['dimension','net_pnl','losses'],ascending=[True,True,False]).to_csv(out/'R5_4_LOSS_SLICES.csv',index=False)
          loss_by_asset=loss.groupby('asset').agg(losses=('net_pnl','size'),loss_dollars=('net_pnl','sum'),avg_loss=('net_pnl','mean')).sort_values('loss_dollars').reset_index();loss_by_asset.to_csv(out/'R5_4_LOSS_BY_ASSET.csv',index=False)
          # Schema permits next repair to use only actually available causal features.
          schema={'event_columns':list(ev.columns),'decision_columns':list(de.columns)}
          (out/'R5_4_LEDGER_SCHEMA.json').write_text(json.dumps(schema,indent=2))
          summary={'baseline_reconciled':True,'start_equity':float(st['start_equity']),'end_equity':float(st['end_equity']),'executed_trades':int(len(ev)),'wins':int(len(win)),'losses':int(len(loss)),'flat':int(len(flat)),'nonflat_win_rate':float(len(win)/(len(win)+len(loss))),'gross_loss_dollars':float(-loss.net_pnl.sum()),'gross_win_dollars':float(win.net_pnl.sum()),'profit_factor_on_nonflat':float(win.net_pnl.sum()/(-loss.net_pnl.sum())),'worst_loss_assets':loss_by_asset.head(10).to_dict('records'),'diagnostic_dimensions_present':[c for c in preferred if c in ev.columns]}
          (out/'R5_4_LOSS_INTELLIGENCE_STATUS.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary,indent=2))
          PY
      - name: Commit compact loss intelligence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_4/loss_audit/R5_4_LOSS_INTELLIGENCE_STATUS.json trailaris_r5_4/loss_audit/R5_4_LOSS_BY_ASSET.csv trailaris_r5_4/loss_audit/R5_4_LOSS_SLICES.csv trailaris_r5_4/loss_audit/R5_4_LEDGER_SCHEMA.json
          git commit -m 'audit: R5.4 losing-trade intelligence [skip ci]' || true
          git push origin HEAD:trailaris-ephemeral-research-20260815
