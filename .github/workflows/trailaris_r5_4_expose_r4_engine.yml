name: Trailaris R5.4 Expose R4 Factory
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths: ['.github/workflows/trailaris_r5_4_expose_r4_engine.yml']
permissions:
  contents: write
jobs:
  expose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r5_4/R4_FACTORY_BASE.py
          python -m py_compile trailaris_r5_4/R4_FACTORY_BASE.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_4/R4_FACTORY_BASE.py
          git commit -m 'build: expose R4 factory for R5.4 intelligence [skip ci]' || true
          git push origin HEAD:trailaris-ephemeral-research-20260815
