name: Trailaris R5.5 Lane 6A Winner Attribution
on:
  push:
    branches: [trailaris-ephemeral-research-20260815]
    paths:
      - 'trailaris_r5_5/lane6_winner_attribution.py'
      - '.github/workflows/trailaris_r5_5_lane6a_winner_attribution.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-ephemeral-research-20260815}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy
      - name: Reconstruct immutable R4 dependencies
        run: |
          cat trailaris_r4/r4_runner.part00 trailaris_r4/r4_runner.part01 trailaris_r4/r4_runner.part02 trailaris_r4/r4_runner.part03 trailaris_r4/r4_runner.part040 trailaris_r4/r4_runner.part041 trailaris_r4/r4_runner.part05 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_full_universe_loop.py
          cat trailaris_r4/r4_adapter.part00 trailaris_r4/r4_adapter.part01 | base64 -d | gzip -d > trailaris_r4/trailaris_r4_asset_adapter.py
      - uses: actions/cache@v4
        with:
          path: trailaris_r5/raw_m1
          key: trailaris-r5-m1-34-20260504-20260814-v1
          fail-on-cache-miss: true
      - name: Rebuild causal evidence and specs
        run: |
          mkdir -p trailaris_r5_5/lane6a_results
          python trailaris_r5_3/build_released_event_factor_feed.py --rawdir trailaris_r5/raw_m1 --out trailaris_r5/raw_m1/Trailaris_R3_FactorFeed.csv --audit trailaris_r5_5/lane6a_results/EVENT_AUDIT.csv
          python trailaris_r4/build_research_specs.py
          python -m py_compile trailaris_r5_5/lane6_winner_attribution.py
      - name: Run full-universe winner attribution
        env:
          PYTHONPATH: trailaris_r4:trailaris_r5_4:trailaris_r5_4/reliability_variants:trailaris_r5_5
        run: |
          python trailaris_r5_5/lane6_winner_attribution.py \
            --rawdir trailaris_r5/raw_m1 \
            --specs trailaris_r4/research_proxy_specs.csv \
            --outdir trailaris_r5_5/lane6a_results
      - name: Assert incumbent reproduction, scope and quarantine
        run: |
          python - <<'PY'
          import json
          s=json.load(open('trailaris_r5_5/lane6a_results/R5_5_LANE6A_STATUS.json'))
          assert s['state']=='R5_5_LANE6A_WINNER_ATTRIBUTION_COMPLETE'
          assert abs(float(s['incumbent_lane1b2']['end_equity'])-343.5447309255116)<=1e-6
          assert s['scope']=={'approved_routes':34,'strategy_families':15,'route_strategy_cells':510}
          assert s['partition']['fresh_outcomes_used_for_selection'] is False
          assert s['winner_forensics']['wins']>=446
          PY
      - name: Commit winner attribution evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f trailaris_r5_5/lane6a_results/R5_5_LANE6A_STATUS.json trailaris_r5_5/lane6a_results/R5_5_LANE6A_WINNER_RULES.csv trailaris_r5_5/lane6a_results/R5_5_LANE6A_WINNERS_BY_FAMILY.csv trailaris_r5_5/lane6a_results/R5_5_LANE6A_WINNERS_BY_ASSET_CLASS.csv 2>/dev/null || true
          git commit -m 'test: R5.5 Lane 6A winner attribution evidence [skip ci]' || true
          git pull --rebase origin trailaris-ephemeral-research-20260815 || true
          git push origin HEAD:trailaris-ephemeral-research-20260815 || true
