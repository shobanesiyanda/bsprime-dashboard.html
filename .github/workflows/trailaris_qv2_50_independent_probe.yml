name: Trailaris Quant V2 — Independent Validation Probe
on:
  push:
    branches: [trailaris-qv2-50-independent-validation-20260818]
    paths: ['.github/workflows/trailaris_qv2_50_independent_probe.yml']
permissions:
  actions: read
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: trailaris-qv2-50-independent-validation-20260818}
      - name: Capture boundary and recovery lanes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api 'repos/shobanesiyanda/bsprime-dashboard.html/actions/runs?branch=trailaris-qv2-50-independent-validation-20260818&per_page=100' >/tmp/runs.json
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          d=json.load(open('/tmp/runs.json'));out={}
          targets=[
            ('boundary','Trailaris Quant V2 — Common Continuous Coverage Boundary'),
            ('isolated34','Trailaris Quant V2 — Window 2 Exact 34 Isolated Recovery'),
            ('derivtest','Trailaris Quant V2 — Window 2 Deriv Recovery Test'),
            ('isolated16','Trailaris Quant V2 — Window 2 Exact 16 Isolated Recovery')]
          for key,name in targets:
              rs=[r for r in d['workflow_runs'] if r.get('name')==name]
              if not rs:out[key]={'state':'MISSING'};continue
              r=sorted(rs,key=lambda x:x['created_at'],reverse=True)[0]
              jobs=json.loads(subprocess.check_output(['gh','api',f"repos/shobanesiyanda/bsprime-dashboard.html/actions/runs/{r['id']}/jobs?per_page=100"],text=True))['jobs']
              out[key]={'run_id':r['id'],'status':r['status'],'conclusion':r.get('conclusion'),'head_sha':r['head_sha'],'created_at':r['created_at'],'updated_at':r['updated_at'],'jobs':[{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j.get('conclusion'),'steps':[{'name':s['name'],'status':s['status'],'conclusion':s.get('conclusion')} for s in j.get('steps',[])]} for j in jobs]}
          Path('trailaris_50_asset/ACTIVE_BOUNDARY_AND_RECOVERY_STATUS.json').write_text(json.dumps(out,indent=2));print(json.dumps(out,indent=2))
          PY
      - name: Commit snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trailaris_50_asset/ACTIVE_BOUNDARY_AND_RECOVERY_STATUS.json
          git commit -m 'ops: snapshot boundary and recovery lanes [skip ci]' || exit 0
          git pull --rebase origin trailaris-qv2-50-independent-validation-20260818 || true
          git push origin HEAD:trailaris-qv2-50-independent-validation-20260818 || true
# boundary-recovery-status
